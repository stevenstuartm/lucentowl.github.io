<title id="hl1-title">How Hearthline's product is built today</title>
<desc id="hl1-desc">One application, released as one unit, holds five teams' areas: booking, dispatch, mobile sync, invoicing, and integrations. All of them go through one shared data layer, and queries across teams' areas are common. Everything is in one database. The Jobs table is written by booking, dispatch, mobile sync, and invoicing, and has no owner. Every other table is mostly used by one team.</desc>
