<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="hl4-title hl4-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="hl4-title">The Jobs table before and after Hearthline gives it a single owner</title>
<desc id="hl4-desc">Before: the booking, dispatch, mobile sync, and invoicing modules each read and write the Jobs table directly, so a change to Jobs can break any of four teams. After: booking, mobile sync, and invoicing call the Jobs interface of the Dispatch module, which is the only module allowed to write the jobs schema. Other teams depend on the interface, not the table.</desc>
