<title id="hl2-title">Where Hearthline's four working days from merge to production go, and why releases were delayed</title>
<desc id="hl2-desc">A stacked bar of the average four working days from merge to production: about 2 working days waiting for the Friday release cut, 2 for the Monday QA pass and the Tuesday deploy, and about a third of a day from delayed releases. Below, a bar chart of why 11 of 52 weekly releases were delayed last year: 5 flaky tests that passed on a rerun, 4 cases of one team's change breaking another team's tests, 3 of them through the Jobs table, and 2 migrations that failed their staging rehearsal.</desc>
