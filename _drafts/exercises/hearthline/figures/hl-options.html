<title id="hl3-title">Three answers to the CTO's question about splitting Hearthline's product</title>
<desc id="hl3-desc">Three panels. A, process changes then measure: the app stays one release unit with its shared data layer, shipped daily after a merge queue, automated regression, flaky-test quarantine, reverting breaking changes instead of delaying the release, and backward-compatible migrations, and the Jobs table keeps four writers until two months of evidence decide its future. B, process changes and an owner for Jobs now: everything in A, plus a Jobs interface owned by the Dispatch module, with Jobs moved into Dispatch's own schema. C, split starting at the edge: Integrations becomes a separately released service next to the app, both still using the shared database with its shared tables unchanged, so there are two release cycles on one schema, and the other teams keep waiting unless A's changes happen too.</desc>
