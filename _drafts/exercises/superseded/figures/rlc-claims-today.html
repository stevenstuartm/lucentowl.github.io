<title id="rlc5-title">How claims work at Ridgeline Mutual today</title>
<desc id="rlc5-desc">A policyholder with a claim phones the contact center. The agent types the call into a case using the CRM's own web screens. The CRM is third-party SaaS: agents, the claims supervisor who reads new cases and triages them by hand, and adjusters who work their assigned cases all use its screens in the browser with corporate single sign-on. Ridgeline has no access to the CRM's database. Other systems reach CRM data only through its REST API, which throttles at peak. The CRM can also call out with webhooks on case events, but nothing uses them today. Separately, the policyholder can use the team-built portal website, a React single-page app, to view policies and claim status, but not to report a claim. The website calls the team-built Portal API, which serves the website only, accepts only policyholder sign-ins, and reads claim status from the CRM's REST API with a five-minute cache.</desc>
