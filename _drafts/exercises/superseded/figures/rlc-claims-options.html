<title id="rlc3-title">Four ways to deploy Ridgeline Mutual's claims system</title>
<desc id="rlc3-desc">Four panels show the same four jobs, intake, triage, handoff and notify, grouped into deployments. A, extend the portal, puts all four jobs inside the existing Portal API next to the portal's own code, with claims tables in the Portal DB. That means the CRM's webhook becomes the first caller the policyholder-only Portal API accepts that isn't a policyholder. B, a modular monolith, puts all four jobs as modules in one new claims app on App Service with one Claims DB holding a schema per module. Intake saves and returns and the rest follows. C, split out intake, has an Intake service that writes to a Service Bus queue, read by a claims app holding triage, handoff and notify, which owns the Claims DB, and the queue is the first broker the team has run. D, coarse services, deploys each job as its own service with its own pipeline, all four sharing one Claims DB.</desc>
