<title id="rlc1-title">The claims system Ridgeline Mutual will build, before its architecture style is chosen</title>
<desc id="rlc1-desc">The claims system is one undecided box holding four jobs: intake of a website report or a CRM webhook, triage for severity and queue, handoff of the case to the CRM, and notification by email or text. It handles about 30 claims a day and took 4,800 in 72 hours after last June's storm. Claims arrive two ways. Policyholders report claims with photos through a new form on the existing, team-built portal website and API, which accepts only policyholder sign-ins through the customer identity service. Whether the claims work is part of the portal or its own system is the open question. Contact center agents keep taking phoned-in claims in the CRM's own screens, on a new structured claim form configured without code, and the CRM sends a webhook when an agent saves a claim. The claims system creates the CRM case for a website report, or writes severity and queue onto the agent's case, through the CRM's REST API, which throttles at peak, and notifies the policyholder through an email and text delivery service.</desc>
