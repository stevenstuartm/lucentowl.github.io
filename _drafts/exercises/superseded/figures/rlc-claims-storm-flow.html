<title id="rlc4-title">How a modular monolith handles a storm's worth of claim reports</title>
<desc id="rlc4-desc">Option B, one claims app on App Service scaled out for the storm. In the request: 1, a report arrives at the Intake module, from the website form or as a webhook from the CRM when an agent saves a claim. 2, Intake saves the claim as received in one short transaction in the Claims DB. 3, Intake returns received to the reporter, in seconds even at the peak. After the request: 4, a background worker in the same app picks up received claims and Triage scores severity and queue. 5, Handoff creates the CRM case for a website report, or adds severity and queue to an agent's case, one at a time, at the pace the throttled CRM allows, so it falls behind at the peak. 6, Notify tells the policyholder by email or text who has the claim.</desc>
