<title id="rlc2-title">Claims reported per day at Ridgeline Mutual over 21 days last June</title>
<desc id="rlc2-desc">A bar chart of claims reported per day over 21 days. Most days sit around 30 claims, too small to see against the scale. On days 10, 11 and 12, after a hailstorm, the bars jump to about 1,900, 1,700 and 1,200, which is 4,800 claims in 72 hours and about 50 times a normal day. Volume falls to about 420 on day 13 and 160 on day 14, and is back near normal within a week.</desc>
