# What's New stack — rendered by _includes/whats-new-panel.html (data_dir is assets/data).
#
# Newest first. Order is the only signal; there are no dates.
# Keep at most 10 entries: when you add one at the top, delete the bottom one.
# The panel also caps the list at 10, so a forgotten deletion never overflows it.
#
# `id` must be unique; it is the entry's stable handle in the rendered markup.
#
# Fields:
#   id      stable unique slug
#   kind    new | revised | post
#   title   what the reader sees
#   url     where the card links; omit it when `links` should be the only way in
#   cta     optional call-to-action text (defaults: new "Read", revised "Browse",
#           post "Read post")
#   note    one sentence on why it's worth reading
#   links   optional { title, url } links shown as rows under the card

