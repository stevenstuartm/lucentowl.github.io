# What's New stack — rendered by _includes/whats-new-panel.html (data_dir is assets/data).
#
# Newest first. Order is the only signal; there are no dates.
# Keep at most 10 entries: when you add one at the top, delete the bottom one.
# The panel also caps the list at 10, so a forgotten deletion never overflows it.
#
# `id` must be unique; it is the entry's stable handle in the rendered markup.
#
# Fields:
#   id      stable unique slug
#   change  new | revised — what happened; drives the badge and card color
#   type    guide | post | resource — what kind of content changed; shown as the
#           section label beside the badge ("Study guides", "Blog", "Resources")
#   title   what the reader sees
#   url     where the card links; omit it when `links` should be the only way in
#   cta     optional call-to-action text (defaults: new "Read", revised "Browse")
#   note    one sentence on why it's worth reading
#   links   optional { title, url } links shown as rows under the card

- id: beads-gas-city
  change: new
  type: guide
  title: "Beads and Gas City"
  note: "Two guides on coding agents: Beads keeps their work from getting lost between sessions, and Gas City runs many of them reliably."
  links:
    - title: "Beads: Durable Work Memory for Coding Agents"
      url: /study-guides/ai/beads.html
    - title: "Gas City: Orchestrating Fleets of Coding Agents"
      url: /study-guides/ai/gas-city.html

- id: reads-should-not-design-writes
  change: new
  type: post
  title: "Your Reads Should Not Design Your Writes"
  url: /blog/2026/09/14/your-reads-should-not-design-your-writes.html
  note: "Why wide update bodies can't tell an omitted field from a cleared one, and how small, replaceable write resources avoid the problem."

- id: plan-task-skill
  change: new
  type: resource
  title: "Assumptions-First Task Planning Skill"
  url: /resources/plan-task-skill.html
  note: "A Claude Code skill that turns a ticket into a self-contained plan, tags every assumption with its source, and proves them before any code is written."

- id: claude-prose-linter
  change: new
  type: resource
  title: "Claude Prose Linter"
  url: /resources/refine-prose-skill.html
  note: "A portable Claude skill that lints prose for AI tells and filler, then runs a self-review for what a grep can't catch."
