# What's New stack — rendered by _includes/whats-new-panel.html (data_dir is assets/data).
#
# Newest first. Order is the only signal; there are no dates.
# Keep at most 10 entries: when you add one at the top, delete the bottom one.
# The panel also caps the list at 10, so a forgotten deletion never overflows it.
#
# `id` must be unique; it is the entry's stable handle in the rendered markup.
#
# Fields:
#   id      stable unique slug
#   change  new | revised — what happened; drives the badge and card color
#   type    guide | post | resource — what kind of content changed; shown as the
#           section label beside the badge ("Study guides", "Blog", "Resources")
#   title   what the reader sees
#   url     where the card links; omit it when `links` should be the only way in
#   cta     optional call-to-action text (defaults: new "Read", revised "Browse")
#   note    one sentence on why it's worth reading
#   links   optional { title, url } links shown as rows under the card

- id: learning-paths
  change: new
  title: "Learning paths"
  url: /learning-paths.html
  cta: "Browse paths"
  note: "Ordered routes through the site toward a goal, from foundations and arguments up to advanced practice, with a line on why each step comes where it does."
  links:
    - title: "Developer to Architect"
      url: /learning-paths/developer-to-architect.html
    - title: "Coding with AI Agents"
      url: /learning-paths/coding-with-ai-agents.html
    - title: "Designing on AWS"
      url: /learning-paths/cloud-architect-aws.html
    - title: "Running AWS at Scale"
      url: /learning-paths/running-aws-at-scale.html
    - title: "Leading a Development Team"
      url: /learning-paths/leading-software-delivery.html

- id: site-search
  change: new
  title: "Search the whole site"
  note: "Search the full text of every guide, post, resource, and case study: use the magnifier in the header, or press /."

