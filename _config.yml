# Site settings
title: Lucent Owl
description: Free learning resources for software engineers, with the reasoning behind every practice.
baseurl: ""
url: "https://lucentowl.com"
version: 1.0.20

# Author information (used by the author system — not displayed as site identity)
author:
  name: Steven Stuart

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title.html
excerpt_separator: "<!--more-->"

# Sass/CSS settings
sass:
  style: compressed
  sass_dir: _sass

# Data files location
data_dir: assets/data

# Plugins
plugins:
  - jekyll-sitemap
  # - jekyll-feed
  - jekyll-redirect-from

# Feed settings (disabled — jekyll-feed slows builds significantly)
# feed:
#   path: feed-blog.xml
#   collections:
#     - posts

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title.html
  guides:
    output: true
    permalink: /study-guides/:path.html
  case_studies:
    output: true
    permalink: /case-studies/:title.html
  resources:
    output: true
    permalink: /resources/:path.html
  # Figures are building blocks, never pages: composed into guides and resources
  # through _includes/figure.html. See .claude/content/figure-guide.md.
  figures:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
      author: "lucent"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case-study"
  - scope:
      path: ""
      type: "resources"
    values:
      layout: "resource"
      author: "lucent"
  - scope:
      path: ""
      type: "figures"
    values:
      layout: null
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md