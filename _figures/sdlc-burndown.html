<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 316" role="img" aria-labelledby="brn-title brn-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="brn-title">Four sprint burndown chart patterns</title>
<desc id="brn-desc">Four small charts of work remaining over the days of a sprint, each against a dashed ideal line from total work to zero. On track: the actual line trends down to zero. Flat line: the line stops falling, meaning work is not being completed. Going up: the line rises mid-sprint, meaning scope was added or estimates increased. Steep drop at end: the line stays high and falls on the last days, meaning work was completed at the last minute. Shapes are illustrative.</desc>
