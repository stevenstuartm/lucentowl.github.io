title: "Hosted Services Across the Host's Lifetime"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="ahl-title ahl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ahl-title">The lifetime of two hosted services, A and B, registered in that order in an ASP.NET Core app</title>
<desc id="ahl-desc">At startup the host calls StartAsync on service A, then on service B, in registration order, and only then starts the server, which begins accepting requests. Each BackgroundService's ExecuteAsync starts when its StartAsync runs and keeps running while the app serves requests. When a stop signal arrives, the host raises ApplicationStopping, the server stops accepting new connections and drains in-flight requests, and the hosted services are stopped in reverse order, B then A, each seeing its stopping token cancelled. The host waits up to the shutdown timeout, 30 seconds by default, for all of this; work still running when the timeout expires is abandoned.</desc>
