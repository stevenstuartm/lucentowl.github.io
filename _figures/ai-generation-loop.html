title: "The Generation Loop"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="aigl-title aigl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aigl-title">Token-by-token generation in a large language model</title>
<desc id="aigl-desc">The generation loop. The tokens so far, here The cat sat on the, go through one full pass of the transformer, which scores every token in the vocabulary. The scores become next-token probabilities: mat 41 percent, floor 22, couch 14, bed 9, roof 5, and a long tail of unlikely tokens. One token is sampled, with temperature and top-p shaping the pick. The sampled token is appended and the loop repeats, so the next pass reads The cat sat on the mat. The loop ends at a stop token or the output limit, and the tokens produced so far are the response.</desc>
