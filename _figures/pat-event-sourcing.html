---
title: "State-Based Storage Versus Event Sourcing"
kind: structure
system: distributed-patterns
summary: "Current state stored, or derived by replaying every change."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="pes-title pes-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pes-title">State-based storage compared with event sourcing</title>
<desc id="pes-desc">State-based storage keeps one account record with id 123, balance 120 dollars, and status active, holding only current state. Event sourcing keeps an event store with AccountOpened, Deposited 100 dollars, Withdrawn 30 dollars, and Deposited 50 dollars. Replaying all four gives the current balance: 0 plus 100 minus 30 plus 50, which is 120 dollars.</desc>
<style>
.pes-band { fill: var(--color-bg, #F7F9FC); stroke: var(--color-border, #DDE3EB); stroke-width: 1; }
.pes-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.pes-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.pes-mute { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; }
.pes-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pes-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.pes-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.pes-s-inv { font-size: 11.5px; fill: #FFFFFF; }
.pes-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.pes-lab { font-size: 11.5px; font-weight: 600; fill: var(--color-primary, #1A5F8A); }
.pes-el { font-size: 11px; fill: var(--color-text, #2C3E50); }
.pes-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
</style>

<defs>
<marker id="pes-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="pes-band" x="20" y="20" width="300" height="270" rx="8"/>
<text class="pes-hd" x="34" y="40">STATE-BASED</text>
<rect class="pes-box" x="50" y="56" width="240" height="110" rx="6"/>
<text class="pes-n" x="64" y="80">Account</text>
<text class="pes-s" x="64" y="98">id: 123</text>
<text class="pes-s" x="64" y="115">balance: $120</text>
<text class="pes-s" x="64" y="132">status: active</text>
<text class="pes-el" x="50" y="192">only current state is stored,</text>
<text class="pes-el" x="50" y="208">each change overwrites it</text>
<rect class="pes-band" x="340" y="20" width="540" height="270" rx="8"/>
<text class="pes-hd" x="354" y="40">EVENT SOURCING</text>
<text class="pes-n" x="370" y="66">Event store: immutable events</text>
<rect class="pes-mute" x="370" y="80" width="230" height="36" rx="6"/>
<text class="pes-s" x="384" y="103">1. AccountOpened(id: 123)</text>
<rect class="pes-mute" x="370" y="124" width="230" height="36" rx="6"/>
<text class="pes-s" x="384" y="147">2. Deposited($100)</text>
<rect class="pes-mute" x="370" y="168" width="230" height="36" rx="6"/>
<text class="pes-s" x="384" y="191">3. Withdrawn($30)</text>
<rect class="pes-mute" x="370" y="212" width="230" height="36" rx="6"/>
<text class="pes-s" x="384" y="235">4. Deposited($50)</text>
<rect class="pes-sys" x="660" y="142" width="200" height="90" rx="6"/>
<text class="pes-n-inv" x="674" y="166">Current state</text>
<text class="pes-s-inv" x="674" y="184">replay all:</text>
<text class="pes-s-inv" x="674" y="201">0 + 100 − 30 + 50</text>
<text class="pes-s-inv" x="674" y="218">= $120</text>
<path class="pes-flow" d="M 600,186 H 654" marker-end="url(#pes-a)"/>
<text class="pes-lab" x="608" y="178">replay</text>
</g>
</svg>
