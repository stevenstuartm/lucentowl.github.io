---
title: "Fan-Out and Competing Consumers"
kind: flow
system: distributed-patterns
summary: "Every subscription gets a copy; one instance per subscription takes it."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pfc-title pfc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pfc-title">Fan-out across subscriptions and competing consumers within one</title>
<desc id="pfc-desc">A publisher sends an order placed message to a topic. The topic delivers a copy to every subscription: inventory, payment, and notification. Within the payment subscription, three instances of the payment service compete, and each message goes to only one of them. Fan-out decides which services hear about a message. Competing consumers decide how one service scales its processing.</desc>
