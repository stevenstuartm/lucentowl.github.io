---
title: "Who Owns the Routing on Each Event Bus"
kind: structure
system: aws
summary: "Classic rules live with the bus owner; subscribers live with each consumer."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="awseb-title awseb-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awseb-title">Cross-account routing on a Classic event bus and on the Custom Event Bus</title>
<desc id="awseb-desc">On a Classic event bus, a producer in the platform account publishes to the bus, and the platform account owns one rule per consumer team, each sending matching events to a target in that team's account. On the Custom Event Bus, the platform account shares the bus through AWS RAM. The bus retains events. Each team account attaches its own subscriber to the shared bus, and each subscriber delivers to one target in that team's account.</desc>
