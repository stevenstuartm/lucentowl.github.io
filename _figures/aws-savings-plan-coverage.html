title: "How an Hourly Commitment Covers a Day"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="awssp-title awssp-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awssp-title">A Savings Plans commitment applied to one day of usage</title>
<desc id="awssp-desc">A chart of one day of hourly compute usage, measured in On-Demand dollars per hour, from midnight to 11 PM. Usage is lowest overnight, around 12 to 14 dollars an hour, rises to about 27 dollars an hour at midday, and falls again in the evening. A horizontal line marks the commitment, expressed as the On-Demand usage it covers, at 15 dollars an hour. Usage below the line is billed at the discounted Savings Plans rate. Usage above the line, during the day, is billed at On-Demand rates. In the early morning and late evening, usage falls below the line, and the unused part of the commitment is still billed.</desc>
