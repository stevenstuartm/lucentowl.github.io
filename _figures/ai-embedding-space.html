<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="aiem-title aiem-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aiem-title">Sentence embeddings compared by cosine similarity</title>
<desc id="aiem-desc">Five sentences drawn as arrows of equal length from a shared origin, ending on the arc of a unit circle. How do I reset my password? and I forgot my login credentials point in nearly the same direction, 11 degrees apart, for a cosine similarity of 0.98. Change the account email sits 33 degrees away at 0.84. Forecast calls for rain and The weather is nice today point far away, at 0.39 and 0.17. A panel ranks the four sentences by cosine similarity to the password question. It is a two-dimensional sketch of vectors that really have hundreds to thousands of dimensions.</desc>
