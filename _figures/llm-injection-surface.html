---
title: "One Context Window, No Privilege Levels"
kind: boundary
system: llm-systems
summary: "Untrusted sources share one context; its output reaches downstream sinks."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="inj-title inj-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="inj-title">Instructions and data share one context window</title>
<desc id="inj-desc">User messages, retrieved chunks, tool results, fetched web pages, file contents, and output from another agent are untrusted sources that all flow into one context window. The system prompt enters the same window; it is trusted, but the architecture gives it no privilege over the rest. The context window has no privilege levels. The model output derived from it is therefore untrusted, and it reaches downstream sinks: rendering in a browser (XSS), a shell or eval (remote code execution), a SQL query (injection), a tool call with real-world effect, and a URL the client fetches (data exfiltration).</desc>
