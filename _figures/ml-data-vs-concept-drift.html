title: "Data Drift and Concept Drift"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="mldr-title mldr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mldr-title">Data drift compared with concept drift</title>
<desc id="mldr-desc">Left: data drift. A loan model's training data centers on applicants aged 30 to 50, while live inputs center on applicants in their early twenties. The learned relationship may still hold, but the model predicts where it saw little data, and the shift is detectable without labels. Right: concept drift. For the same transaction pattern, the chance it is fraud was low at training and is high now. The inputs look familiar and the model is wrong anyway, and detecting it needs the correct answers.</desc>
