---
title: "Retry Waves and Jitter"
kind: chart
system: distributed-patterns
summary: "Clients that fail together retry together, unless jitter spreads them."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="pj-title pj-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pj-title">Retry arrivals with exponential backoff, without and with jitter</title>
<desc id="pj-desc">Two rows of retry arrivals over time from many clients that failed at the same moment. With exponential backoff alone, every client retries after the same delays, so the retries arrive in synchronized waves after 1, 3, and 7 seconds. With full jitter, each client picks a random delay up to the exponential value, so the same retries are spread across the interval in much lower bars. The bars are illustrative, not measured.</desc>
