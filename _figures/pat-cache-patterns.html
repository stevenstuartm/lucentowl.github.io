---
title: "Cache-Aside and Read-Through"
kind: flow
system: distributed-patterns
summary: "Who talks to the database: the application, or the cache."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="pca-title pca-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pca-title">Cache-aside compared with read-through and write-through caching</title>
<desc id="pca-desc">Two panels. In cache-aside, the application first gets from the cache, and on a miss it queries the database and then sets the value in the cache, so the application owns both calls. In read-through and write-through, the application only gets from and sets to the cache, and the cache loads from and stores to the database, so the cache owns the database access.</desc>
