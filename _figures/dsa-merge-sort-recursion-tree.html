<title id="rt-title">Recursion tree for merge sort on eight elements</title>
<desc id="rt-desc">A tree of calls for merge sort on 8 elements. The root sorts 8 elements and splits into two calls on 4, which split into four calls on 2, which split into eight base cases of 1. The merges at each level handle 8 elements in total: one merge of 8, two of 4, and four of 2. The base cases merge nothing. Three levels of merging times 8 elements gives 24, which is n log₂ n.</desc>
