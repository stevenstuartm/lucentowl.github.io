---
title: "SCP Inheritance From Root to Account"
kind: rules
system: aws
summary: "An action must be allowed at every level above an account."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="awsi-title awsi-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsi-title">How service control policies are inherited from the organization root to an account</title>
<desc id="awsi-desc">The organization root, the Workloads OU, and the App1 production account each have the FullAWSAccess SCP attached. The Production OU instead has an allow-list SCP that allows only EC2, S3, and RDS actions. For ec2:RunInstances, every level allows the action, so the SCPs permit it and IAM policies then decide. For dynamodb:PutItem, the Production OU's allow list doesn't include DynamoDB, so the action is denied for every account under that OU, even though the account itself has FullAWSAccess attached.</desc>
