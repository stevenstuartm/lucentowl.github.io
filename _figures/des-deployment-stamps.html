<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="dds-title dds-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dds-title">Tenants routed across deployment stamps through a tenant catalog</title>
<desc id="dds-desc">A request carrying a tenant identity reaches a global router or gateway, which looks up the tenant in a tenant catalog mapping each tenant to a stamp. The router forwards the request to one of three stamps. Stamp 1 is a pool with shared app and database for tenants A, B, and C. Stamp 2 is a pool for tenants D and E. Stamp 3 is a silo serving tenant F only, with the same code on dedicated infrastructure.</desc>
