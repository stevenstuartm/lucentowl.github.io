<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="mlw-title mlw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlw-title">Discounted state values in a grid with a wall</title>
<desc id="mlw-desc">A grid of five columns and three rows has the goal in the top-right corner, worth plus ten, and a wall filling the top two cells of the middle column. Each other cell shows its value with a discount of 0.9 per step. Cells next to the goal are worth 10.0, cells two steps away 9.0, then 8.1, 7.3, 6.6, 5.9, 5.3, and 4.8 for the top-left corner. The cell just left of the wall is worth only 5.3 although it is close to the goal in a straight line, because the path around the wall is seven steps long. An arrow in each cell points toward the neighbor with the highest value.</desc>
