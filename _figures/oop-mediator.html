<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="md-title md-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="md-title">A mediator replaces pairwise links with links to one hub</title>
<desc id="md-desc">Left: five objects, A to E, where every object refers to every other, which takes ten links, and each new object adds a link to all the others. Right: the same five objects each linked only to a central mediator, which takes five links, and each new object adds one.</desc>
