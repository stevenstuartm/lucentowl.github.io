<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="dj-title dj-desc" style="width:100%; min-width:660px; height:auto; display:block;">
<title id="dj-title">Dijkstra's algorithm run from A on a five-vertex weighted graph</title>
<desc id="dj-desc">An undirected weighted graph with edges A–B 4, A–C 2, B–C 1, B–D 5, C–D 8, C–E 7, and D–E 2. Dijkstra's algorithm from A settles A at 0, then C at 2 via A, then B at 3 via C, then D at 8 via B, then E at 9 via C. The edges on these shortest paths are A–C, C–B, B–D, and C–E. B was first reached directly from A at distance 4, and when C settled at 2, the edge C–B offered 2 plus 1 equals 3, so B's distance dropped to 3.</desc>
