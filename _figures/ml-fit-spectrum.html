---
title: "Underfitting, a Good Fit, and Overfitting"
kind: chart
system: machine-learning
summary: "Three models of rising flexibility fitted to the same points."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="mlf-title mlf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlf-title">Underfit, good fit, and overfit models on the same data</title>
<desc id="mlf-desc">The same curved data appears in three panels, with filled training points used for fitting and hollow validation points held out. A straight line underfits: it misses the curve, so both training and validation error are high. A gentle curve fits well: it passes near both kinds of point, so both errors are low. A curve that passes through every training point overfits: training error is zero, but the curve swings far from the held-out validation points between them, so validation error is high.</desc>
