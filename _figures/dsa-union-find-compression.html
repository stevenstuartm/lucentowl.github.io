title: "Path Compression in Union-Find"

summary: "One Find flattening the path it walked to the root."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 404" role="img" aria-labelledby="uf-title uf-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="uf-title">A union-find tree before and after Find(1) with path compression</title>
<desc id="uf-desc">Before: a set stored as a tree of parent pointers with root 4, a shape that forms without union by rank. Vertices 3 and 6 point to 4, 2 points to 3, and 1 points to 2. Find(1) follows 1 to 2 to 3 to 4 to reach the root. After: path compression has made 1, 2, and 3 point straight at 4, and 6 still points at 4, so the next Find on 1, 2, or 3 takes one step.</desc>

.uf-hot { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-accent, #A5486E); stroke-width: 2.5; }
.uf-root { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.75; }
.uf-v { font-size: 15px; font-weight: 700; fill: var(--color-text, #2C3E50); }
.uf-v-inv { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
.uf-e { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.5; }
.uf-ep { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 2.5; }
.uf-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.uf-s { font-size: 12px; fill: var(--color-text, #2C3E50); }
</style>

</defs>
<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text class="uf-hd" x="40" y="30">BEFORE Find(1)</text>
<path class="uf-ep" d="M 129.9,126.2 L 158.4,86.3" marker-end="url(#uf-ap)"/>
<path class="uf-e" d="M 210.1,126.2 L 181.6,86.3" marker-end="url(#uf-a)"/>
<path class="uf-ep" d="M 96.7,194.4 L 112.1,158.4" marker-end="url(#uf-ap)"/>

<circle class="uf-root" cx="170" cy="70" r="17"/><text class="uf-v-inv" x="170" y="75" text-anchor="middle">4</text>
<circle class="uf-hot" cx="120" cy="140" r="17"/><text class="uf-v" x="120" y="145" text-anchor="middle">3</text>

<circle class="uf-hot" cx="60" cy="280" r="17"/><text class="uf-v" x="60" y="285" text-anchor="middle">1</text>
<text class="uf-s" x="40" y="330">Find(1) follows 1 → 2 → 3 → 4 to reach the root.</text>
<text class="uf-s" x="40" y="348">A chain this long forms without union by rank.</text>
