---
title: "Leader Failover"
kind: state
system: distributed-patterns
summary: "The leader fails, followers notice, and a new leader is chosen."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="plf-title plf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="plf-title">Leader failover in a three-node group</title>
<desc id="plf-desc">Three states of a three-node group. First, node 1 is the leader and nodes 2 and 3 are followers. Second, node 1 fails and the followers detect the failure through a heartbeat timeout. Third, a new election makes node 2 the leader, node 3 stays a follower, and node 1 remains down.</desc>
<style>
.plf-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.plf-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.plf-dead { fill: var(--color-bg, #F7F9FC); stroke: var(--color-accent, #A5486E); stroke-width: 1.5; stroke-dasharray: 5 4; }
.plf-grp { fill: none; stroke: var(--color-secondary, #2D5A85); stroke-width: 1.25; stroke-dasharray: 7 5; }
.plf-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.plf-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.plf-n-dead { font-size: 12.5px; font-weight: 700; fill: var(--color-accent, #A5486E); }
.plf-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.plf-note { font-size: 11.5px; fill: var(--color-text, #2C3E50); }
.plf-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
</style>

<defs>
<marker id="plf-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="plf-grp" x="20" y="30" width="250" height="190" rx="8"/>
<text class="plf-hd" x="34" y="52">1. STEADY STATE</text>
<rect class="plf-sys" x="40" y="68" width="210" height="40" rx="6"/>
<text class="plf-n-inv" x="145.0" y="92.5" text-anchor="middle">Node 1: leader</text>
<rect class="plf-box" x="40" y="118" width="210" height="40" rx="6"/>
<text class="plf-n" x="145.0" y="142.5" text-anchor="middle">Node 2: follower</text>
<rect class="plf-box" x="40" y="168" width="210" height="40" rx="6"/>
<text class="plf-n" x="145.0" y="192.5" text-anchor="middle">Node 3: follower</text>

<path class="plf-flow" d="M 276,125 L 318,125" marker-end="url(#plf-a)"/>

<rect class="plf-grp" x="325" y="30" width="250" height="190" rx="8"/>
<text class="plf-hd" x="339" y="52">2. LEADER FAILS</text>
<rect class="plf-dead" x="345" y="68" width="210" height="40" rx="6"/>
<text class="plf-n-dead" x="450.0" y="92.5" text-anchor="middle">Node 1: failed ✗</text>
<rect class="plf-box" x="345" y="118" width="210" height="40" rx="6"/>
<text class="plf-n" x="450.0" y="142.5" text-anchor="middle">Node 2: follower</text>
<rect class="plf-box" x="345" y="168" width="210" height="40" rx="6"/>
<text class="plf-n" x="450.0" y="192.5" text-anchor="middle">Node 3: follower</text>
<text class="plf-note" x="450" y="246" text-anchor="middle">Followers detect the failure</text>
<text class="plf-note" x="450" y="264" text-anchor="middle">through a heartbeat timeout.</text>

<path class="plf-flow" d="M 581,125 L 623,125" marker-end="url(#plf-a)"/>

<rect class="plf-grp" x="630" y="30" width="250" height="190" rx="8"/>
<text class="plf-hd" x="644" y="52">3. NEW ELECTION</text>
<rect class="plf-dead" x="650" y="68" width="210" height="40" rx="6"/>
<text class="plf-n-dead" x="755.0" y="92.5" text-anchor="middle">Node 1: down ✗</text>
<rect class="plf-sys" x="650" y="118" width="210" height="40" rx="6"/>
<text class="plf-n-inv" x="755.0" y="142.5" text-anchor="middle">Node 2: leader</text>
<rect class="plf-box" x="650" y="168" width="210" height="40" rx="6"/>
<text class="plf-n" x="755.0" y="192.5" text-anchor="middle">Node 3: follower</text>
<text class="plf-note" x="755" y="246" text-anchor="middle">A new leader is chosen.</text>
</g>
</svg>
