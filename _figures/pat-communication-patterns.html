<title id="pcp-title">Request-response, scatter-gather, publish-subscribe, and event streaming</title>
<desc id="pcp-desc">Request-response: the client sends a request and waits for one response. Scatter-gather: a client asks an aggregator, which fans the request out to services A, B, and C in parallel and returns one combined result. Publish-subscribe: a publisher sends one message to a topic, and each of subscribers A, B, and C gets its own copy. Event streaming: a producer appends events e1 to e6 to an ordered, retained log, and consumers A and B each read at their own offset.</desc>
