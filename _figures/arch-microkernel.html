<title id="amk-title">Microkernel architecture: a core that finds plug-ins and calls them through contracts</title>
<desc id="amk-desc">A core runs the workflow every customer shares and keeps a registry of plug-ins. It reaches three country e-invoicing plug-ins, Italy, Germany, and France, each through a contract. Plug-ins talk to the core through contracts and never to each other.</desc>
