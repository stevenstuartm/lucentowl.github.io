---
title: "Port Address Translation"
kind: flow
system: networking
summary: "Two private hosts share one public address through a translation table."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="nnt-title nnt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="nnt-title">NAT with port translation between a private network and a server</title>
<desc id="nnt-desc">Two hosts on a private network, 10.0.1.23 and 10.0.1.40, both open connections from source port 51514 to a server at 198.51.100.10 port 443. The NAT device rewrites each source to its public address 203.0.113.7 with a distinct port, 40001 and 40002, and records both mappings in its translation table. The server's reply to 203.0.113.7 port 40001 is translated back to 10.0.1.23 port 51514. A connection attempt arriving from the internet with no matching table entry is dropped.</desc>

.nnt-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.nnt-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.nnt-k-inv { font-size: 10.5px; font-style: italic; fill: #FFFFFF; }
.nnt-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }

.nnt-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.nnt-ret { fill: none; stroke: var(--color-secondary, #2D5A85); stroke-width: 2; stroke-dasharray: 6 4; }

.nnt-droplab { font-size: 11px; font-weight: 600; fill: #B83232; }
.nnt-rule { stroke: var(--color-text-light, #4A5568); stroke-width: 1; }
</style>

<marker id="nnt-b" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-secondary, #2D5A85)"/></marker>

<text class="nnt-mono" x="480" y="164">:40001</text>

<text class="nnt-mono" x="480" y="186">:40002</text>
