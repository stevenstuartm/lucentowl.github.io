---
title: "Fencing Token"
kind: flow
system: distributed-patterns
summary: "The storage rejects a write whose token is older than one it has seen."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="pft-title pft-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pft-title">Fencing tokens reject a stale write</title>
<desc id="pft-desc">A timeline with three rows. Node A acquires the lock with token 33, then pauses for a long time. Node B acquires the lock with token 34 and writes with token 34, which the storage accepts, and from then on the storage requires a token of at least 34. Node A wakes and writes with token 33, and the storage rejects it.</desc>
<style>
.pft-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.pft-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.pft-mute { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; stroke-dasharray: 5 4; }
.pft-bad { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-accent, #A5486E); stroke-width: 2; }
.pft-good { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-green, #3C8D53); stroke-width: 2; }
.pft-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pft-s { font-size: 11.5px; fill: var(--color-text, #2C3E50); }
.pft-s-inv { font-size: 11.5px; font-weight: 600; fill: #FFFFFF; }
.pft-s-mute { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.pft-labr { font-size: 11.5px; font-weight: 700; fill: var(--color-accent, #A5486E); }
.pft-labg { font-size: 11.5px; font-weight: 700; fill: var(--color-green, #3C8D53); }
.pft-note { font-size: 11.5px; fill: var(--color-text, #2C3E50); }
.pft-ax { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.pft-axis { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; }
.pft-thin { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
</style>

<defs>
<marker id="pft-m" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-text-light, #4A5568)"/></marker>
<marker id="pft-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text class="pft-n" x="20" y="58">Node A</text>
<rect class="pft-sys" x="150" y="36" width="130" height="34" rx="6"/>
<text class="pft-s-inv" x="215.0" y="57.5" text-anchor="middle">lock, token 33</text>
<rect class="pft-mute" x="290" y="36" width="390" height="34" rx="6"/>
<text class="pft-s-mute" x="485.0" y="57.5" text-anchor="middle">long pause</text>
<rect class="pft-box" x="690" y="36" width="150" height="34" rx="6"/>
<text class="pft-s" x="765.0" y="57.5" text-anchor="middle">write(token 33)</text>

<text class="pft-n" x="20" y="128">Node B</text>
<rect class="pft-sys" x="420" y="106" width="130" height="34" rx="6"/>
<text class="pft-s-inv" x="485.0" y="127.5" text-anchor="middle">lock, token 34</text>
<rect class="pft-box" x="560" y="106" width="120" height="34" rx="6"/>
<text class="pft-s" x="620.0" y="127.5" text-anchor="middle">write(token 34)</text>

<text class="pft-n" x="20" y="218">Storage</text>
<rect class="pft-good" x="560" y="196" width="120" height="34" rx="6"/>
<text class="pft-labg" x="620.0" y="217.5" text-anchor="middle">accepted</text>
<rect class="pft-bad" x="690" y="196" width="150" height="34" rx="6"/>
<text class="pft-labr" x="765.0" y="217.5" text-anchor="middle">REJECTED: 33 &lt; 34</text>
<path class="pft-thin" d="M 620,140 V 190" marker-end="url(#pft-a)"/>
<path class="pft-thin" d="M 780,70 V 190" marker-end="url(#pft-a)"/>
<text class="pft-note" x="560" y="254">From here the storage requires a token of at least 34.</text>

<path class="pft-axis" d="M 150,290 L 875,290" marker-end="url(#pft-m)"/>
<text class="pft-ax" x="875" y="310" text-anchor="end">time</text>
</g>
</svg>
