<title id="dtm-title">Silo, pool, and bridge tenancy models for three tenants</title>
<desc id="dtm-desc">Four panels for tenants A, B, and C. Silo: each tenant has its own application and its own database. Pool: one application and one database serve all three. Bridge along layers: one shared application tier writes to a separate database per tenant. Bridge along tenants: tenants A and B share a pooled application and database, and tenant C has a dedicated application and database.</desc>
