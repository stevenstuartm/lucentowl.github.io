---
title: "Lost Update Without a Lock"
kind: flow
system: distributed-patterns
summary: "Two read-modify-writes race, and a distributed lock serializes them."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="plu-title plu-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="plu-title">A lost update without a lock, and the same updates under a distributed lock</title>
<desc id="plu-desc">Two panels, time running downward. Without a lock, node A and node B both read 10. A adds 5 and writes 15, B adds 3 and writes 13, and the final value is 13 because A's update was lost. With a distributed lock, A acquires the lock while B's acquire is blocked. A reads 10, adds 5, writes 15, and releases. B then acquires the lock, reads 15, adds 3, and writes 18, so the final value is 18.</desc>
