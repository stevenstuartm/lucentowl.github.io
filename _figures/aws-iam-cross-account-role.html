---
title: "Cross-Account Access Through a Role"
kind: boundary
system: aws
summary: "Which policy in which account allows each step of a role assumption."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="awxa-title awxa-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awxa-title">Cross-account access through an IAM role</title>
<desc id="awxa-desc">A principal in the trusted account A, here a deployment pipeline running as a role session, has an identity-based policy allowing sts:AssumeRole on a role in the trusting account B. The role's trust policy in account B names account A as a principal that may assume it. AWS STS returns temporary credentials for a role session. The role session then calls resources in account B, and the role's permissions policy decides what those calls may do.</desc>
<style>
.awxa-acct { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1; stroke-dasharray: 4 3; }
.awxa-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.awxa-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.awxa-t { font-size: 13px; font-weight: 700; fill: var(--color-text, #2D3748); }
.awxa-n { font-size: 13px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.awxa-n-inv { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
.awxa-k { font-size: 11px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.awxa-k-inv { font-size: 11px; font-style: italic; fill: #FFFFFF; }
.awxa-lab { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.awxa-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.awxa-ret { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.5; stroke-dasharray: 5 3; }
</style>
<defs>
<marker id="awxa-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
<marker id="awxa-g" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-text-light, #4A5568)"/></marker>
</defs>
<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="awxa-acct" x="20" y="20" width="260" height="250" rx="8"/>
<text class="awxa-t" x="36" y="44">Tools account A (trusted)</text>
<rect class="awxa-acct" x="390" y="20" width="510" height="250" rx="8"/>
<text class="awxa-t" x="406" y="44">Production account B (trusting)</text>

<rect class="awxa-box" x="40" y="96" width="220" height="92" rx="6"/>
<text class="awxa-n" x="150" y="122" text-anchor="middle">Deployment pipeline</text>
<text class="awxa-k" x="150" y="140" text-anchor="middle">[Principal: role session in A]</text>
<text class="awxa-lab" x="150" y="162" text-anchor="middle">identity policy allows</text>
<text class="awxa-lab" x="150" y="177" text-anchor="middle">sts:AssumeRole on the role in B</text>

<rect class="awxa-sys" x="410" y="96" width="210" height="92" rx="6"/>
<text class="awxa-n-inv" x="515" y="122" text-anchor="middle">ProdDeploy</text>
<text class="awxa-k-inv" x="515" y="140" text-anchor="middle">[IAM role]</text>
<text class="awxa-k-inv" x="515" y="162" text-anchor="middle">trust policy: account A may assume</text>
<text class="awxa-k-inv" x="515" y="177" text-anchor="middle">permissions policy: deploy actions</text>

<rect class="awxa-box" x="710" y="96" width="170" height="92" rx="6"/>
<text class="awxa-n" x="795" y="130" text-anchor="middle">Resources in B</text>
<text class="awxa-k" x="795" y="150" text-anchor="middle">S3 buckets, RDS, EC2</text>

<path class="awxa-flow" d="M260,122 L408,122" marker-end="url(#awxa-a)"/>
<text class="awxa-lab" x="335" y="114" text-anchor="middle">1. AssumeRole</text>
<path class="awxa-ret" d="M410,166 L262,166" marker-end="url(#awxa-g)"/>
<text class="awxa-lab" x="335" y="186" text-anchor="middle">2. temporary</text>
<text class="awxa-lab" x="335" y="200" text-anchor="middle">credentials</text>
<path class="awxa-flow" d="M620,142 L708,142" marker-end="url(#awxa-a)"/>
<text class="awxa-lab" x="665" y="118" text-anchor="middle">3. calls as</text>
<text class="awxa-lab" x="665" y="132" text-anchor="middle">role session</text>

<text class="awxa-lab" x="20" y="300">Step 1 needs an allow on both sides: the identity policy in A and the trust policy in B.</text>
<text class="awxa-lab" x="20" y="316">Step 3 is evaluated in account B, mainly against the role's permissions policy.</text>
</g>
</svg>
