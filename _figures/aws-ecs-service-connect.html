<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="awsscn-title awsscn-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsscn-title">A request between two ECS services through Service Connect</title>
<desc id="awsscn-desc">Two ECS services, checkout and orders, belong to the same Service Connect namespace, an AWS Cloud Map namespace. Every task has an application container and a Service Connect proxy container. The orders service publishes the endpoint http://orders:8080 in the namespace, and the namespace tells each proxy which tasks back that endpoint. The checkout application calls http://orders:8080, which goes to the proxy in its own task. That proxy picks a healthy orders task and sends the request to the proxy in that task, retrying or ejecting tasks that fail. The receiving proxy passes the request to the orders application in the same task. Both proxies send request metrics to CloudWatch.</desc>
