<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="su1-title su1-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="su1-title">One Shape Up cycle with shaping, betting and building shown as parallel tracks</title>
<desc id="su1-desc">A timeline across three columns: weeks one to six building, weeks seven and eight cool-down, then the next cycle. Three tracks run in parallel rather than in sequence. The shaping track runs during weeks one to six, where senior people shape work for a later cycle, producing pitches. The betting track happens in cool-down, where a betting table picks which shaped pitches get a team for the next cycle. The building track runs weeks one to six, where one small team owns one whole project, and resumes in the next cycle on whatever was bet. At the end of the six weeks the work either shipped, or the circuit breaker trips: the project does not get an automatic extension and must be re-shaped and re-bet to continue.</desc>
