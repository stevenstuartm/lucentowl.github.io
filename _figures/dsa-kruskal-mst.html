---
title: "Kruskal's Algorithm Building a Minimum Spanning Tree"
kind: flow
system: dsa
summary: "Edges taken cheapest first, skipping any that would close a cycle."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="ms-title ms-desc" style="width:100%; min-width:660px; height:auto; display:block;">
<title id="ms-title">Kruskal's algorithm on a five-vertex weighted graph</title>
<desc id="ms-desc">The same weighted graph: A–B 4, A–C 2, B–C 1, B–D 5, C–D 8, C–E 7, and D–E 2. Kruskal's algorithm takes edges in order of weight. It takes B–C (1), A–C (2), and D–E (2). It skips A–B (4) because A and B are already joined through C. It takes B–D (5), which joins the two pieces. It skips C–E (7) and C–D (8) because their ends are already connected. The four edges taken join all five vertices with total weight 10.</desc>
