<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" role="img" aria-labelledby="aicr-title aicr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aicr-title">Each chat request resends the whole conversation</title>
<desc id="aicr-desc">Five requests in one chat, drawn as horizontal bars. Each request sends the system prompt, every earlier user message and reply, and the new user message, then generates a new reply outside the input. Request 1 sends 450 tokens, request 2 sends 1,100, request 3 sends 1,750, request 4 sends 2,400, and request 5 sends 3,050, and its reply reaches the context window limit. Input billed across the five requests totals 8,750 tokens for a conversation of 3,050. Sizes are illustrative.</desc>
