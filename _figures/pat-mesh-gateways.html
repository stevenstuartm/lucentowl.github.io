title: "Mesh Ingress and Egress Gateways"

summary: "One controlled path into the mesh and one controlled path out."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="pmg-title pmg-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pmg-title">Ingress and egress gateways at the mesh boundary</title>
<desc id="pmg-desc">An external client's traffic enters the mesh through an ingress gateway, which handles external TLS and mesh routing. Inside the mesh, where traffic uses mutual TLS, the request goes to service A and then service B. Service B's call to an external API leaves through an egress gateway, which applies an allow list and audit, and TLS toward the external API is originated at the gateway.</desc>
