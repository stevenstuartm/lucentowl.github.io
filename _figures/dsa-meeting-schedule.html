---
title: "Scheduling Meetings by Earliest Finish"
kind: chart
system: dsa
summary: "Six meeting requests on a timeline, with the three that earliest-finish-first selects."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="mts-title mts-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="mts-title">Six meetings on a timeline from 0 to 11, with A, D, and F selected</title>
<desc id="mts-desc">Six meeting requests drawn as bars on a timeline from 0 to 11, in order of end time: A from 1 to 4, B from 3 to 5, C from 0 to 6, D from 5 to 7, E from 3 to 9, and F from 8 to 11. The greedy rule takes the meeting that ends earliest, A, which frees the room at 4. B, C, and E overlap a taken meeting and are skipped. D starts at 5, after 4, so it is taken, freeing the room at 7. F starts at 8 and is taken. The result is A, D, and F.</desc>

.mts-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
