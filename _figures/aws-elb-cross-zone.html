title: "Cross-Zone Load Balancing On and Off"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="awsx-title awsx-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsx-title">How cross-zone load balancing changes each target's share of traffic</title>
<desc id="awsx-desc">Two Availability Zones each hold one load balancer node, and each node receives 50 percent of client traffic. Zone a has 2 targets and zone b has 8. With cross-zone load balancing on, each node spreads its traffic across all 10 targets, so every target receives 10 percent. With it off, each node sends traffic only to targets in its own zone, so the 2 targets in zone a receive 25 percent each and the 8 targets in zone b receive 6.25 percent each.</desc>
