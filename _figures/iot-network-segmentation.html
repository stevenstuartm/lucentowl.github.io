---
title: "Segmenting IoT Devices"
kind: boundary
system: iot
summary: "Why a compromised device on its own segment can reach only the cloud endpoints on the allowlist, and neither the corporate LAN nor an attacker's server."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="ins-title ins-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ins-title">IoT network segmentation with an allowlisting firewall</title>
<desc id="ins-desc">IoT devices sit in their own VLAN. A firewall between that segment and everything else allows only named cloud hosts and ports. Legitimate sensors and gateways reach the cloud IoT endpoint through the firewall. A compromised device in the same segment is denied at the firewall both when it tries to reach workstations and file servers on the corporate LAN and when it tries to reach an attacker's command-and-control (C2) server on the internet, because neither is on the allowlist.</desc>
