<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" role="img" aria-labelledby="edt-title edt-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="edt-title">Edit distance table for horse and ros</title>
<desc id="edt-desc">A grid with the prefixes of horse down the side (empty, h, o, r, s, e) and the prefixes of ros across the top (empty, r, o, s). Row by row, the values are 0 1 2 3; 1 1 2 3; 2 2 1 2; 3 2 2 2; 4 3 3 2; 5 4 4 3. The bottom-right cell, 3, is the edit distance. A shaded path runs back from it to the top-left corner through the cells 3, 2, 2, 1, 1, 0, which spell out the edits: substitute h with r, keep o, delete r, keep s, delete e. A side panel shows that each cell is computed from its diagonal neighbor (a match or a substitution), the cell above (a deletion), or the cell to the left (an insertion). The first row and column are base cases, one edit per character.</desc>
