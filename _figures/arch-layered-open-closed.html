---
title: "Closed and Open Layers"
kind: layering
system: architecture-styles
summary: "Requests pass through closed layers and may skip an open one."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="alo-title alo-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="alo-title">Closed and open layers in a layered architecture</title>
<desc id="alo-desc">Presentation, business, persistence, and database layers are stacked. Presentation, business, and persistence are closed, so a request passes through each in turn. A shared services layer sits below business and is marked open. The business layer can call the shared services, which call persistence, or skip the open layer and call persistence directly.</desc>

<text class="alo-k" x="164" y="236">open: can be bypassed</text>

<text class="alo-n" x="164" y="304">Persistence</text>
<text class="alo-k" x="164" y="322">closed</text>

<text class="alo-note" x="640" y="60">Closed layers create layers of</text>
