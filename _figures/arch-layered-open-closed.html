---
title: "Strict and Relaxed Layering"
kind: layering
system: architecture-styles
summary: "Requests normally pass down one layer at a time, and a documented relaxed path may skip one."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="alo-title alo-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="alo-title">Strict and relaxed layering in a layered architecture</title>
<desc id="alo-desc">Presentation, business, persistence, and database layers are stacked. On the strict path, a request passes down one layer at a time, from presentation to business to persistence to the database. On a relaxed path, reporting reads go from presentation straight to persistence, skipping the business layer. Each relaxed path is a dependency that crosses a layer boundary.</desc>
