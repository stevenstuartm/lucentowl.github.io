---
title: "MCP Hosts, Clients, and Servers"
kind: container
system: llm-systems
summary: "One client per server inside the host; only the host talks to the model."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mcpa-title mcpa-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mcpa-title">MCP host, client, and server architecture</title>
<desc id="mcpa-desc">A host application such as a chat app, IDE, or agent runtime owns the conversation with the model API and sends it the conversation, including tool results. Inside the host, one client connects to each server: client A to a local filesystem server over stdio, clients B and C to remote ticketing and internal API servers over Streamable HTTP. Each server reaches its own backend: local files, a ticketing API, or internal services. The model never talks to the servers directly.</desc>
