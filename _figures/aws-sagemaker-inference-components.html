<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="awssic-title awssic-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awssic-title">Inference components sharing a SageMaker AI endpoint</title>
<desc id="awssic-desc">An application calls InvokeEndpoint and names the inference component it wants. The endpoint has one production variant with managed instance scaling, running two ml.g5.xlarge instances, each with four vCPUs, one GPU, and 16 GB of memory. A ranker component needs one GPU, so each instance holds one of its two copies. A churn-model component needs one vCPU and 2 GB, and its three copies sit where capacity is free, two on the first instance and one on the second, which leaves spare capacity on the second instance. A third component on the same endpoint, fraud-model, is scaled to zero copies and uses no capacity until it is scaled out again. Each component scales its own copy count, and managed instance scaling adds or removes instances to fit the copies.</desc>

<text class="awssic-lab" x="40" y="462">Each inference component sets its model's CPU, GPU, and memory and scales its own copy count. With every component at zero</text>
