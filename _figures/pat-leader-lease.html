---
title: "Leader Lease"
kind: chart
system: distributed-patterns
summary: "A crashed leader's lease runs out before anyone else leads."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="plt-title plt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="plt-title">Leader lease timeline</title>
<desc id="plt-desc">A timeline with two rows. Node 1 acquires a lease at T=0 that expires at T=10 and renews it at T=5 so it expires at T=15. Node 1 crashes at T=8 and stops renewing, but its lease is still held until it expires at T=15. Node 2 is a follower until T=16, when it acquires a new lease and becomes leader. From T=8 to T=15 there is no leader, which is safer than two.</desc>
<style>
.plt-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.plt-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.plt-dead { fill: var(--color-bg, #F7F9FC); stroke: var(--color-accent, #A5486E); stroke-width: 1.5; stroke-dasharray: 5 4; }
.plt-fillr { fill: var(--color-accent, #A5486E); fill-opacity: 0.10; stroke: none; }
.plt-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.plt-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.plt-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.plt-labr { font-size: 11.5px; font-weight: 600; fill: var(--color-accent, #A5486E); }
.plt-lab { font-size: 11.5px; font-weight: 600; fill: var(--color-primary, #1A5F8A); }
.plt-ax { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.plt-axis { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; }
.plt-tick { fill: none; stroke: #FFFFFF; stroke-width: 2; }
</style>

<defs>
<marker id="plt-m" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-text-light, #4A5568)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="plt-fillr" x="470" y="60" width="280" height="160" rx="0"/>
<text class="plt-labr" x="610.0" y="50" text-anchor="middle">T=8 to T=15: no leader, which is safer than two</text>

<text class="plt-n" x="20" y="113">Node 1</text>
<text class="plt-lab" x="152" y="82">acquire: expires T=10</text>
<text class="plt-lab" x="344" y="82">renew: expires T=15</text>
<rect class="plt-sys" x="150" y="90" width="320" height="36" rx="6"/>
<path class="plt-tick" d="M 350,92 V 124"/>
<text class="plt-n-inv" x="250.0" y="112.5" text-anchor="middle">leader</text>
<rect class="plt-dead" x="470" y="90" width="280" height="36" rx="6"/>
<text class="plt-labr" x="610.0" y="112.5" text-anchor="middle">crashed, lease still held</text>

<text class="plt-n" x="20" y="193">Node 2</text>
<rect class="plt-box" x="150" y="170" width="640" height="36" rx="6"/>
<text class="plt-s" x="310.0" y="192.5" text-anchor="middle">follower</text>
<rect class="plt-sys" x="790" y="170" width="70" height="36" rx="6"/>
<text class="plt-n-inv" x="825.0" y="192.5" text-anchor="middle">leader</text>
<text class="plt-lab" x="825.0" y="160" text-anchor="middle">new lease</text>

<path class="plt-axis" d="M 150,245 L 875,245" marker-end="url(#plt-m)"/>
<text class="plt-ax" x="875" y="236" text-anchor="end">time</text>
<path class="plt-axis" d="M 150,239 V 251"/>
<text class="plt-ax" x="150" y="266" text-anchor="middle">T=0</text>
<path class="plt-axis" d="M 350,239 V 251"/>
<text class="plt-ax" x="350" y="266" text-anchor="middle">T=5</text>
<path class="plt-axis" d="M 470,239 V 251"/>
<text class="plt-ax" x="470" y="266" text-anchor="middle">T=8</text>
<text class="plt-labr" x="470" y="284" text-anchor="middle">crash, renewals stop</text>
<path class="plt-axis" d="M 550,239 V 251"/>
<text class="plt-ax" x="550" y="266" text-anchor="middle">T=10</text>
<path class="plt-axis" d="M 750,239 V 251"/>
<text class="plt-ax" x="750" y="266" text-anchor="middle">T=15</text>
<text class="plt-labr" x="745" y="284" text-anchor="end">lease expires</text>
<path class="plt-axis" d="M 790,239 V 251"/>
<text class="plt-ax" x="790" y="266" text-anchor="middle">T=16</text>
</g>
</svg>
