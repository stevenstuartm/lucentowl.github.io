<title id="ioc-title">OT-to-cloud reference architecture through an edge gateway in the DMZ</title>
<desc id="ioc-desc">In the plant, at Purdue levels 1 to 3, a PLC with an OPC UA server is read directly, a legacy Modbus PLC is read through a protocol gateway that converts to OPC UA, SCADA and the historian are read through OPC UA or historian interfaces, and a safety system is read only through its vendor's isolated monitoring port, if at all. All of these feed an edge gateway in the industrial DMZ, which acts as an OPC UA client with subscriptions and dead-band filters, keeps a durable buffer, adds asset context, and connects outbound only over MQTT or AMQP with TLS. In the cloud, a broker or ingestion service receives data from every site and feeds a time-series store and a plant context model or twin, which both feed analytics and dashboards for maintenance, quality, and energy.</desc>
