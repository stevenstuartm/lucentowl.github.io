<title id="mll-title">Two lines fitted to house prices and the loss of each</title>
<desc id="mll-desc">Eight houses are plotted by floor area and sale price. On the left, a poor guess, price = 0.5 times area plus 170, leaves long vertical gaps between each house and the line, and its average squared error is 1,676. On the right, the line after training, price = 1.5 times area plus 56, runs through the middle of the points with short gaps, and its average squared error is 97.</desc>
