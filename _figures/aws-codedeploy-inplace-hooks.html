---
title: "The Order of EC2 Deployment Hooks"
kind: flow
system: aws
summary: "An in-place deployment behind a load balancer takes each instance out of service, replaces the application, and returns it."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="awscdh-title awscdh-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscdh-title">Lifecycle events of an in-place CodeDeploy deployment to one instance behind a load balancer</title>
<desc id="awscdh-desc">For each instance, an in-place deployment behind a load balancer runs thirteen lifecycle events in order, in three groups. First it takes the instance out of service: BeforeBlockTraffic, BlockTraffic, and AfterBlockTraffic. Then it replaces the application: ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, and ValidateService. Finally it returns the instance to service: BeforeAllowTraffic, AllowTraffic, and AfterAllowTraffic. BlockTraffic, DownloadBundle, Install, and AllowTraffic are run by CodeDeploy itself and can't run scripts. BeforeBlockTraffic, AfterBlockTraffic, and ApplicationStop run scripts from the last successful revision's AppSpec file, and the remaining events run scripts from the new revision's. Without a load balancer, only the middle group runs. ApplicationStop is skipped on an instance's first deployment.</desc>
