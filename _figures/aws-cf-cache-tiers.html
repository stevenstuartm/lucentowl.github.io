<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="awsc-title awsc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsc-title">How CloudFront's cache tiers funnel cache misses toward the origin</title>
<desc id="awsc-desc">Viewers in three places each reach their nearest edge location. On a miss, two of the edge locations ask the same regional edge cache and the third asks another. On a miss there, both regional edge caches ask Origin Shield, an optional cache layer in one Region near the origin, so as few as one request per object reaches the origin. CloudFront Functions run at the edge locations, and Lambda@Edge functions run at the regional edge caches, with origin triggers moving to the Origin Shield Region when it is on. Writes and dynamic requests skip the cache tiers and go from the edge location straight to the origin.</desc>
