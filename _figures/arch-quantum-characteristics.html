<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="aqc-title aqc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aqc-title">Architecture characteristics scoped to one unit versus separate quanta</title>
<desc id="aqc-desc">On the left, checkout and monthly reporting share one deployable unit. Checkout needs high availability and elastic scalability, so the whole unit has to meet them, including reporting, which needs neither. On the right, checkout and reporting are separate quanta. Checkout carries high availability and elastic scalability, and reporting carries neither.</desc>
