---
title: "Three Ways to Traverse the SDLC"
kind: flow
system: sdlc
summary: "Sequential, iterative and continuous passes through the same six activities."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" role="img" aria-labelledby="trv-title trv-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="trv-title">The six SDLC activities traversed sequentially, iteratively and continuously</title>
<desc id="trv-desc">Three rows share one time axis. Sequential: planning, design, development, testing, deployment and maintenance each happen once, for the whole system, one after another, so learning arrives late. Iterative: all six activities run inside each of five iterations, each over a slice of the system, so learning arrives every iteration. Continuous: many small changes each pass through all six activities independently and overlap in time, so learning arrives per change.</desc>
