---
title: "Local and Distributed Cache Layers"
kind: structure
system: dotnet
summary: "A private cache per instance over one shared store over the source."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="llc-title llc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="llc-title">Two-level caching across several application instances</title>
<desc id="llc-desc">Instances A, B, and C each have a local in-memory cache, the L1 layer, which is fast, private to that instance, and lost on restart. All three read through to one shared distributed cache such as Redis or SQL Server, the L2 layer, which is serialized and one network hop away, and which falls back to the database or API. When instance A removes an entry, the removal reaches L2, but the copies already in B's and C's local caches stay until they expire.</desc>
