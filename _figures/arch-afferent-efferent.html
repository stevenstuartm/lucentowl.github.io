<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="aec-title aec-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aec-title">Afferent and efferent coupling of one component</title>
<desc id="aec-desc">Three components depend on the component in the middle, so its afferent coupling Ca is 3. The component depends on two others, so its efferent coupling Ce is 2. Instability is Ce divided by Ce plus Ca, which is 2 over 5, or 0.4.</desc>
