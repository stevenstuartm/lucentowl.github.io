<title id="awsqse-title">Anonymous embedding flow for an Amazon Quick Sight dashboard</title>
<desc id="awsqse-desc">A user signs in to your application through its own authentication. The browser asks your application's backend for a dashboard. The backend, using an IAM role, calls the Quick Sight GenerateEmbedUrlForAnonymousUser API with the dashboard and session tags derived from its own authenticated session, such as the tenant ID. Quick Sight returns a short-lived embed URL. The backend passes the URL to the browser, which loads the dashboard in a frame through the embedding SDK from an allowlisted domain. Quick Sight serves the dashboard and applies the session tags as row-level security filters on the dataset, so the viewer sees only their tenant's rows. Each 30-minute session draws on capacity pricing.</desc>
