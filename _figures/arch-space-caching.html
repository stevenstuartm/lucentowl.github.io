---
title: "Replicated and Distributed Caching"
kind: structure
system: architecture-styles
summary: "A full local copy in every unit versus one remote cache cluster."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="asc-title asc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="asc-title">Replicated caching versus distributed caching in space-based architecture</title>
<desc id="asc-desc">With replicated caching, every processing unit holds a full copy of the cached data and changes replicate between units, so reads are local. With distributed caching, the data lives in a separate cache cluster, and every unit reads and writes it over the network, keeping one authoritative copy.</desc>
