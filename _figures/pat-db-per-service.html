---
title: "Database per Service Versus Shared Database"
kind: structure
system: distributed-patterns
summary: "Three services with their own databases, or one database for all."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="pdb-title pdb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pdb-title">Database per service compared with a shared database</title>
<desc id="pdb-desc">On the left, orders, billing, and search each own a database. A cross-service read becomes an API call, a cross-service write takes many steps, and a schema change involves one team. On the right, the three services share one database. A cross-service read is a join, a cross-service write is one transaction, and a schema change involves every team.</desc>
