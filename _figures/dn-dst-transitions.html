---
title: "Spring Forward and Fall Back"
kind: flow
system: dotnet
summary: "New York's clock skipping an hour in March and repeating one in November."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="dst-title dst-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dst-title">UTC against the New York wall clock across both 2026 daylight saving transitions</title>
<desc id="dst-desc">Spring forward on 2026-03-08: as UTC runs 06:00, 06:30, 07:00, 07:30, 08:00, the New York clock reads 01:00, 01:30, then jumps to 03:00, 03:30, 04:00, so 02:00 to 02:59 is never shown. Fall back on 2026-11-01: as UTC runs 04:00, 05:00, 05:30, 06:00, 06:30, 07:00, the New York clock reads 00:00, 01:00, 01:30 in EDT, then 01:00, 01:30 again in EST, then 02:00, so 01:00 to 01:59 is shown twice. The UTC axis never skips or repeats.</desc>
