<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="awsbtu-title awsbtu-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsbtu-title">Tool use between an application and a Bedrock model</title>
<desc id="awsbtu-desc">Your application sends the Bedrock Converse API a request containing the user's message and a list of tools, each described with a name and a JSON schema. The model responds with a tool-use request naming a tool and its arguments instead of an answer. Your application runs the tool, such as calling an orders API or a Lambda function, under its own permissions, and sends the tool result back in the next request along with the conversation so far. The model either asks for another tool or returns the final answer. The loop repeats until the model stops asking for tools. With client-side tool use the model never calls the tool itself, and your code decides whether and how each call runs.</desc>
