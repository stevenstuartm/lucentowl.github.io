<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="awsmrw-title awsmrw-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsmrw-title">Single-writer and multi-active cross-Region replication patterns</title>
<desc id="awsmrw-desc">Two patterns side by side. In the single-writer pattern, the application in Region A reads and writes a primary database. The application in Region B reads a local read replica, but sends its writes across Regions to the primary in Region A. The primary replicates to the replica asynchronously. In the multi-active pattern, the application in each Region reads and writes its own local replica, and the two replicas replicate to each other asynchronously in both directions. When the same item is written in both Regions at once, the last writer wins.</desc>
