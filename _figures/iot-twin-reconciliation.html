---
title: "Device Twin Reconciliation"
kind: dynamic
system: iot
summary: "How a configuration change waits in the cloud while a device is offline, and how the gap between desired and reported state becomes something a fleet can query."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="itw-title itw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="itw-title">How a device twin reconciles desired and reported state</title>
<desc id="itw-desc">The backend sets desired state in the twin while the device is offline. When the device reconnects it reads the desired state, applies it, and writes its actual configuration back as reported state. A fleet query compares desired and reported values to find devices that have not caught up.</desc>
