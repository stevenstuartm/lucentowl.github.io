<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="awsxw-title awsxw-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsxw-title">An X-Ray trace shown as a timeline of segments and subsegments</title>
<desc id="awsxw-desc">A timeline from 0 to 640 milliseconds. API Gateway records a segment for the whole request. The orders service records its own segment, containing subsegments for a DynamoDB GetItem call, an HTTP POST to the payments service, and an SQS SendMessage call. DynamoDB, SQS, and the card network API send no segments, so X-Ray infers their nodes from the callers' subsegments. The payments service records its own segment, which starts shortly after the orders service's POST subsegment begins and ends shortly before it ends; the difference is time in transit. Inside the payments segment, a subsegment times the call to an external card network API.</desc>
