<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" role="img" aria-labelledby="gc4-title gc4-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc4-title">How slung work reaches a pool session in Gas City</title>
<desc id="gc4-desc">A numbered sequence across the sender, the bead store, the controller, and a pool session. The sender slings work, which creates a bead stamped with gc.routed_to. On its tick the controller's scale_check counts routed demand and starts a session. The session's hook runs its work_query, claims one bead with a compare-and-swap, works in the rig, and closes the bead. The close is recorded as a bead.closed event and releases dependents. When the next hook finds nothing, the session exits.</desc>
