<title id="ihw-title">One telemetry stream feeding hot, warm, and cold paths</title>
<desc id="ihw-desc">Devices and gateways send events to a broker or event log. Each path reads the same stream through its own consumer group. The hot path runs a stream processor that drives alerts and a live cache within seconds. The warm path loads a time-series store that serves dashboards over days to weeks. The cold path writes a raw archive in object storage that batch jobs and ML training scan, and the archive can be replayed through the pipeline to rebuild results.</desc>
