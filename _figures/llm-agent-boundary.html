<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" role="img" aria-labelledby="agb-title agb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="agb-title">One agent loop cycle split across local execution and remote inference</title>
<desc id="agb-desc">Steps 1, 2, 5, 6, and 9 run on the user's machine: the user provides a goal, the runtime assembles the initial context from the system prompt and goal, executes a tool locally such as reading file X from disk, appends the tool result to the context, and executes the next tool. Steps 3, 4, 7, and 8 run on the provider's servers: the model reasons about the goal, returns a tool call, sees the file contents and reasons about the next step, and returns the next tool call or a final response. Each crossing is an HTTPS request; the red rightward crossings are data leaving the machine, carrying the whole conversation so far.</desc>
