<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="awsecr-title awsecr-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsecr-title">Private image pull path from a private subnet to Amazon ECR</title>
<desc id="awsecr-desc">A task or node in a private subnet with no NAT gateway pulls an image in three kinds of request. It calls the ecr.api interface VPC endpoint for an authorization token and other ECR API calls. It calls the ecr.dkr interface VPC endpoint, with private DNS enabled, to read the image manifest from the registry. It then downloads each image layer from an Amazon S3 bucket owned by ECR, through an S3 gateway endpoint attached to the subnet's route table. All three services are in the same Region as the VPC.</desc>
