<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="wat-title wat-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wat-title">How four XAML elements become entries in the UI Automation control view through their automation peers</title>
<desc id="wat-desc">Four elements on a page are shown in the left column, each connected to its automation peer in the middle column, and each peer connected to what Narrator announces in the right column. A Button with AutomationProperties.Name set to Settings gets a built-in ButtonAutomationPeer with the Invoke pattern, and Narrator announces "Settings, button". A divider Rectangle with AccessibilityView set to Raw is kept out of the control view, so nothing is announced. A TextBlock reading Orders with HeadingLevel set to Level1 gets a built-in TextBlockAutomationPeer, and Narrator announces "Orders, heading level 1". A custom StarRating control named Rating overrides OnCreateAutomationPeer to return a custom StarRatingAutomationPeer with the RangeValue pattern, and Narrator announces "Rating, slider, 3". A dashed arrow runs back from the rating's announcement to the StarRating control, showing that a pattern call such as SetValue from the screen reader goes through the peer into the control's own logic.</desc>
