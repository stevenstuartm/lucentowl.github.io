<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="fe-title fe-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="fe-title">The Fluent entrance and exit easing curves</title>
<desc id="fe-desc">Two charts of animation progress, from start to end, against time. The left chart shows the entrance curve, fast out, slow in, cubic-bezier(0, 0, 0, 1): progress shoots up almost immediately and then flattens, so an entering element covers most of its distance early and eases into place. The right chart shows the exit curve, slow out, fast in, cubic-bezier(1, 0, 1, 1): progress stays near the start for most of the duration and then rises steeply, so a leaving element starts slowly and accelerates away. Each chart has a dashed diagonal line for comparison, showing constant-speed linear motion.</desc>
