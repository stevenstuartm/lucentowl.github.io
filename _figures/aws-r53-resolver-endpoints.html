<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="awsd-title awsd-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsd-title">How inbound and outbound Resolver endpoints connect DNS between a VPC and an on-premises network</title>
<desc id="awsd-desc">An on-premises network and a VPC are connected by a VPN or Direct Connect. For an on-premises client resolving an AWS name, the corporate DNS server forwards the query to an inbound endpoint in the VPC, which hands it to the VPC Resolver, and the VPC Resolver answers from a private hosted zone. For an EC2 instance resolving an on-premises name, the VPC Resolver matches a forwarding rule for the on-premises domain and sends the query out through an outbound endpoint to the corporate DNS server.</desc>
