<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-labelledby="dr-title dr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dr-title">Fixing the left-right case in an AVL tree with two rotations</title>
<desc id="dr-desc">Step 1: node z is out of balance. Its left child is x, and its right subtree is D. x has left subtree A and right child y, and y has subtrees B and C. The extra height is under x's right child, the left-right case. Step 2: a left rotation at x moves y above x. y becomes z's left child, with x as y's left child holding A and B, and C as y's right subtree. The tall part is now on the outside, a left-left case. Step 3: a right rotation at z makes y the root of this part of the tree, with x as its left child holding A and B, and z as its right child holding C and D. The result is balanced and one level shorter. An in-order walk reads A, x, B, y, C, z, D in all three trees. B and C are the subtrees that change parent.</desc>
