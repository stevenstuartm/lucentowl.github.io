---
title: "Transactional Outbox"
kind: flow
system: distributed-patterns
summary: "The event commits with the data, and a relay publishes it afterward."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="pob-title pob-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pob-title">Transactional outbox pattern</title>
<desc id="pob-desc">A service inserts an order into its business tables and an event into an outbox table inside one database transaction, so both commit or roll back together. Outside that transaction, a message relay, either a polling publisher or transaction log tailing, reads the outbox and publishes to the broker, which delivers to the consumer.</desc>
