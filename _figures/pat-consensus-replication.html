---
title: "Consensus Write Path"
kind: dynamic
system: distributed-patterns
summary: "A write commits once a majority of the cluster acknowledges it."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="pcr-title pcr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pcr-title">A write replicated through a three-node consensus group</title>
<desc id="pcr-desc">A client sends a write request to the leader. The leader appends the entry to its log and replicates it to follower 1 and follower 2. When a majority, two of three nodes, has acknowledged, the entry is committed and the leader replies to the client.</desc>

.pcr-grp { fill: none; stroke: var(--color-secondary, #2D5A85); stroke-width: 1.25; stroke-dasharray: 7 5; }
.pcr-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pcr-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.pcr-k-inv { font-size: 10.5px; font-style: italic; fill: #E8F1F8; }
.pcr-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.pcr-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.pcr-lab { font-size: 11.5px; font-weight: 600; fill: var(--color-primary, #1A5F8A); }
.pcr-note { font-size: 11.5px; fill: var(--color-text, #2C3E50); }
.pcr-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.pcr-ack { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; stroke-dasharray: 6 4; }
.pcr-leg { fill: none; stroke: var(--color-primary, #1A5F8A); }
</style>

<defs>
<marker id="pcr-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="pcr-box" x="30" y="136" width="120" height="50" rx="6"/>
<text class="pcr-n" x="90.0" y="165.5" text-anchor="middle">Client</text>

<rect class="pcr-grp" x="300" y="20" width="570" height="270" rx="8"/>
<text class="pcr-hd" x="314" y="40">CONSENSUS GROUP, 3 NODES</text>

<rect class="pcr-sys" x="330" y="126" width="170" height="70" rx="6"/>
<text class="pcr-n-inv" x="344" y="152">Leader</text>
<text class="pcr-k-inv" x="344" y="170">appends entry to its log</text>

<rect class="pcr-box" x="680" y="60" width="160" height="50" rx="6"/>
<text class="pcr-n" x="760.0" y="89.5" text-anchor="middle">Follower 1</text>
<rect class="pcr-box" x="680" y="212" width="160" height="50" rx="6"/>
<text class="pcr-n" x="760.0" y="241.5" text-anchor="middle">Follower 2</text>

<path class="pcr-flow" d="M 150,152 L 324,152" marker-end="url(#pcr-a)"/>
<text class="pcr-lab" x="160" y="144">1. write request</text>
<path class="pcr-flow" d="M 330,176 L 156,176" marker-end="url(#pcr-a)"/>
<text class="pcr-lab" x="160" y="196">4. reply</text>

<path class="pcr-flow" d="M 500,140 C 580,140 600,78 674,78" marker-end="url(#pcr-a)"/>
<path class="pcr-flow" d="M 500,182 C 580,182 600,244 674,244" marker-end="url(#pcr-a)"/>
<text class="pcr-lab" x="560" y="162" text-anchor="middle">2. replicate</text>
<path class="pcr-ack" d="M 680,98 C 620,98 600,128 506,150" marker-end="url(#pcr-a)"/>
<path class="pcr-ack" d="M 680,226 C 620,226 600,196 506,172" marker-end="url(#pcr-a)"/>
<text class="pcr-lab" x="620" y="128">3. ack</text>
<text class="pcr-lab" x="620" y="206">3. ack</text>

<text class="pcr-note" x="330" y="222">Committed once a majority</text>
<text class="pcr-note" x="330" y="240">(2 of 3) has acknowledged.</text>

<path class="pcr-leg" d="M 30,312 L 60,312" stroke-width="2"/>
<text class="pcr-s" x="68" y="316">request or replication</text>
