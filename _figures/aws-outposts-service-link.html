<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="awsop-title awsop-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsop-title">An AWS Outpost at a customer site connected to its parent AWS Region</title>
<desc id="awsop-desc">An AWS Outpost at the customer's site is an extension of one Availability Zone in its parent Region. Its subnet belongs to the same VPC as subnets in that Availability Zone and runs EC2 instances, EBS volumes, S3 on Outposts, and services such as ECS, EKS nodes, and RDS. Traffic between the Outpost and the on-premises network goes through the local gateway and stays on site. The service link connects the Outpost to the parent Region, carrying VPC traffic to subnets in the Region and management traffic to the Regional control plane, which handles EC2 and EBS APIs, IAM, and CloudWatch. Launching or stopping instances needs the control plane.</desc>
