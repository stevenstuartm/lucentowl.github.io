<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="ahr-title ahr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ahr-title">The parts of an ASP.NET Core host and the path of one request</title>
<desc id="ahr-desc">The host, built by WebApplicationBuilder, holds the dependency injection container, configuration, logging, and the Kestrel web server. A client's request reaches Kestrel, which turns it into an HttpContext and passes it through the request pipeline, a chain of middleware added with app.Use calls, to an endpoint such as a minimal API handler, controller action, or hub. The response travels back out through the same middleware in reverse order and leaves through Kestrel.</desc>
