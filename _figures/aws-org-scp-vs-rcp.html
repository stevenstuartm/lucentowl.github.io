---
title: "Where SCPs and RCPs Apply"
kind: boundary
system: aws
summary: "SCPs check the caller's account; RCPs check the resource's account."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="awsr-title awsr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsr-title">Where service control policies and resource control policies apply</title>
<desc id="awsr-desc">Two member accounts sit inside an organization. A role in account A calls an S3 bucket in account B. That request is checked twice: against the SCPs of account A, where the caller lives, and against the RCPs of account B, where the resource lives. A principal in an account outside the organization calls the same bucket. SCPs don't apply to it, because it isn't in the organization, so only the RCPs of account B can stop it.</desc>

.awsr-n { font-size: 13px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }

</style>
