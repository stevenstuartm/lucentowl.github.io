<title id="dsp-title">How OpenAPI documents flow from application code through build-time generation, linting, and a breaking-change diff to a spec archive and a developer portal</title>
<desc id="dsp-desc">Application code assigns each endpoint to a group. The build generates one OpenAPI document per group: a public document with the customer surface and an internal document with the full surface. The public document is linted and then diffed against the last published version. A breaking change fails the build unless someone acknowledges it. A document that passes is stored in the spec archive, and the developer portal, a static site behind a CDN, renders documentation from the archived specs. The internal document goes only to an internal explorer in development and staging.</desc>
