<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="wbs-title wbs-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wbs-title">Where x:Bind and Binding resolve their paths in a WinUI page</title>
<desc id="wbs-desc">A page's element tree runs from the Page, whose DataContext is set to the view model, through a StackPanel to three children: a TextBlock with Text bound by x:Bind to ViewModel.Title, a TextBlock with Text bound by Binding to Title, and a ListView whose ItemsSource is bound by x:Bind to ViewModel.Orders. The ListView's DataTemplate, with x:DataType Order, holds a TextBlock bound by x:Bind to Number. The Page's DataContext is the OrderViewModel, and the StackPanel and its children inherit it. The x:Bind binding on the page resolves against the page class, OrdersPage, whose ViewModel property holds the same OrderViewModel. The Binding resolves against the DataContext it inherits down the tree, which is the OrderViewModel with its Title and Orders properties. Inside the DataTemplate, the binding resolves against the Order item the template is showing, one of the items in Orders.</desc>
