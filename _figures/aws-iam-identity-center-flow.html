<title id="awic-title">Workforce sign-in through IAM Identity Center</title>
<desc id="awic-desc">An external identity provider such as Okta, Microsoft Entra ID, or Google Workspace syncs users and groups into IAM Identity Center with SCIM. In Identity Center, permission sets are assigned to users and groups for specific accounts, and Identity Center provisions a matching AWSReservedSSO role in each assigned member account. A person opens the AWS access portal or the CLI, signs in through the identity provider with SAML, picks an account and permission set, and receives temporary credentials for a session of that account's AWSReservedSSO role.</desc>
