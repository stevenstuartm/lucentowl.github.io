title: "Clustered Table vs Heap Table"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dch-title dch-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dch-title">Looking up a row through a secondary index in a clustered table and in a heap table</title>
<desc id="dch-desc">In a clustered table, as in InnoDB or SQL Server, a secondary index on email returns the row's primary key, 42. The engine then walks the primary-key B-tree, which is the table itself, down to the leaf page holding the full row. That is two tree walks. In a heap table, as in PostgreSQL, the index on email returns the row's physical location, page 17 slot 3, and the engine reads that heap page directly. That is one index walk and one page read.</desc>
