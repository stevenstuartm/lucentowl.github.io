title: "Text to Tokens"
kind: structure

summary: "Common words as single tokens, rare names and code split finer."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="aitk-title aitk-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aitk-title">How text splits into tokens</title>
<desc id="aitk-desc">Three strings split into tokens, shown as alternating colored chips. The weather is nice today becomes five tokens, one per common word, about five characters each. Deploy to Kubernetes becomes five tokens because the rare name Kubernetes splits into Kub, ern, and etes. The JSON fragment with a retry field of 3 becomes five tokens from twelve characters, because punctuation and quotes take tokens of their own. The splits are illustrative and vary by tokenizer. Each piece maps to an integer ID in the vocabulary.</desc>
