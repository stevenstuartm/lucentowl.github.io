---
title: "A Crash on Either Side"
kind: dynamic

summary: "What survives when a session dies mid-task, and what happens when the controller itself restarts."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="gc6-title gc6-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc6-title">How Gas City recovers when a session or the controller crashes</title>
<desc id="gc6-desc">Two lanes. When a session dies mid-task, its claimed bead stays in progress and assigned in the store; the next tick sees the dead process and restarts the agent, and hook tier 1 finds the unfinished bead first, so the agent resumes. When the controller restarts, sessions keep running in tmux; the new controller takes the lock, adopts the live sessions by creating session beads rather than respawning them, starts with empty crash and quarantine state, and resumes from the store as ground truth.</desc>
