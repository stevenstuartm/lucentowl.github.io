---
title: "A CORS Preflight"
kind: dynamic
system: aspnet-core
summary: "The browser asks permission before a cross-origin PUT, then sends it."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="acp-title acp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="acp-title">The requests a browser sends for a cross-origin PUT with a bearer token</title>
<desc id="acp-desc">A page served from dashboard.example.com calls PUT on api.example.com with an Authorization header and a JSON body. Because the method, the header, and the content type aren't allowed for simple requests, the browser first sends an OPTIONS preflight carrying the Origin and the method and headers it intends to use. The API's CORS middleware answers with Access-Control-Allow-Origin, Allow-Methods, Allow-Headers, and Max-Age. Only if those allow the request does the browser send the actual PUT with its Origin header. The API answers, including Access-Control-Allow-Origin, and the browser lets the page read the response. If the preflight answer doesn't allow the request, the browser never sends the PUT.</desc>

</defs>
<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="acp-box" x="60" y="20" width="220" height="55" rx="6"/>
<text class="acp-n" x="170" y="43" text-anchor="middle">Browser</text>
<text class="acp-k" x="170" y="60" text-anchor="middle">page from dashboard.example.com</text>
<rect class="acp-box" x="680" y="20" width="220" height="55" rx="6"/>
<text class="acp-n" x="790" y="43" text-anchor="middle">API</text>
<text class="acp-k" x="790" y="60" text-anchor="middle">api.example.com, CORS middleware</text>
<line class="acp-life" x1="170" y1="75" x2="170" y2="385"/>
<line class="acp-life" x1="790" y1="75" x2="790" y2="385"/>
<text class="acp-m" x="200" y="108">1. OPTIONS /api/orders/42 (preflight)</text>
<text class="acp-h" x="200" y="124">Origin, Access-Control-Request-Method: PUT,</text>
<text class="acp-h" x="200" y="138">Access-Control-Request-Headers: authorization, content-type</text>
<path class="acp-flow" d="M170,148 L788,148" marker-end="url(#acp-a)"/>
<text class="acp-m" x="200" y="178">2. 204 No Content</text>
<text class="acp-h" x="200" y="194">Access-Control-Allow-Origin, -Allow-Methods,</text>
<text class="acp-h" x="200" y="208">-Allow-Headers, -Max-Age</text>
<path class="acp-flow" d="M790,218 L172,218" marker-end="url(#acp-a)"/>
<text class="acp-m" x="200" y="248">3. PUT /api/orders/42</text>
<text class="acp-h" x="200" y="264">Origin, Authorization: Bearer ..., Content-Type: application/json</text>
<path class="acp-flow" d="M170,274 L788,274" marker-end="url(#acp-a)"/>
<text class="acp-m" x="200" y="304">4. 200 OK</text>
<text class="acp-h" x="200" y="320">Access-Control-Allow-Origin: https://dashboard.example.com</text>
<path class="acp-flow" d="M790,330 L172,330" marker-end="url(#acp-a)"/>
<text class="acp-em" x="200" y="365">If step 2 doesn't allow the request, the browser never sends step 3.</text>
