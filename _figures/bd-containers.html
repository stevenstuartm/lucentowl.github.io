<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="bd1-title bd1-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="bd1-title">Beads container diagram for one repository</title>
<desc id="bd1-desc">A C4 container view of one clone. The coding agent runs the bd CLI and receives context from bd prime. bd reads its config and writes to a Dolt database that auto-commits every write. The Dolt database pushes and pulls bead history to its own ref, refs/dolt/data, on the same git origin that holds the source branches. The optional JSONL export is refreshed by the pre-commit hook and is not a sync path.</desc>
