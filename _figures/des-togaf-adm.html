<title id="dta-title">The TOGAF Architecture Development Method cycle</title>
<desc id="dta-desc">A Preliminary phase leads into a cycle of eight phases: A, Architecture Vision; B, Business Architecture; C, Information Systems Architectures; D, Technology Architecture; E, Opportunities and Solutions; F, Migration Planning; G, Implementation Governance; and H, Architecture Change Management, which leads back to A. Requirements Management sits at the center and exchanges requirements with every phase.</desc>
