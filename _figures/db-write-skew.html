---
title: "Write Skew"
kind: dynamic
system: databases
summary: "Two transactions each take a different doctor off call, leaving nobody on call."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dws-title dws-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dws-title">Two transactions producing write skew under snapshot isolation</title>
<desc id="dws-desc">Transaction 1, for Alice, counts the doctors on call and gets 2. Transaction 2, for Bob, counts from its own snapshot and also gets 2. Transaction 1 sets Alice off call and commits. Transaction 2 sets Bob off call and commits. The two transactions updated different rows, so neither conflicts with the other, and the doctors table ends with nobody on call.</desc>
<style>

.dws-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.dws-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.dws-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.dws-life { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; stroke-dasharray: 4 4; }
.dws-req { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 1.75; }
.dws-resp { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; stroke-dasharray: 6 4; }
.dws-code { font-size: 11.5px; font-family: Consolas, 'Courier New', monospace; fill: var(--color-text, #2C3E50); }
.dws-note { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.dws-store { fill: var(--color-bg, #F7F9FC); stroke: var(--color-secondary, #2D5A85); stroke-width: 1.25; }
.dws-bad { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-accent, #A5486E); stroke-width: 2; }
.dws-labr { font-size: 11.5px; font-weight: 700; fill: var(--color-accent, #A5486E); }
</style>

<defs>
<marker id="dws-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="dws-box" x="40" y="16" width="160" height="36" rx="6"/>
<text class="dws-n" x="120" y="38.5" text-anchor="middle">Transaction 1 (Alice)</text>
<rect class="dws-sys" x="375" y="16" width="150" height="36" rx="6"/>
<text class="dws-n-inv" x="450" y="38.5" text-anchor="middle">doctors table</text>
<rect class="dws-box" x="700" y="16" width="160" height="36" rx="6"/>
<text class="dws-n" x="780" y="38.5" text-anchor="middle">Transaction 2 (Bob)</text>
<path class="dws-life" d="M 120,52 V 390"/>
<path class="dws-life" d="M 450,52 V 390"/>
<path class="dws-life" d="M 780,52 V 390"/>

<path class="dws-req" d="M 120,80 L 444,80" marker-end="url(#dws-a)"/>
<text class="dws-code" x="134" y="72">count on call</text>
<path class="dws-resp" d="M 450,110 L 126,110" marker-end="url(#dws-a)"/>
<text class="dws-code" x="134" y="102">2</text>

<path class="dws-req" d="M 780,140 L 456,140" marker-end="url(#dws-a)"/>
<text class="dws-code" x="766" y="132" text-anchor="end">count on call</text>
<path class="dws-resp" d="M 450,170 L 774,170" marker-end="url(#dws-a)"/>
<text class="dws-code" x="766" y="162" text-anchor="end">2</text>

<path class="dws-req" d="M 120,210 L 444,210" marker-end="url(#dws-a)"/>
<text class="dws-code" x="134" y="202">Alice off call; COMMIT</text>
<rect class="dws-store" x="385" y="222" width="130" height="28" rx="5"/>
<text class="dws-code" x="450" y="240" text-anchor="middle">Alice: off</text>

<path class="dws-req" d="M 780,280 L 456,280" marker-end="url(#dws-a)"/>
<text class="dws-code" x="766" y="272" text-anchor="end">Bob off call; COMMIT</text>
<text class="dws-note" x="766" y="302" text-anchor="end">different row, so no conflict</text>
<rect class="dws-bad" x="385" y="294" width="130" height="28" rx="5"/>
<text class="dws-code" x="450" y="312" text-anchor="middle">Bob: off</text>
<text class="dws-labr" x="450" y="350" text-anchor="middle">Nobody on call</text>
</g>
</svg>
