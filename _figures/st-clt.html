---
title: "Averages of Skewed Data Form a Bell Curve"
kind: chart
system: statistics
summary: "Skewed orders, and averages of samples of 5 and 200."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="stcl-title stcl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stcl-title">Individual order values next to the distribution of sample averages</title>
<desc id="stcl-desc">On the left, individual order values rise steeply from zero and trail off in a long right tail. On the right, averages of many random samples of 5 orders are still somewhat skewed and spread widely around the true average. Averages of samples of 200 orders form a narrow, symmetric bell curve centered on the true average.</desc>
