---
title: "VSTest Versus Microsoft.Testing.Platform"
kind: flow
system: dotnet
summary: "A separate runner loading a test library, against a self-hosting test app."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="vsm-title vsm-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="vsm-title">How tests are launched under VSTest and under Microsoft.Testing.Platform</title>
<desc id="vsm-desc">VSTest: dotnet test starts vstest.console, a separate runner, which loads the test project's output, MyTests.dll, a library, then discovers and runs its tests. Microsoft.Testing.Platform: the test project builds an executable, MyTests.exe, that contains both the tests and the runner, so dotnet test, dotnet run, or launching the file runs the tests directly with no vstest.console.</desc>
