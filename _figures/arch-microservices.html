title: "Microservices Topology"
kind: container

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="ams-title ams-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ams-title">Microservices topology</title>
<desc id="ams-desc">An API gateway or user interface calls the order, payment, and catalog services. Each service owns its own data store, which no other service reads or writes. The order service publishes an order placed event to an event channel, and the payment service receives it.</desc>
