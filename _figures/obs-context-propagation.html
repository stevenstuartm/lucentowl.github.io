<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" role="img" aria-labelledby="ocp-title ocp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ocp-title">The traceparent header carried across services, and a hop that drops it</title>
<desc id="ocp-desc">Top: checkout sends POST /payments with a traceparent header carrying trace ID 4bf9…4736 and its client span ID 00f0…02b7. Payments starts a server span whose parent is 00f0…02b7 in the same trace, then calls the payment gateway with a new traceparent header carrying the same trace ID and its own client span ID b7ad…3331. Bottom: the same call passes through a proxy that strips unknown headers, so payments receives no traceparent and starts a new trace 9e1c…77a0, and one request is recorded as two unrelated traces.</desc>
