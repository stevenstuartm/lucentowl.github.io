---
title: "Rectangular and Jagged Arrays in Memory"
kind: structure
system: dsa
summary: "One contiguous block versus an array of separate row arrays."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="rj-title rj-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="rj-title">How a rectangular array and a jagged array are laid out in memory</title>
<desc id="rj-desc">Top: the rectangular array int[,] with rows 1, 2, 3 and 4, 5, 6 is one contiguous block of six elements stored row by row, so element [r, c] sits at position r times 3 plus c, and reading row by row walks memory in order. Bottom: the jagged array int[][] with rows of length 1, 2, and 3 is an array of three references, each pointing to its own row array stored separately in memory. Reaching element [r][c] takes two lookups, first the row reference and then the element within that row.</desc>
