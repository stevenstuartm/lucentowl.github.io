<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="awsss-title awsss-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsss-title">A service-managed StackSet deploying to an organizational unit</title>
<desc id="awsss-desc">A StackSet in the administrator account holds one template and its parameters. It targets the Workloads organizational unit in two Regions. With maximum concurrent accounts set to two, a failure tolerance of one, and Regions deployed in sequence, stack instances are created in us-east-1 two accounts at a time, each next account starting as soon as one finishes, and eu-west-1 starts when us-east-1 is done. Failures within a Region count against the failure tolerance, which stops the operation if exceeded. With automatic deployment on, account E, added to the OU later, receives its stack instances without any change to the StackSet.</desc>
