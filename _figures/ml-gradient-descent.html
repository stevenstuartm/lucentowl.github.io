---
title: "Gradient Descent on a Loss Curve"
kind: chart
system: machine-learning
summary: "Steps down the same loss curve at three learning rates."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="mlg-title mlg-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlg-title">Gradient descent at three learning rates</title>
<desc id="mlg-desc">Each panel plots loss against one weight as a U-shaped curve with its lowest point in the middle, and marks the steps gradient descent takes from the same starting weight on the left. With a learning rate that is too small, six steps creep partway down the left side and are still far from the bottom. With a learning rate about right, the steps reach the bottom in four moves. With a learning rate that is too large, each step jumps past the bottom to a higher point on the other side, and the steps climb out of the curve.</desc>
