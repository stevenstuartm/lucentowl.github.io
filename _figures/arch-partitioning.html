<title id="apt-title">Technical partitioning versus domain partitioning</title>
<desc id="apt-desc">On the left, a technically partitioned system has three layers: presentation, business logic, and persistence. A single checkout change touches code in every layer. On the right, a domain-partitioned system has three partitions, checkout, inventory, and shipping, each containing its own UI, logic, and data. The same checkout change stays inside the checkout partition.</desc>
