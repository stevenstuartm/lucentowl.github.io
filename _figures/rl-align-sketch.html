<title id="rl1-title">Ridgeline Mutual's policyholder portal as sketched during Align</title>
<desc id="rl1-desc">A fictional regional insurer, Ridgeline Mutual, wants a policyholder portal so customers stop calling to ask about their policies. On day 10 of Align the sketch shows the portal as one undecided box offering policy and document viewing, contact detail updates and claim status, as mobile-friendly web with no native app. The existing SaaS CRM, holding profiles and claim cases, is known, but whether the portal reads it live or from a nightly export is open. Who owns customer sign-in is open, since agents already use single sign-on. The system that holds policy documents is not yet identified. The legacy billing system is out of scope as a separate project.</desc>
