title: "Entity States in the Change Tracker"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="cts-title cts-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="cts-title">EF Core change tracker entity states and transitions</title>
<desc id="cts-desc">A detached entity becomes Unchanged when a tracking query loads it or Attach is called, and Added when Add is called. Remove on an Added entity detaches it. Changing a property of an Unchanged entity makes it Modified once change detection runs. Remove on an Unchanged or Modified entity makes it Deleted. A successful SaveChanges moves Added and Modified entities to Unchanged and Deleted entities to Detached. Added produces an INSERT, Modified an UPDATE of the changed columns, and Deleted a DELETE.</desc>
