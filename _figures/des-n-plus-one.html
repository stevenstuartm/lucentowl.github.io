title: "N+1 Queries and Batching"
kind: flow
system: architecture-design
summary: "Per-order customer lookups, against one batched load through a DataLoader."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="dnp-title dnp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dnp-title">N+1 queries from naive resolvers compared with DataLoader batching</title>
<desc id="dnp-desc">Two panels for a query asking for 50 orders with their customers. With naive resolvers, the GraphQL server runs one query for the orders and then one query per order for its customer, 51 queries in total. With a DataLoader, the server runs one query for the orders and one batched query for every customer id collected while resolving that level, 2 queries in total.</desc>
