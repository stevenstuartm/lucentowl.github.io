---
title: "Power and the Two Errors"
kind: chart
system: statistics
summary: "Chance curves under no effect and a 0.6-point effect."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="stpw-title stpw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stpw-title">Overlapping outcome curves for no effect and a 0.6-point effect</title>
<desc id="stpw-desc">Two bell curves of the observed difference in conversion rate overlap. One is centered on zero, for pages that perform the same, and the other on plus 0.6 percentage points, for a variant that is 0.6 points better. A vertical significance bar sits at plus 0.56. The part of the zero-centered curve beyond the bar, about 2.5 percent, is a false positive, and a matching shaded tail below minus 0.56 makes up the rest of the 5 percent significance level. The part of the 0.6-centered curve below the bar, about 45 percent, is an effect the test misses, so the test's power is about 55 percent.</desc>
