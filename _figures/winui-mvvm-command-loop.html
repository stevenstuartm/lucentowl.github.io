---
title: "One Search Through View, View Model, and Model"
kind: dynamic
system: winui
summary: "How typing, enabling, clicking, and results move between the three layers."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="wml-title wml-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wml-title">The property, CanExecute, and command loop between a WinUI view, its view model, and the model</title>
<desc id="wml-desc">Three columns: the view with a TextBox, a Search Button, and a ListView; the view model with the SearchQuery property, SearchCommand with its CanSearch check, and the Results property; and the model with IProductService. Step 1: the TextBox's two-way binding writes the typed text to SearchQuery. Step 2: the generated SearchQuery setter calls NotifyCanExecuteChanged on SearchCommand. Step 3: SearchCommand raises CanExecuteChanged, and the Button calls CanExecute, which runs CanSearch, and enables or disables itself. Step 4: a click calls Execute on SearchCommand, which runs SearchAsync. Step 5: SearchAsync awaits IProductService. Step 6: it assigns the returned products to Results. Step 7: Results raises PropertyChanged and the ListView bound to it updates.</desc>
