---
title: "Where the Endpoint Is Selected and Where It Runs"
kind: flow
system: aspnet-core
summary: "Routing picks the endpoint early; it runs at the end, inside its filters."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 230" role="img" aria-labelledby="aes-title aes-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aes-title">Endpoint selection and endpoint execution in the middleware pipeline</title>
<desc id="aes-desc">A request passes through the exception handler, then UseRouting, which picks the endpoint but does not run it. Middleware before UseRouting has no endpoint to read. CORS, authentication, authorization, and custom middleware placed after UseRouting can read the selected endpoint and its metadata. The endpoint runs at the end of the pipeline, where filters wrap the handler.</desc>
