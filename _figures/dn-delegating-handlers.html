---
title: "The Delegating Handler Chain"
kind: flow
system: dotnet
summary: "Handlers nested in registration order, request inward and response outward."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="dhc-title dhc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dhc-title">Order of delegating handlers registered with AddHttpMessageHandler</title>
<desc id="dhc-desc">AuthTokenHandler, registered first, is outermost. It wraps TimingHandler, registered second, which wraps SocketsHttpHandler at the bottom of the chain. A request passes inward through AuthTokenHandler, then TimingHandler, then SocketsHttpHandler to the network, and the response passes back outward in reverse order. Because TimingHandler sits inside AuthTokenHandler, it observes every attempt the auth handler sends.</desc>
