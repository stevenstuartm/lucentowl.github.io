title: "ElastiCache Cluster Mode Off and On"

summary: "One shard with replicas, versus keys hashed into slots across shards."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="awss-title awss-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awss-title">Valkey or Redis OSS with cluster mode disabled and enabled</title>
<desc id="awss-desc">With cluster mode disabled, one shard holds all the data: a primary node takes writes through the primary endpoint and replicates asynchronously to up to five replicas, which serve reads through the reader endpoint. With cluster mode enabled, each key is hashed to one of 16,384 slots, the slots are divided among shards, and each shard has its own primary and replicas. A cluster-aware client reads the slot map through the configuration endpoint, then sends each command directly to the primary of the shard that owns the key's slot.</desc>
