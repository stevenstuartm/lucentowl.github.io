---
title: "Buffered and Streamed Uploads"
kind: flow
system: aspnet-core
summary: "The two upload paths, and where each checks the size limits."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="aup-title aup-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aup-title">How an upload reaches storage on the buffered and streamed paths</title>
<desc id="aup-desc">On the buffered path, the form reader reads the whole multipart body before the handler runs, keeping each file in memory up to 64 KB and in a temporary file beyond that. The server body limit and the form limit of 128 MiB per section are checked as it reads, so an oversized upload is rejected while the framework binds parameters. The handler then receives an IFormFile and copies it to storage. On the streamed path, the handler reads the body itself, section by section or as raw bytes, and writes each chunk to storage as it arrives, with no temporary copy. The server body limit is checked on each read, so an oversized upload fails partway through, inside the handler.</desc>
