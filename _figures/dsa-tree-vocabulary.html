<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" role="img" aria-labelledby="tv-title tv-desc" style="width:100%; min-width:580px; height:auto; display:block;">
<title id="tv-title">A six-node binary tree labelled with tree vocabulary</title>
<desc id="tv-desc">A binary tree with root A at depth 0. A's children are B and C at depth 1. B's children are D and E, and C has one right child, F, all at depth 2. A is the root. Like B and C, it is also an internal node, because it has children. D, E, and F are leaves. A box around B, D, and E marks the subtree rooted at B. A bracket on the right shows the tree's height is 2, the number of edges from A down to the deepest leaf.</desc>
