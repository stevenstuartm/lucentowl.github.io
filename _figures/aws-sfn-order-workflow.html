---
title: "An Order Workflow with a Compensating Step"
kind: flow
system: aws
summary: "Three tasks in order, with retries and a catch that undoes the reservation."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" role="img" aria-labelledby="awssf-title awssf-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awssf-title">The order state machine from the example definition</title>
<desc id="awssf-desc">The execution starts at ReserveInventory, a Lambda task that retries transient Lambda service errors up to six times. It moves on to ChargeCard, another Lambda task, then to SaveOrder, a DynamoDB putItem task that ends the execution. If ChargeCard fails with PaymentDeclined, its Catch sends the execution to ReleaseInventory, which undoes the reservation and retries the same errors, and then to OrderFailed, a Fail state that ends the execution as failed.</desc>

.awssf-comp { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-accent, #A5486E); stroke-width: 1.5; }
.awssf-n { font-size: 13px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.awssf-cn { font-size: 13px; font-weight: 700; fill: var(--color-accent, #A5486E); }
.awssf-k { font-size: 11px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.awssf-lab { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.awssf-ln { fill: none; stroke: var(--color-text, #2D3748); stroke-width: 1.5; }
.awssf-catch { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 1.5; stroke-dasharray: 6 4; }
.awssf-dot { fill: var(--color-text, #2D3748); }
.awssf-ring { fill: none; stroke: var(--color-text, #2D3748); stroke-width: 1.5; }
</style>
