<title id="ainp-title">Top-p nucleus sampling cutting off unlikely tokens</title>
<desc id="ainp-desc">Ten candidate tokens sorted by probability, with a running sum under each: mat 41 percent, floor 22, couch 14, bed 9, roof 5, then rug, chair, table, moon, and sky at 3 percent or less. With top-p set to 0.9 a dashed line falls after roof, where the running sum reaches 91 percent. The five tokens left of the line are sampled from, rescaled to sum to 100 percent, and the five to the right are never sampled. Probabilities are illustrative.</desc>
