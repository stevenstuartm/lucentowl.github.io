title: "gRPC Communication Patterns"
kind: dynamic

summary: "Unary, server streaming, client streaming, and bidirectional calls."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="dgs-title dgs-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dgs-title">The four gRPC communication patterns</title>
<desc id="dgs-desc">Four panels, each with a client and a server. Unary: one request and one response. Server streaming: one request and a stream of responses. Client streaming: a stream of requests and one response. Bidirectional streaming: both sides send streams of messages independently over one call.</desc>

.dgs-n { font-size: 12px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.dgs-s { font-size: 10.5px; fill: var(--color-text-light, #4A5568); }
.dgs-life { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; stroke-dasharray: 3 3; }
.dgs-req { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 1.75; }
.dgs-resp { fill: none; stroke: var(--color-green, #3C8D53); stroke-width: 1.75; }
.dgs-legs { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
</style>
