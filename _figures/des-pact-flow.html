title: "Consumer-Driven Contract Flow"
kind: flow
system: architecture-design
summary: "The consumer publishes a pact, and the provider verifies it through a broker."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="dpf-title dpf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dpf-title">Consumer-driven contract testing with Pact and a Pact Broker</title>
<desc id="dpf-desc">In the consumer build, consumer tests run against a Pact mock provider and produce a pact file recording the requests made and the response fields relied on. The consumer publishes it to the Pact Broker. In the provider build, the provider starts on a real port, Pact replays each recorded request from the broker and checks the responses match, and the provider publishes the verification result back to the broker. Before either side releases a version, a can-i-deploy check against the broker confirms compatibility.</desc>
