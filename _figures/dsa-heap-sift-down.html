---
title: "Removing the Minimum from a Heap"
kind: flow
system: dsa
summary: "How a min-heap refills its root and sifts the moved element down one path to restore the order rule."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="sd-title sd-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="sd-title">Sifting down after removing the minimum from a min-heap</title>
<desc id="sd-desc">Three steps on the min-heap built from 10, 5, 20, 3, 8, 15, whose array is 3, 5, 15, 10, 8, 20. Step 1: the minimum, 3, is removed and the last element, 20, moves into the root, giving the array 20, 5, 15, 10, 8. The root's children are 5 and 15, and 5 is smaller, so 20 and 5 swap. Step 2: the array is 5, 20, 15, 10, 8, and 20 now has children 10 and 8. 8 is smaller, so 20 and 8 swap. Step 3: the array is 5, 8, 15, 10, 20. 20 is a leaf, every parent is at most its children, and the heap is valid again with 5 at the root. The moved element travelled one path from the root to a leaf, at most the height of the tree.</desc>
