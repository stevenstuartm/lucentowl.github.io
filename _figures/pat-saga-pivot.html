<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="ppv-title ppv-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ppv-title">Compensatable, pivot, and retriable saga steps</title>
<desc id="ppv-desc">Five saga steps in order. CreateOrder and ReserveInventory are compensatable, with CancelOrder and ReleaseInventory as their compensations. ChargePayment is the pivot, the go or no-go point. After it commits, the saga is committed to finishing. ShipOrder and SendConfirmation are retriable: no compensation exists, so the saga retries each until it succeeds.</desc>
