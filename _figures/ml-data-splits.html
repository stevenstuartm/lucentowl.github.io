<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="mls-title mls-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mls-title">A holdout split and five-fold cross-validation</title>
<desc id="mls-desc">At the top, one dataset is divided into a training set of 70 percent that fits the parameters, a validation set of 15 percent that tunes and compares models, and a test set of 15 percent used for one final check. Below, five-fold cross-validation divides the non-test data into five parts. In each of five rounds a different part is used for validation and the other four for training, producing scores of 0.81, 0.84, 0.79, 0.83, and 0.83, which average to 0.82. The test set stays untouched until the very end.</desc>
