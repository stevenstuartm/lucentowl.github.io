<title id="lcv-title">Four fine-tuning loss curve patterns</title>
<desc id="lcv-desc">Four small charts of loss over training steps. Learning: training and validation loss both fall; continue. Overfitting: training loss keeps falling while validation loss turns and rises; stop earlier or add data. Flat from the start: both stay flat; check that labels cover the responses, then raise the learning rate. Spiking or diverging: training loss falls, then spikes and climbs; lower the rate or add warmup. Shapes are illustrative.</desc>
