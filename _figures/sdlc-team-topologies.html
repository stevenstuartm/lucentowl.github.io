<title id="tt1-title">Team Topologies team types connected by the three interaction modes</title>
<desc id="tt1-desc">Four team types arranged in three columns. On the left, an enabling team, which helps other teams acquire a missing capability and then leaves. In the centre, two stream-aligned teams, each owning a continuous flow of work for one slice of the business and each delivering to users without handoffs. On the right, a platform team providing self-service internal products, and a complicated-subsystem team owning a part that needs deep specialist knowledge. Three interaction modes connect them. Facilitating runs from the enabling team to each stream-aligned team and is temporary. X-as-a-Service runs from each stream-aligned team to the platform team, where the consumer depends on a stable service with minimal conversation. Collaboration runs in both directions between the lower stream-aligned team and the complicated-subsystem team while an interface is still being discovered, and is expected to end. Cognitive load per team is the constraint the whole arrangement exists to manage.</desc>
