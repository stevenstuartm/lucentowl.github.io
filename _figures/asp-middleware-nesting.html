title: "Middleware Around next, and a Short-Circuit"
kind: dynamic

summary: "Code before and after next, and a middleware that skips next."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="amn-title amn-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="amn-title">How middleware wraps the rest of the pipeline, and what a short-circuit skips</title>
<desc id="amn-desc">Top row: three middleware components and an endpoint. The request passes through each middleware's code before its call to next, reaches the endpoint, and the response returns through each middleware's code after next, in reverse order. Bottom row: the second middleware writes the response and returns without calling next. The third middleware and the endpoint never run, and the response returns through the first middleware's code after next.</desc>
