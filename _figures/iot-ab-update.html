---
title: "A Dual-Slot Update With Test and Confirm"
kind: flow
system: iot
summary: "Why a failed download, a bad signature, or a new image that crashes on first boot all leave the device running its old firmware."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="iab-title iab-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="iab-title">A dual-slot firmware update with test-and-confirm rollback</title>
<desc id="iab-desc">The device runs its image from slot A while it downloads the new image into spare slot B, resuming after interruptions. It verifies the signature over the whole image and manifest. If verification fails, the staged image is discarded and A never stopped running. If it passes, the device marks B pending and reboots into it on probation, where B runs a self-test. If the self-test passes and B confirms itself, B becomes permanent. If B crashes, hangs, or reboots without confirming, the bootloader reverts to A on the next boot and the old image runs again.</desc>
