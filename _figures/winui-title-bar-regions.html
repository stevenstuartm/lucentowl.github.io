---
title: "Regions of a Custom Title Bar"
kind: structure
system: winui
summary: "Which parts of an extended title bar drag the window and which take clicks."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="wtb-title wtb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wtb-title">The regions of a custom title bar in a WinUI window</title>
<desc id="wtb-desc">A horizontal strip across the top of a window, 48 pixels tall, divided from left to right. At the far left is a padding column the width of LeftInset. Next come the app icon and title, then an empty stretch, then a search box, then another empty stretch, and at the far right a padding column the width of RightInset under the system caption buttons: minimize, maximize, and close. The icon, title, and both empty stretches are caption regions, where pressing and dragging moves the window. The search box is a passthrough region, registered with InputNonClientPointerSource, so clicks reach the control. The caption buttons are drawn by the system, not by the app's XAML. Below the strip, a note says passthrough rectangles are in physical pixels measured from the window's client-area origin at the top left, and are recomputed when the title bar element changes size.</desc>
<defs>
<pattern id="wtb-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="var(--color-border, #DDE3EB)" stroke-width="3"/>
</pattern>
<marker id="wtb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-text-light, #4A5568)"/>
</marker>
</defs>

.wtb-content { fill: var(--color-bg, #F7F9FC); stroke: none; }
.wtb-guide { stroke: var(--color-text-light, #4A5568); stroke-width: 1; }
