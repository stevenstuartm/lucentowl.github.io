---
title: "Zero-Touch Provisioning"
kind: dynamic
system: iot
summary: "How a device that knows only the provisioning service's address ends up registered on the right hub, and why it never goes back to the provisioning service afterwards."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="izt-title izt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="izt-title">Zero-touch provisioning through a provisioning service</title>
<desc id="izt-desc">The factory injects a unique identity into each device and records a batch manifest, and its CA or manifest is loaded into the provisioning service's enrollments, which hold the group CA or group key and the allocation policy. The device, which knows only the provisioning address, attests its identity to the provisioning service. The service matches the device to an enrollment, applies the allocation policy to choose among candidate hubs in region A, region B, and tenant C, registers the device on the chosen hub in region B, and returns the endpoint address to the device. From then on the device connects directly to that hub.</desc>
