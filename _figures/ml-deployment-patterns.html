<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="mldp-title mldp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mldp-title">How shadow, canary, blue-green, A/B, and bandit deployments route traffic</title>
<desc id="mldp-desc">Five rows, each routing live traffic to a current model and a new model. Shadow: all users are served by the current model while the new model receives a copy of the traffic and its predictions are logged, not used. Canary: most traffic goes to the current model and a small share goes to the new one, rising as metrics hold. Blue-green: traffic switches from the current environment to the new one at once, and rollback is instant. A/B test: traffic splits between the two models long enough to compare outcomes. Multi-armed bandit: traffic shifts toward whichever model performs better while the test runs.</desc>
