<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="ars-title ars-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ars-title">How the routing middleware narrows the route table to one endpoint</title>
<desc id="ars-desc">Routing first finds the templates that fit the request path. It then filters them by HTTP method, host, and request content type, then drops candidates whose constraints fail, and finally picks the best survivor by Order and then precedence. The chosen endpoint runs at the end of the pipeline. If no template fits the path, or filtering and constraints leave no candidate, no endpoint is selected, the request continues, and a 404 results at the end of the pipeline. If the path fits but no candidate accepts the method or the request body's content type, routing selects a built-in 405 or 415 endpoint. If two candidates tie, routing throws an ambiguous match exception.</desc>
