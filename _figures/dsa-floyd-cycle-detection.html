---
title: "Floyd's Cycle Detection"
kind: flow
system: dsa
summary: "A slow and a fast reference closing on each other inside a loop."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="fl-title fl-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="fl-title">Floyd's cycle detection on a list whose last node points back into it</title>
<desc id="fl-desc">A linked list of nodes 1 to 8 where node 8 points back to node 3, so nodes 1 and 2 lead into a loop of six nodes, 3 through 8. A slow reference moves one node per step and a fast reference two. Both start at node 1. After step 1, slow is at 2 and fast at 3. After step 2, slow is at 3 and fast at 5, both inside the loop, with fast 4 nodes behind slow going around. Each later step closes that gap by 1: slow 4 and fast 7 with gap 3, slow 5 and fast 3 with gap 2, slow 6 and fast 5 with gap 1, and after step 6 both are at node 7, where they meet.</desc>

.fl-v-inv { font-size: 14px; font-weight: 700; fill: #FFFFFF; }

.fl-back { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 2.25; }
.fl-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
