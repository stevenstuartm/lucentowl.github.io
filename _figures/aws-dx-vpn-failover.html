<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="awsf-title awsf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsf-title">A Direct Connect path and a Site-to-Site VPN path to the same transit gateway, with Direct Connect preferred</title>
<desc id="awsf-desc">On-premises routers connect to a transit gateway over two paths: Direct Connect, the primary, and a Site-to-Site VPN over the internet, the backup. Both paths advertise the same on-premises prefixes using BGP. The on-premises routers prefer Direct Connect by local preference, and the transit gateway prefers Direct Connect routes over BGP VPN routes for the same prefix, so the VPN carries traffic only when the Direct Connect BGP session goes down.</desc>

.awsf-k { font-size: 11px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.awsf-lab { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.awsf-pri { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 3; }
.awsf-sec { fill: none; stroke: var(--color-secondary, #2D5A85); stroke-width: 2; stroke-dasharray: 7 4; }
</style>
<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

<rect class="awsf-box" x="20" y="100" width="190" height="90" rx="6"/>

<text class="awsf-k" x="115" y="150" text-anchor="middle">[prefer Direct Connect</text>
<text class="awsf-k" x="115" y="166" text-anchor="middle">by local preference]</text>

<rect class="awsf-box" x="330" y="50" width="220" height="56" rx="6"/>
<text class="awsf-n" x="440" y="74" text-anchor="middle">Direct Connect</text>
<text class="awsf-k" x="440" y="92" text-anchor="middle">[primary, BGP]</text>

<rect class="awsf-bk" x="330" y="190" width="220" height="56" rx="6"/>
<text class="awsf-n" x="440" y="214" text-anchor="middle">Site-to-Site VPN</text>
<text class="awsf-k" x="440" y="232" text-anchor="middle">[backup, BGP over the internet]</text>

<rect class="awsf-box" x="680" y="100" width="220" height="90" rx="6"/>
<text class="awsf-n" x="790" y="130" text-anchor="middle">Transit gateway</text>
<text class="awsf-k" x="790" y="150" text-anchor="middle">[prefers Direct Connect over</text>
<text class="awsf-k" x="790" y="166" text-anchor="middle">BGP VPN for the same prefix]</text>

<path class="awsf-pri" d="M210,125 L330,80"/>
<path class="awsf-pri" d="M550,80 L680,125"/>
<path class="awsf-sec" d="M210,165 L330,215"/>
<path class="awsf-sec" d="M550,215 L680,165"/>

<text class="awsf-lab" x="20" y="292">Both paths advertise the same prefixes. The VPN carries traffic only when the Direct Connect BGP session goes down,</text>
<text class="awsf-lab" x="20" y="310">so the VPN must use BGP rather than static routes, and must not advertise more specific prefixes than Direct Connect.</text>
