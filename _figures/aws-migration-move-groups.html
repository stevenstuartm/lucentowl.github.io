title: "Move Groups and Migration Waves"

summary: "Dependencies bind applications into move groups, and move groups fill waves."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="awsmg-title awsmg-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsmg-title">Applications grouped into move groups and scheduled into migration waves</title>
<desc id="awsmg-desc">Shared services such as the directory and DNS are built in AWS before wave 1 and belong to no move group. Three move groups follow. Move group C holds a team wiki with no dependencies. Move group B holds an HR application and a payroll application that share one owner and one patch window. Move group A holds an orders application and a billing application that share an order database. Group C moves in wave 1 with two test-environment servers, group B in wave 2 with six servers, and group A, in production, in wave 3 with eighteen servers. Later waves grow as the process becomes repeatable.</desc>
