title: "Load Balancer Nodes and Target Groups in Two Tiers"
kind: deployment

summary: "An internet-facing and an internal load balancer, with nodes and targets per AZ."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="awse-title awse-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awse-title">An internet-facing load balancer and an internal load balancer, each with a node in two Availability Zones</title>
<desc id="awse-desc">Clients resolve the internet-facing load balancer's DNS name and receive the IP addresses of its two nodes, one in a public subnet in each of two Availability Zones. Each node's listener applies its rules and forwards to the web target group, whose instances sit in private subnets in both zones. The web instances call an internal load balancer, whose nodes have private addresses in each zone, and it forwards to the service target group in private subnets in both zones.</desc>
