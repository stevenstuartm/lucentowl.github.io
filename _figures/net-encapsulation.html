title: "Encapsulation Down the Stack"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="nen-title nen-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="nen-title">An HTTP request wrapped by TCP, IP, and Ethernet</title>
<desc id="nen-desc">Four rows. At the application layer the message is the HTTP request. At the transport layer a TCP header is added in front of it, making a segment. At the internet layer an IP header is added in front of that, making a packet. At the link layer an Ethernet header is added in front and a frame check trailer behind, making a frame. The Ethernet header carries MAC addresses that are rewritten at every hop, the IP header carries host addresses that stay the same end to end, and the TCP header carries ports that identify the process.</desc>
