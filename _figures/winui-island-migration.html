---
title: "Migrating a WPF App Screen by Screen"
kind: structure
system: winui
summary: "A WPF window hosting a ported WinUI screen, with both UIs bound to one shared view model library."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="wim-title wim-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wim-title">A WPF shell hosting a WinUI 3 island during a gradual migration</title>
<desc id="wim-desc">A WPF main window is the outer shell. Inside it, on the left, are WPF screens not yet ported, drawn in WPF controls. On the right is a DesktopWindowXamlSource, the XAML Island, hosting a WinUI 3 screen that has already been ported. Below the window sits a shared class library targeting plain .NET, holding view models and services. Arrows run from both the WPF screens and the WinUI screen down to the same view models, showing that both UIs bind to one set of view models, so the two screens stay in sync without referencing each other. A dashed arrow from a WPF screen to the island marks a screen being ported, which moves from the WPF side to the island side.</desc>
<defs>
<marker id="wim-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary, #1A5F8A)"/>
</marker>
<marker id="wim-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent, #C0392B)"/>
</marker>
</defs>
