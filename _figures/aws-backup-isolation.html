<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="awsbi-title awsbi-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsbi-title">AWS Backup copies isolated across accounts and Regions</title>
<desc id="awsbi-desc">In the primary Region, a backup plan in the workload account backs up production resources into a backup vault protected by Vault Lock. A copy job copies the recovery points to a logically air-gapped vault owned by a separate backup account in the recovery Region, where they are locked in compliance mode and encrypted with an AWS-owned key by default or a customer managed key. The air-gapped vault is shared through AWS Resource Access Manager with a recovery account in the same Region, which restores directly from it and deploys the rest of the stack from infrastructure as code.</desc>
