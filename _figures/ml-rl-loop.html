<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" role="img" aria-labelledby="mlq-title mlq-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlq-title">The reinforcement learning loop</title>
<desc id="mlq-desc">An agent, here a game-playing program, chooses an action according to its policy and sends it to the environment, the game itself. The environment responds with a new state, the board after the move, and a reward, the points won or lost, which is often zero. The agent chooses its next action from the new state, and the loop repeats.</desc>
