<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="awsks-title awsks-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsks-title">A Kinesis data stream with three shards and two consumers</title>
<desc id="awsks-desc">Producers write records with a partition key. A hash of the key picks the shard, so every record with key A lands in shard 1, and keys B and D share shard 2 while C and E share shard 3. Within each shard, records are stored in order of their sequence numbers, oldest on the left. Two consumers read the same records independently, each keeping its own position in every shard, marked by short dashed lines. Consumer A has read almost to the newest records; consumer B is further behind. Records stay in the stream for the retention period, 24 hours by default and up to 365 days, whether or not anyone has read them, and expire after it.</desc>
