---
title: "A Rotated Sorted Array"
kind: chart

summary: "A rotated sorted array cut at its first midpoint, with the sorted half marked."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 418" role="img" aria-labelledby="ra-title ra-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="ra-title">The values of a rotated sorted array plotted against their indexes, cut at the midpoint</title>
<desc id="ra-desc">The array 40, 50, 60, 10, 20, 30 plotted as value against index 0 to 5. The points form two rising runs: 40, 50, 60 at indexes 0 to 2, then a drop, then 10, 20, 30 at indexes 3 to 5. A vertical line marks the first midpoint, index 2, holding 60. The part from index 0 to the midpoint is shaded as the sorted half, since 40 is at most 60. The part from the midpoint on holds the drop. A target between 40 and 60, if present, must be in the sorted half, and any other target must be in the other half. Because there is only one drop, it lies on one side of any midpoint, so the other side is always one ascending run.</desc>
