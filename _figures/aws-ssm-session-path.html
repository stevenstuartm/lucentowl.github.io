<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="awsssm-title awsssm-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsssm-title">Session Manager connection path</title>
<desc id="awsssm-desc">An operator starts a session from the console or the AWS CLI, which calls Systems Manager over HTTPS. Systems Manager checks the operator's IAM permissions. SSM Agent on a managed node in a private subnet has already connected out to Systems Manager's ssm and ssmmessages endpoints over HTTPS on port 443, through interface VPC endpoints or a NAT gateway. Systems Manager relays the session between the two outbound connections, so the node's security group needs no inbound rule and the node needs no public IP address or SSH key. If session logging is configured, SSM Agent sends the session transcript from the node to S3 or CloudWatch Logs.</desc>
