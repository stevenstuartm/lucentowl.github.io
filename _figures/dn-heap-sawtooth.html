---
title: "The Shape of a Memory Leak"
kind: chart
system: dotnet
summary: "Heap size over time, with a level floor when healthy and a rising one when leaking."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="hsw-title hsw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="hsw-title">Managed heap size over time for a healthy process and a leaking one</title>
<desc id="hsw-desc">Both charts plot managed heap size against time. The heap grows as the process allocates and drops at each garbage collection, making a sawtooth. The dots mark the heap size after each collection. In the healthy process the dots stay at a level floor. In the leaking process the heap still saws up and down, but each collection drops back to a higher floor than the last, because objects that are still referenced survive every collection.</desc>
