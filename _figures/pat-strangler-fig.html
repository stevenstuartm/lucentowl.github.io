---
title: "Strangler Fig Stages"
kind: flow
system: distributed-patterns
summary: "A router moves capabilities to new code until the legacy system retires."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="psf-title psf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="psf-title">Three stages of a strangler fig migration</title>
<desc id="psf-desc">Three stages. In stage 1, requests reach a router that sends all of them to the legacy monolith. In stage 2, the router sends /orders to a new orders service and everything else to the legacy system, which has shrunk. In stage 3, the router sends all requests to new services and the legacy system is retired.</desc>
