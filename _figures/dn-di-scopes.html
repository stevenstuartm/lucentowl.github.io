summary: "Which provider holds each instance, and where a singleton's scoped dependency ends up."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="dis-title dis-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dis-title">Where the DI container keeps singleton, scoped, and transient instances</title>
<desc id="dis-desc">The root provider lives as long as the app and holds one instance of each singleton, plus every disposable transient resolved directly from the root, which it keeps until the app shuts down. Each scope, such as one per HTTP request, holds its own scoped instances and the disposable transients resolved in it, and disposes them in reverse order when the scope ends. A singleton that takes a scoped service in its constructor gets an instance created by the root provider rather than by any scope, so that instance lives until the app shuts down and every request shares it, which is a captive dependency.</desc>
