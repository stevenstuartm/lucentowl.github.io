---
title: "PeriodicTimer Ticks Around Slow Work"
kind: flow
system: dotnet
summary: "A fixed 100 ms cadence where one 350 ms run swallows three ticks."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="ptt-title ptt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ptt-title">Measured PeriodicTimer ticks with a 100 ms period and one 350 ms run</title>
<desc id="ptt-desc">With a 100 ms period, ticks fall due every 100 ms from creation. Measured ticks came at 110, 204, 569, 601, and 700 ms. The run that started at the 204 ms tick took 350 ms and ended around 555 ms, so the ticks due at 300, 400, and 500 ms collapsed into one pending tick delivered at 569 ms, and the cadence resumed at 600 ms. Two runs never overlap.</desc>

<text class="ptt-note" x="30" y="232">Ticks keep the cadence measured from creation. Ticks that fall due during a run collapse into one pending tick,</text>
