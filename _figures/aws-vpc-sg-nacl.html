<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="awsn-title awsn-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsn-title">Where network ACLs and security groups check a request and its response</title>
<desc id="awsn-desc">A client on the internet sends a request from ephemeral port 50123 to port 443 on an instance in a public subnet. The request passes the internet gateway, then the network ACL at the subnet edge, which must have an inbound rule allowing port 443, then the security group at the instance's network interface, which must have an inbound rule allowing port 443. The response travels back the other way. The security group lets it out without checking a rule, because it tracks the connection. The network ACL checks it against its outbound rules, which must allow destination port 50123, because the network ACL keeps no connection state.</desc>
