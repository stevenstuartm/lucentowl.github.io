<title id="gr-title">Growth of six common complexity classes</title>
<desc id="gr-desc">A line chart of operations against input size n from 0 to 20, with the vertical axis capped at 100 operations. O(2ⁿ) leaves the chart before n reaches 7 and O(n²) at n equals 10. O(n log n) reaches about 86 at n equals 20. O(n) reaches 20, O(log n) about 4, and O(1) stays at 1. Constant factors are ignored.</desc>
