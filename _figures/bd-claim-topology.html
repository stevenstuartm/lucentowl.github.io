---
title: "Where a Beads Claim Is Atomic"
kind: deployment
system: beads
summary: "Embedded clones versus one shared server: why a claim is a lock in one layout and a merge-time surprise in the other."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="bd2-title bd2-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="bd2-title">Beads deployment topologies and the reach of an atomic claim</title>
<desc id="bd2-desc">Two panels. Across clones in embedded mode, each clone has its own local Dolt database and a claim is atomic only inside that database, so two agents can both claim the same bead before either pushes and the collision surfaces only at merge time. On one machine in server mode, every agent writes through one dolt sql-server to one database, so the first claim wins. Inside Gas City, one server serves the whole city and each rig is an issue prefix on it.</desc>
