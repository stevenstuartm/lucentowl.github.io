<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="dts-title dts-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dts-title">Four test suite shapes</title>
<desc id="dts-desc">Four shapes, each a stack of test scopes from bottom to top, with width showing relative emphasis. The pyramid is widest at unit tests, narrower at service tests, and narrowest at UI or end-to-end tests. The ice cream cone inverts it, with few unit tests and mostly manual and end-to-end tests. The trophy has static analysis at the base, then unit tests, then its widest band of integration tests, and few end-to-end tests. The honeycomb has few tests of implementation detail, mostly integration tests of each service, and fewest integrated tests across services.</desc>
