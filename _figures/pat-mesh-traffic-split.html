---
title: "Weighted Traffic Split"
kind: flow
system: distributed-patterns
summary: "The caller's proxy sends 90% to the stable version and 10% to the canary."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="pts-title pts-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pts-title">A canary release through weighted traffic splitting</title>
<desc id="pts-desc">A caller's requests pass through its proxy, which splits them: 90 percent go to reviews version 1, the stable version, and 10 percent to reviews version 2, the canary.</desc>
<style>
.pts-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.pts-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.pts-px { fill: var(--color-bg, #F7F9FC); stroke: var(--color-secondary, #2D5A85); stroke-width: 1.5; }
.pts-can { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-green, #3C8D53); stroke-width: 2; }
.pts-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pts-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.pts-n-g { font-size: 12.5px; font-weight: 700; fill: var(--color-green, #3C8D53); }
.pts-s { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.pts-s-inv { font-size: 11px; fill: #E8F1F8; }
.pts-lab { font-size: 13px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pts-labg { font-size: 13px; font-weight: 700; fill: var(--color-green, #3C8D53); }
.pts-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.pts-heavy { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 7; }
.pts-thin { fill: none; stroke: var(--color-green, #3C8D53); stroke-width: 1.5; }
</style>

<defs>
<marker id="pts-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
<marker id="pts-b" markerWidth="4" markerHeight="4" refX="3.5" refY="1.6" orient="auto-start-reverse"><path d="M0,0 L3.6,1.6 L0,3.2 z" fill="var(--color-primary, #1A5F8A)"/></marker>
<marker id="pts-g" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-green, #3C8D53)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="pts-box" x="40" y="76" width="120" height="48" rx="6"/>
<text class="pts-n" x="100.0" y="104.5" text-anchor="middle">caller</text>
<rect class="pts-px" x="220" y="76" width="140" height="48" rx="6"/>
<text class="pts-n" x="290.0" y="98" text-anchor="middle">proxy</text>
<text class="pts-s" x="290.0" y="114" text-anchor="middle">applies the split</text>
<path class="pts-flow" d="M 160,100 L 214,100" marker-end="url(#pts-a)"/>

<rect class="pts-sys" x="600" y="30" width="220" height="48" rx="6"/>
<text class="pts-n-inv" x="616" y="52">reviews v1</text>
<text class="pts-s-inv" x="616" y="68">stable</text>
<rect class="pts-can" x="600" y="122" width="220" height="48" rx="6"/>
<text class="pts-n-g" x="616" y="144">reviews v2</text>
<text class="pts-s" x="616" y="160">canary</text>

<path class="pts-heavy" d="M 360,92 C 460,92 480,54 588,54" marker-end="url(#pts-b)"/>
<text class="pts-lab" x="480" y="54">90%</text>
<path class="pts-thin" d="M 360,110 C 460,110 480,146 594,146" marker-end="url(#pts-g)"/>
<text class="pts-labg" x="480" y="152">10%</text>
</g>
</svg>
