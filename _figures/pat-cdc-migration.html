---
title: "Change Data Capture Pipeline"
kind: flow
system: distributed-patterns
summary: "The legacy database's log feeds a new store that follows it."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="pcd-title pcd-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pcd-title">Change data capture from a legacy database to a new database</title>
<desc id="pcd-desc">The legacy application writes to the legacy database, which remains the source of truth. A CDC connector such as Debezium reads the database's transaction log and emits change events to an event stream such as Kafka. A consumer transforms each event to the new model and writes it to the new database, which follows the legacy one. The legacy application is unchanged.</desc>
