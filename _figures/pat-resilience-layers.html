---
title: "Resilience Layers"
kind: layering
system: distributed-patterns
summary: "Total timeout, retry, circuit breaker, and attempt timeout, outermost first."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="prl-title prl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="prl-title">Resilience strategies layered around a dependency call</title>
<desc id="prl-desc">Four nested layers around a call to a dependency. The outermost is the total timeout, covering the whole operation with retries included. Inside it is the retry layer, using backoff with jitter and capped attempts. Inside that is the circuit breaker, which counts every attempt and fails fast when open. Innermost is the attempt timeout for one call, which wraps the call to the dependency. The request enters from the outside.</desc>
