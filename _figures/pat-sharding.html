<title id="psh-title">A database before and after sharding by username range</title>
<desc id="psh-desc">Before sharding, a single overloaded database holds 100 million users. After sharding, three shards hold users A to H, I to P, and Q to Z. The application routes a query for the username john_doe to shard 1, which holds I to P, and queries only that shard.</desc>
