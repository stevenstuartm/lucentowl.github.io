<title id="am-title">Cost of each append to a dynamic array that doubles from capacity 4</title>
<desc id="am-desc">A bar chart of 33 appends to a dynamic array that starts at capacity 4 and doubles when full. Most appends cost one element write. Appends 5, 9, 17, and 33 find the array full and also copy 4, 8, 16, and 32 elements into a new array twice the size. A line showing the average cost per append so far stays below 3 and ends at about 2.8.</desc>
