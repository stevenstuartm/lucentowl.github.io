<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="pam-title pam-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pam-title">An ambassador handling an application's outbound call</title>
<desc id="pam-desc">An application calls the ambassador on localhost as if it were the remote service. The ambassador, running beside the application, handles service discovery, TLS origination, and timeouts, retries, and circuit breaking, then calls the external payment API over TLS.</desc>
