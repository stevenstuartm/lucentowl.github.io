<title id="awsfnd-title">Organization-wide flow of security findings</title>
<desc id="awsfnd-desc">In every Region, GuardDuty, Security Hub CSPM, Inspector, and Macie produce findings in each member account. In each Region, those findings go to Security Hub in a security account that the management account has made the delegated administrator, the same account in every Region. Security Hub CSPM is both a source of findings in each member account and, with Security Hub, a hub that collects them. Findings from linked Regions are replicated to one home Region, where the dashboards cover all accounts and Regions and where automation rules and ticketing are defined. From the home Region, findings are routed through EventBridge to notification and containment, and Security Hub opens Jira or ServiceNow tickets. GuardDuty also publishes its own findings to EventBridge in each Region, which the figure leaves out. Each service must still be enabled, and is still billed, in every Region; aggregation copies data but enables nothing.</desc>
