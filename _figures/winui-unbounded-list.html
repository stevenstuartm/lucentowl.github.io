title: "A List in a StackPanel vs a Star Row"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="wul-title wul-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wul-title">A ListView inside a vertical StackPanel compared with one in a star-sized Grid row</title>
<desc id="wul-desc">On the left, a window holds a vertical StackPanel containing a TextBlock and a ListView. The StackPanel offers unlimited height, so the ListView measures itself as tall as all its items, extends past the bottom of the window, and shows no scroll bar. On the right, the same window holds a Grid whose first row is Auto, holding the TextBlock, and whose second row is star-sized, holding the ListView. The Grid gives the ListView the row's finite height, so the list fits inside the window and shows a scroll bar.</desc>
