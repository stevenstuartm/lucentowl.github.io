<title id="mlk-title">What classification, regression, and clustering each learn</title>
<desc id="mlk-desc">Three scatter plots. In classification, emails are plotted by number of links and by words like free, colored as spam or not spam, and the model learns a dashed boundary between the two colors. In regression, sold houses are plotted by floor area and price, and the model learns a line through them. In clustering, customers are plotted by orders per month and average order value with no labels at all, and the algorithm finds three groups on its own, circled A, B, and C.</desc>
