---
title: "Reading a Cumulative Flow Diagram"
kind: chart
system: sdlc
summary: "Stable flow, then a Code Review bottleneck, as stacked bands."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" role="img" aria-labelledby="cfd-title cfd-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="cfd-title">A cumulative flow diagram showing stable flow and then a code review bottleneck</title>
<desc id="cfd-desc">A stacked area chart of cumulative items over time with four bands, from the bottom: Done, Code Review, In Progress and To Do. In the first half the bands run parallel with a steady upward slope, which is stable flow. The height of a band is the work in progress in that stage, and the horizontal distance from starting work to Done is roughly the cycle time. In the second half the Code Review band widens while the In Progress band narrows and the Done band flattens, marking Code Review as the bottleneck. Values are illustrative.</desc>
