<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="gc3-title gc3-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc3-title">The five steps of one Gas City controller tick</title>
<desc id="gc3-desc">A ticker every 30 seconds starts each tick, and an fsnotify watcher on the config and pack directories sets a dirty flag. Each tick runs five steps in order: reload the config if dirty, keeping the old one on error; build the desired agent set, running pool checks in parallel; reconcile session beads against live sessions; garbage-collect closed wisps past their TTL; and dispatch due orders, writing a tracking bead before each run. The crash tracker, idle tracker, and order dispatcher state live only in memory and reset when the controller restarts, following Erlang/OTP supervisor semantics.</desc>
