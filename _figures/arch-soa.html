---
title: "Orchestration-Driven SOA"

summary: "Process services composed from shared services, with the orchestration engine and bus in the middle."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="soa-title soa-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="soa-title">Orchestration-driven service-oriented architecture</title>
<desc id="soa-desc">Consumers such as applications, partners, and user interfaces call coarse-grained process services such as Submit loan application. Process services run through the orchestration engine and enterprise service bus, which handle process flow, routing, transformation, and protocol mediation. The bus calls shared services such as Validate customer and Calculate credit score, and application-specific services that are not shared. Utility services for logging and security sit beneath everything. All communication flows through the bus, which makes it the central coupling point.</desc>
