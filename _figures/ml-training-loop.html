---
title: "The Training Loop"
kind: flow
system: machine-learning
summary: "Predict, measure the loss, adjust the parameters, then repeat."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="mlt-title mlt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlt-title">The training loop</title>
<desc id="mlt-desc">A batch of training examples supplies features to the model, which uses its current parameters to predict a price for each house. The predictions and the batch's labels, the correct prices, both feed the loss, a single number measuring how far off the predictions are. The optimizer takes the loss, computes the gradient, and steps each parameter. The updated model then receives the next batch, and the loop repeats.</desc>
