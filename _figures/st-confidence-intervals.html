<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="stci-title stci-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stci-title">Twenty 95 percent confidence intervals around a true mean</title>
<desc id="stci-desc">Twenty horizontal intervals, one per sample, are stacked beside a vertical dashed line at the true population mean. Each interval is centered on its own sample mean, so they shift left and right, and each sample's own spread sets its width. Nineteen of the twenty cross the true mean. One interval lies entirely to one side and misses it.</desc>
