---
title: "Two Runs, One State"
kind: dynamic
system: infrastructure
summary: "Without a lock, the last write drops the other run's resources."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="isl-title isl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="isl-title">Two runs applying against one state, without and with a lock</title>
<desc id="isl-desc">Without a lock, run A and run B both read state version 5. Run A creates web-1 and writes version 6 listing it. Run B creates db-1 and writes its own version 6 listing only db-1, overwriting run A's record, so web-1 keeps running but is no longer tracked. With a lock, run A takes the lock and reads version 5. Run B's attempt to take the lock is refused. Run A writes version 6 and releases the lock, then run B takes it, reads version 6, and writes version 7, which lists both web-1 and db-1.</desc>

.isl-n { font-size: 13px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }

.isl-key { font-size: 11.5px; fill: var(--color-text, #2C3E50); }

<line class="isl-life" x1="540" y1="76" x2="540" y2="290"/>

<path class="isl-flow" d="M 676,232 L 814,232" marker-end="url(#isl-a)"/>
<text class="isl-lab" x="750" y="225" text-anchor="middle">locks, reads v6</text>
<path class="isl-flow" d="M 816,272 L 686,272" marker-end="url(#isl-a)"/>
