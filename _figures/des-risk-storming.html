<title id="drs-title">Availability risks placed on an architecture diagram after risk storming</title>
<desc id="drs-desc">An API gateway calls an order service and a payment service, and the order service also calls the payment service. The order service writes to an orders database that is a single instance, and the payment service uses a payment provider that is one vendor. Two agreed availability risks are pinned to the diagram: a 6 on the orders database, because it has no replica or failover, and a 9 on the payment provider, because there is no fallback provider and an outage stops checkout.</desc>
