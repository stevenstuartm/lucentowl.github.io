---
title: "Focus Crossing a XAML Island"
kind: flow
system: winui
summary: "Where an island sits inside a host window, and how Tab crosses its edge."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="wif-title wif-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wif-title">How keyboard focus crosses the boundary of a WinUI XAML island</title>
<desc id="wif-desc">A large box is the host window, built with WPF, WinForms, or Win32. On its left are two host controls, a name text box above and a Save button below. On its right, a dashed box is the island: a DesktopWindowXamlSource whose DesktopChildSiteBridge child window sits inside the host window, positioned by MoveAndResize. Inside the island is the WinUI content, a SettingsPanel with a first WinUI control at the top and a last WinUI control at the bottom. An arrow runs from the name text box to the first WinUI control, labeled Tab into the island, where the host calls NavigateFocus with First. A second arrow runs from the last WinUI control back to the Save button, labeled Tab past the island's last control, where the island raises TakeFocusRequested and the host moves focus on. A note says Shift+Tab reverses both paths, with NavigateFocus using Last.</desc>
<defs>
<marker id="wif-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent, #C0392B)"/>
</marker>
</defs>

<text class="wif-k" x="490" y="113">the island: a DesktopChildSiteBridge child window,</text>
