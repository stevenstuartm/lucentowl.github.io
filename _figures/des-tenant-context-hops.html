<title id="dtc-title">Carrying tenant context from an HTTP request through a queue to the database</title>
<desc id="dtc-desc">An HTTP request carries the tenant ID as a token claim. The API holds it in a request-scoped TenantContext. It publishes to a queue with the tenant ID in a message header. The worker sets its own TenantContext from that header before the handler runs, and the database receives it as the transaction-local app.tenant_id setting. The API's outbound call to a downstream service carries the tenant in a header or token, and the downstream service resolves it again.</desc>
