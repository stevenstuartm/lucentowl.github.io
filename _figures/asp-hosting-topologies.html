<title id="aht-title">The path of a request in the four ASP.NET Core hosting models</title>
<desc id="aht-desc">With Kestrel, a client's request reaches the app process directly or through an optional reverse proxy, and Kestrel inside the app process passes it to the middleware pipeline. With HTTP.sys, the Windows kernel-mode HTTP.sys driver receives the request and hands it to the HTTP.sys server inside the app process. With IIS in-process, the HTTP.sys driver hands the request to the IIS worker process, w3wp.exe, where the ASP.NET Core Module passes it to IIS HTTP Server and the pipeline, all in the same process. With IIS out-of-process, the request reaches the ASP.NET Core Module in w3wp.exe, which forwards it over loopback HTTP to a separate dotnet process running Kestrel and the pipeline.</desc>
