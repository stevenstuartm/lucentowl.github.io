<title id="apm-title">What an Aspire AppHost starts when it runs, what configuration each resource receives, and how the running resources connect</title>
<desc id="apm-desc">The AppHost is a development-time orchestrator that is never deployed. When it runs it starts five resources: the Aspire dashboard, the web-frontend project, the catalog-api project, a Redis container named cache, and a PostgreSQL container holding the catalogdb database. It injects configuration into each project as environment variables. The web-frontend receives service discovery entries for catalog-api and the OTLP endpoint. The catalog-api receives connection strings for catalogdb and cache and the OTLP endpoint. At run time the web-frontend calls catalog-api by name, and catalog-api uses cache and catalogdb. Both projects export telemetry over OTLP to the dashboard.</desc>
