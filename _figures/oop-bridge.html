---
title: "Bridge Turns N × M Classes Into N + M"
kind: structure
system: oop
summary: "Three shapes and three renderers, by inheritance alone and through a bridge."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="br-title br-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="br-title">Bridge splits a two-dimensional class hierarchy into two hierarchies</title>
<desc id="br-desc">Left: with inheritance alone, three shapes and three renderers need nine classes, one per combination, from VectorCircle to PdfTriangle. Right: with a bridge, an abstract Shape class has three subclasses, Circle, Rectangle, and Triangle, and an IRenderer interface has three implementations, VectorRenderer, RasterRenderer, and PdfRenderer. Shape holds a reference to an IRenderer, which is the bridge, so six classes cover every combination and a new renderer is one new class.</desc>
<style>
.br-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.br-if { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-accent, #A5486E); stroke-width: 1.75; }
.br-n { font-size: 12px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.br-n-if { font-size: 12px; font-weight: 700; fill: var(--color-accent, #A5486E); }
.br-k { font-size: 11px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.br-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.br-lab { font-size: 11.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.br-ref { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.br-inh { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.5; }
.br-note { font-size: 12px; fill: var(--color-text, #2C3E50); }
.br-el { font-size: 12px; fill: var(--color-text, #2C3E50); }
</style>
<defs>

<marker id="br-t" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11 z" fill="var(--color-card-bg, #FFFFFF)" stroke="var(--color-text-light, #4A5568)" stroke-width="1.5"/></marker>
</defs>

<rect class="br-box" x="306" y="118" width="128" height="40"/>
