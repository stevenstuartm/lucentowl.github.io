<title id="bd3-title">How edge types decide the ready frontier of a Beads work graph</title>
<desc id="bd3-desc">An epic contains five child beads. The closed schema bead blocks the API and migration beads; the API bead is ready and the migration bead is claimed. The rollout bead is blocked by the API, the migration, and a gate waiting on a pull request. A rollback bead is linked by conditional-blocks and runs only if the rollout fails. A flaky-test bead, filed during the migration with a discovered-from edge, sits outside the epic and is ready, because discovered-from never blocks. bd ready returns exactly the API bead and the flaky-test bead.</desc>
