title: "A Unit and a Small Network"
kind: structure

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="mln-title mln-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mln-title">A single neural network unit and a small network built from them</title>
<desc id="mln-desc">On the left, one unit takes floor area, bedrooms, and age, multiplies each by its own weight, adds them together with a bias, and passes the total through a bend called ReLU, which turns a negative total into zero, to produce one output number. On the right, a small network has three input units for area, bedrooms, and age, two hidden layers of four units each, and one output unit for price. Every unit in one layer connects to every unit in the next, and every connecting line carries one learned weight.</desc>
