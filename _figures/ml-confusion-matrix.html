<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mlc-title mlc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlc-title">A confusion matrix for a fraud model with precision and recall</title>
<desc id="mlc-desc">Of 1,000 transactions, 10 are fraud. The matrix sorts them by what the model predicted and what was true. It caught 8 fraudulent transactions, missed 2, raised 4 false alarms on legitimate ones, and correctly left 986 legitimate ones alone. Precision reads down the predicted-fraud column: 8 of the 12 flagged were fraud, 67 percent. Recall reads across the actually-fraud row: 8 of the 10 frauds were caught, 80 percent. Accuracy is 99.4 percent, but a model that flags nothing scores 99.0 percent accuracy with 0 percent recall.</desc>
