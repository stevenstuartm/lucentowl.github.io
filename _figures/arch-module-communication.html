---
title: "Direct and Mediated Module Calls"
kind: flow
system: architecture-styles
summary: "A direct interface call versus a command and event through a mediator."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="amc-title amc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="amc-title">Direct calls through interfaces versus mediated commands and events</title>
<desc id="amc-desc">On the left, Checkout calls ReserveStock on IInventoryService directly, and Inventory supplies the implementation. On the right, Checkout sends a ReserveStockCommand to an in-process mediator, which routes it to the Inventory handler. Inventory publishes a StockReservedEvent through the mediator, and interested modules handle it. Checkout and Inventory never reference each other.</desc>
