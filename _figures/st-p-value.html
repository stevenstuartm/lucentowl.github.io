title: "The p-value of the Checkout Test"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" role="img" aria-labelledby="stpv-title stpv-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stpv-title">The chance distribution of the checkout test difference with the p-value shaded</title>
<desc id="stpv-desc">A bell curve centered on zero shows how the difference between the two checkout pages would vary across repeated tests if the pages performed the same. Most of the curve sits between about minus 0.6 and plus 0.6 percentage points. The observed difference of plus 0.6 is marked, and both tails beyond 0.6 points in either direction are shaded, each holding about 1.8 percent. Together they make up 3.6 percent, the p-value of 0.036.</desc>
