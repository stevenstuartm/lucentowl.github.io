---
title: "What an HttpClient Owns"
kind: structure
system: dotnet
summary: "HttpClient settings over a handler chain over a pool of long-lived connections."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="hca-title hca-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="hca-title">The layers under HttpClient down to pooled TCP connections</title>
<desc id="hca-desc">HttpClient holds settings that apply to every request, such as BaseAddress, Timeout, and DefaultRequestHeaders, and passes each request to a handler chain. Optional delegating handlers for logging, auth, or retries sit in front of SocketsHttpHandler, which owns the connection pool. Each pooled TCP connection resolved the server's IP address when it opened. If DNS later points the name at a new address, open connections keep using the old one until they close, which PooledConnectionLifetime forces.</desc>
