---
title: "Space-Based Topology"
kind: container
system: architecture-styles
summary: "Requests served from memory, with the database off the request path."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="asp-title asp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="asp-title">Space-based architecture topology</title>
<desc id="asp-desc">Requests reach a messaging grid, which routes each one to a processing unit holding application code and in-memory data. A deployment manager starts and stops units as load changes. A data grid replicates changes between units asynchronously. A data pump carries changes asynchronously to a data writer, which applies them to the database. A data reader loads data from the database into units that start cold. No request waits on the database.</desc>
