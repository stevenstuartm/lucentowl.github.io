---
title: "How a Deferred Query Pulls Elements"
kind: dynamic
system: dotnet
summary: "Each element travelling the whole chain before the next is read."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="lpp-title lpp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="lpp-title">A foreach pulling elements one at a time through Select and Where</title>
<desc id="lpp-desc">The foreach asks Select for the next element, Select asks Where, and Where asks the source. The source yields 1, Where accepts it, Select projects it to 10, and foreach receives 10. Then the source yields 2, Where rejects it and asks the source again, and the source yields 3, which Where accepts and Select projects to 30. No list is built between stages, and each element travels the whole chain before the next is read.</desc>
