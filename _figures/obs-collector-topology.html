title: "Agent-to-Gateway Collectors"
kind: deployment

summary: "Agents route spans by trace ID so each trace reaches one gateway."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-labelledby="oct-title oct-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="oct-title">Agent Collectors routing spans by trace ID to a pool of gateway Collectors</title>
<desc id="oct-desc">Three hosts run the checkout, orders, and payments services, each with the OpenTelemetry SDK and an agent Collector running a load-balancing exporter. Spans of trace 4bf9…4736 come from all three hosts and are all routed to gateway Collector 1. Spans of trace 9e1c…77a0 also come from all three hosts and are all routed to gateway Collector 2. Each gateway runs tail sampling on complete traces and sends the traces it keeps to the tracing backend.</desc>
