<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="abn-title abn-desc" style="width:100%; min-width:660px; height:auto; display:block;">
<title id="abn-title">Big O, Big Omega, and Big Theta as bounding curves</title>
<desc id="abn-desc">Three small charts of the same wavy cost function f(n). In the first, a line c times g(n) lies above f(n) for every n from a point n₀ onward, although f(n) is above it at small n: f(n) is O(g(n)). In the second, a line c times g(n) lies below f(n) from n₀ onward: f(n) is Omega(g(n)). In the third, f(n) stays between a lower line c₁ times g(n) and an upper line c₂ times g(n) from n₀ onward: f(n) is Theta(g(n)). Shapes are illustrative.</desc>
