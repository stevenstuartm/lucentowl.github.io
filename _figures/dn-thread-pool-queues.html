---
title: "Thread Pool Queues"
kind: structure
system: dotnet
summary: "Per-worker local queues, one global queue, and idle workers stealing."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="tpq-title tpq-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="tpq-title">The .NET thread pool's global queue, per-worker local queues, and work stealing</title>
<desc id="tpq-desc">Work queued from a non-pool thread goes to one global FIFO queue. Work queued by a pool thread goes to that worker's own local queue. Each worker takes from its own local queue first, newest item first, then from the global queue, then steals the oldest item from another worker's local queue. Here worker 3's queue is empty, so it takes from the global queue and steals from worker 1.</desc>
