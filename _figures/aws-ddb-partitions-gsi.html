<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="awso-title awso-desc" style="width:100%; min-width:720px; height:auto; display:block;">
<title id="awso-title">DynamoDB partitions, item collections, and a global secondary index</title>
<desc id="awso-desc">An Orders table has partition key CustomerId and sort key OrderDate. DynamoDB hashes the partition key to choose a partition, so all orders for one customer form an item collection stored together and sorted by date. Partition 1 holds customer C123, partition 2 holds customers C456 and C789, and partition 3 holds C901. A global secondary index keyed on Status and OrderDate holds a second copy of the items, copied asynchronously, grouped into a SHIPPED collection and a PENDING collection on their own partitions.</desc>

<text class="awso-lab" x="20" y="320">Items that share a partition key value form an item collection, stored together and sorted by the sort key.</text>
<text class="awso-lab" x="20" y="337">The index holds a second copy of the items under a different key, so it answers queries the table's key can't.</text>
