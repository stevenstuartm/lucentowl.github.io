<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="otw-title otw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="otw-title">Waterfall view of one checkout trace across three services</title>
<desc id="otw-desc">Seven spans on a timeline from 0 to 3.4 seconds, indented under their parents. POST /checkout in the checkout service takes 3,400 ms. Under it, SELECT cart takes 40 ms, POST /orders in the orders service takes 180 ms with an INSERT order child of 120 ms, and POST /payments in the payments service takes 3,100 ms. Under payments, the first POST /charge client span to the external payment gateway runs for 2,000 ms and ends in Error with a timeout, and a retried POST /charge succeeds in 1,000 ms.</desc>
