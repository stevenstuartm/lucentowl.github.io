<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="dtc2-title dtc2-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dtc2-title">Three-year cost of self-managed and managed streaming against operations staffing</title>
<desc id="dtc2-desc">An illustrative chart from the worked example. The managed service's three-year total is flat at $675K. The self-managed total depends on the operations effort it needs: $910K with one full engineer, and $640K with half an engineer. The self-managed line crosses the managed line between those two staffing levels, so the staffing assumption decides which option is cheaper.</desc>
