<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="wls-title wls-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wls-title">Margin, border, padding, and content inside an element's layout slot</title>
<desc id="wls-desc">The layout slot is the rectangle the parent's Arrange call gives the element. The element's margin sits just inside the slot and is outside the element itself, so it is not counted in ActualWidth. Inside the margin is the element's border, then its padding, then its content. With HorizontalAlignment Left and VerticalAlignment Center, the element sits at the left of the slot, centered vertically, and the rest of the slot is unused.</desc>

.wls-margin { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1; stroke-dasharray: 2 3; }
.wls-border { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 2.5; }
.wls-content { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1; }
.wls-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.wls-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }

.wls-band { font-size: 10px; fill: var(--color-text-light, #4A5568); }
.wls-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.wls-lead { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1; }
</style>
