<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="wmo-title wmo-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wmo-title">How a WinUI page's XAML file becomes a class and a tree of objects</title>
<desc id="wmo-desc">MainPage.xaml declares a Page with x:Class MyApp.MainPage containing a StackPanel with a TextBox named SearchBox and a Button whose Click is wired to Search_Click. The build compiles the markup into generated code in the obj folder (MainPage.g.i.cs), the generated half of the partial class MyApp.MainPage, which holds the SearchBox field and the InitializeComponent method. The other half, MainPage.xaml.cs, is the code-behind the developer writes: its constructor calls InitializeComponent, and it defines the Search_Click event handler. At runtime InitializeComponent creates the objects: a MainPage containing a StackPanel, which contains the TextBox referenced by the SearchBox field and the Button whose Click event is wired to the handler.</desc>
