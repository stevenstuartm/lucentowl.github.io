<title id="awsy-title">Monthly cost of storing 1 TB in S3 Standard, Standard-IA, and Glacier Instant Retrieval as the data is read more often</title>
<desc id="awsy-desc">A line chart. The horizontal axis is how many times the whole terabyte is read per month, from 0 to 2. The vertical axis is monthly cost in dollars. S3 Standard is flat at 23 dollars because reads carry no retrieval fee. Standard-IA starts at 12.50 dollars and rises 10 dollars per full read, crossing Standard at about one read a month. Glacier Instant Retrieval starts at 4 dollars and rises 30 dollars per full read, crossing Standard at about 0.6 reads a month and reaching 64 dollars at two reads. Request charges are ignored.</desc>
