<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="ath-title ath-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ath-title">The pieces of an ASP.NET Core integration test built on WebApplicationFactory</title>
<desc id="ath-desc">Inside the test process, a test method sends requests through an HttpClient created by the factory. The client's handler hands each request straight to TestServer in memory, with no socket or port. TestServer runs the app built from its own Program: middleware, routing, authentication, endpoints, and any hosted services the test keeps. The app resolves services from its DI container, which holds the production registrations followed by the test's ConfigureTestServices registrations. One leaf, the external API client, is replaced by a fake. The DbContext is re-registered with the connection string of a SQL Server container, which runs outside the test process in Docker.</desc>
