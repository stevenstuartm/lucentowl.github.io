---
title: "Container Recycling in a Virtualized List"
kind: dynamic
system: winui
summary: "Containers exist only near the viewport and are reused as items scroll."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="wvr-title wvr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wvr-title">How a virtualized list reuses item containers while scrolling</title>
<desc id="wvr-desc">On the left, a column of data items from a collection of 10,000 orders, showing Order 37 through Order 48. On the right, UI containers exist only for Order 38 through Order 46. Orders 39 to 45 sit inside the viewport, the visible part of the list, and Orders 38 and 46 stand for the buffer just outside it, which in practice holds several viewports' worth of items and is shortened here to one item on each side. Each container is joined by a line to the data item it is bound to. Orders 37, 47, and 48 have no container at all. While the user scrolls down, the container for Order 38 moves out of range, and an arrow shows it being moved to the bottom and rebound to Order 47, joined to it by a dashed line, instead of a new container being created.</desc>

<marker id="wvr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent, #C0392B)"/>
</marker>
