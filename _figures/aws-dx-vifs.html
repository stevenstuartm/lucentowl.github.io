<title id="awsx2-title">How one Direct Connect connection carries public, private, and transit virtual interfaces to different AWS destinations</title>
<desc id="awsx2-desc">A customer router in a data center connects to an AWS router at a Direct Connect location over a cross-connect. That one connection carries several virtual interfaces. A public virtual interface reaches AWS public endpoints such as S3. A private virtual interface reaches a Direct Connect gateway, which connects to virtual private gateways on VPCs in any Region, or attaches directly to a single virtual private gateway. A transit virtual interface reaches a Direct Connect gateway associated with transit gateways, which connect many VPCs.</desc>
