<title id="stm-title">Data flow diagram of an order API with threats at trust boundaries</title>
<desc id="stm-desc">A customer's browser on the internet calls an order API in the application zone. The API writes to an orders database and an audit log in the data zone, sends payment requests to a third-party payment provider, and receives a payment webhook back from it. Each flow crosses a trust boundary, and each crossing carries a numbered threat: spoofed sessions and tampered prices from the browser, an over-privileged database account and missing tenant filters toward the database, card data leaking toward the payment provider, a forged payment webhook coming back, and an API that can edit its own audit trail. No threat sits inside a zone; every one sits on a crossing.</desc>
