<title id="aot-title">How telemetry flows from .NET's logging, tracing, and metrics APIs through the OpenTelemetry SDK to a collector and backends</title>
<desc id="aot-desc">Inside the app, telemetry is produced by .NET's own APIs: ILogger for log entries, the Microsoft.AspNetCore ActivitySource for request spans, a custom Orders.Processing ActivitySource for custom spans, the Microsoft.AspNetCore.Hosting meter for request duration, and a custom Orders.Api meter. The OpenTelemetry SDK subscribes to them by name. The LoggerProvider receives log entries. The TracerProvider receives the framework's request spans through the ASP.NET Core instrumentation and Orders.Processing through AddSource with the Orders.* wildcard, and its sampler keeps or drops each trace. The MeterProvider receives the hosting meter through the ASP.NET Core instrumentation and Orders.Api through AddMeter. A Billing.Sync ActivitySource that no AddSource call matches has no subscriber, so StartActivity returns null and nothing is recorded. All three providers feed one OTLP exporter configured by UseOtlpExporter, which sends to an OpenTelemetry Collector. The collector forwards each signal to the backend that stores it: a trace store, Prometheus, and a log store.</desc>
