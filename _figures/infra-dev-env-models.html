<title id="idm-title">Shared and per-developer layers in three developer environment models</title>
<desc id="idm-desc">In the shared data model, each developer has their own application stack, and the data stores and the network are shared by all developers. In the dedicated model, each developer has their own application stack, data stores, and network. In the shared network, personal data stores model, each developer has their own application stack and data stores, and the network is shared.</desc>
