<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="awsq-title awsq-desc" style="width:100%; min-width:700px; height:auto; display:block;">
<title id="awsq-title">Synchronous, asynchronous, and event source mapping invocation of a Lambda function</title>
<desc id="awsq-desc">Synchronous: a caller such as API Gateway, an Application Load Balancer, a function URL, or the SDK sends an event and waits for the function's response or error. Lambda does not retry; the caller decides. Asynchronous: an event source such as S3, SNS, or EventBridge hands the event to Lambda's internal queue and gets a 202 acknowledgment at once. Lambda invokes the function from the queue, retries function errors twice and throttles until the maximum event age, and sends events that exhaust retries or age out to an on-failure destination. Event source mapping: a Lambda-managed poller reads batches from a queue or stream such as SQS, Kinesis, DynamoDB Streams, or Kafka and invokes the function synchronously with each batch. A failed batch is retried: SQS messages reappear after the visibility timeout, and a stream retries from the failed record while its shard waits. For streams, records that exhaust retries or age out go to an on-failure destination set on the mapping.</desc>
