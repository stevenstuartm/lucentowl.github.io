<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="awsu-title awsu-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsu-title">The relationship between an ECS task definition, service, tasks, cluster, and load balancer</title>
<desc id="awsu-desc">A task definition revision describes the containers: images, CPU, memory, ports, roles, and secrets. A service is configured with that revision and a desired count of four. The service starts four tasks from the revision inside a cluster, spread across two Availability Zones, on Fargate, EC2, or managed instance capacity, and replaces any task that stops or fails health checks. An Application Load Balancer's target group holds each task's IP address, health-checks the tasks, and routes requests to them.</desc>
