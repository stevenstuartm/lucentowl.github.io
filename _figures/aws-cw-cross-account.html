<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="awscwx-title awscwx-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscwx-title">CloudWatch cross-account observability compared with log centralization</title>
<desc id="awscwx-desc">With cross-account observability, source accounts in one Region create links to a sink in a monitoring account in the same Region. The metrics, logs, and traces stay in the source accounts, which keep paying for them, and the monitoring account's dashboards, queries, and alarms read them in place. With log centralization, rules replicate new log events from source accounts in several Regions into centralized log groups in one destination account and Region, with an optional second copy in a backup Region. Events that arrived before the rule was created are not copied.</desc>
