---
title: "Endpoint Filter Order"
kind: dynamic
system: aspnet-core
summary: "Group filters wrap endpoint filters, and the result executes last."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="aef-title aef-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aef-title">The order endpoint filters run in around a minimal API handler</title>
<desc id="aef-desc">After parameter binding, which sets a 400 status if a route, query, or header value fails to bind, the request passes through the outer group's filter, the inner group's filter, and the endpoint's own filter, each running its code before next, and reaches the handler, which returns a result. After a binding failure the filters still run, but the handler is skipped. The result passes back through the endpoint filter, the inner group filter, and the outer group filter, each running its code after next. Only then does the framework execute the result, writing the status code, headers, and body.</desc>

.aef-div { stroke: var(--color-primary, #1A5F8A); stroke-width: 1; stroke-dasharray: 3 3; }
.aef-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.aef-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.aef-lg { font-size: 10.5px; fill: var(--color-text-light, #4A5568); }
.aef-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.aef-back { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.75; stroke-dasharray: 6 4; }
</style>
