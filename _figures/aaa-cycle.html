<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="aaa1-title aaa1-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aaa1-title">The AAA cycle's return paths and what triggers each one</title>
<desc id="aaa1-desc">Align, Agree and Apply run left to right, each forward arrow crossing a gate: a signed charter and alignment that holds up before Agree, real agreement and team ownership before Apply, ending in delivery. Three backward paths run underneath, drawn at increasing depth because a longer return reopens more. A Pivot loops over Align itself, re-scoping or proving out novelty before re-estimating. A circuit breaker trip or a failed assumption returns work from Apply to Agree, reshaping the solution while the problem still holds. Failure to reach agreement, or an appetite nothing fits, returns Agree to Align to re-examine the problem rather than the design. Deepest, a dependency failure or a gap that changes cost, timeline or scope returns Apply all the way to Align, where the agreement itself is renegotiated.</desc>

<text class="aaa-t" x="368" y="126">Agree</text>
<text class="aaa-k" x="368" y="146">[commit to how]</text>

<rect class="aaa-box" x="672" y="96" width="190" height="92" rx="6"/>
<text class="aaa-t" x="688" y="126">Apply</text>
<text class="aaa-k" x="688" y="146">[honor the agreement]</text>

<text class="aaa-s" x="607" y="168" text-anchor="middle">team owns the plan</text>

<path class="aaa-fwd" d="M 862,120 H 902" marker-end="url(#aaa1-a)"/>

<text class="aaa-s" x="445" y="478" text-anchor="middle">the agreement itself is renegotiated</text>

<text class="aaa-hd" x="32" y="512">BACKWARD &#183; HOW FAR BACK A PATH RUNS IS HOW MUCH IT REOPENS</text>

<path class="aaa-r-agree" d="M 236,536 H 266"/>

<path class="aaa-r-align" d="M 512,536 H 542"/>
