<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="awpe-title awpe-desc" style="width:100%; min-width:520px; max-width:760px; height:auto; display:block;">
<title id="awpe-title">How AWS evaluates IAM policies for a request within one account</title>
<desc id="awpe-desc">An authenticated request passes a series of checks in order. An explicit Deny in any applicable policy ends in Deny. Resource control policies and service control policies must each allow the action, or the request is denied. If a resource-based policy allows the action for the requesting IAM user or role session by name, the request is allowed with no further checks. If it names the role ARN instead, the identity-based check is skipped but the permissions boundary and session policy still apply. Otherwise the identity-based policies must allow the action, and any permissions boundary and session policy must allow it too. Passing every check ends in Allow.</desc>
