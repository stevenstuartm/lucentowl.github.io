---
title: "Sidecar Proxy"
kind: deployment
system: distributed-patterns
summary: "All traffic in and out of the pod passes through the sidecar."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="psc-title psc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="psc-title">A sidecar proxy beside an application in one pod</title>
<desc id="psc-desc">A pod runs the application alongside an Envoy proxy sidecar. Inbound traffic enters the pod through Envoy, which passes it to the application. The application's outbound calls also go through Envoy before leaving the pod. Envoy applies mutual TLS, retries, and tracing without any change to the application code.</desc>
