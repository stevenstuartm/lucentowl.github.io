<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="grp-title grp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="grp-title">An undirected graph stored as an adjacency list and as an adjacency matrix</title>
<desc id="grp-desc">An undirected graph with vertices A, B, C, and D and edges A–B, A–C, B–C, and C–D. As an adjacency list, A lists B and C, B lists A and C, C lists A, B, and D, and D lists C, for 8 entries, since each undirected edge appears in both endpoints' lists. As an adjacency matrix, a 4 by 4 grid holds 1 where the row and column vertices share an edge and 0 elsewhere. The matrix is symmetric and has 16 cells regardless of how many edges exist.</desc>
