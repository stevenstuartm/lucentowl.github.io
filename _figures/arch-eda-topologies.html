---
title: "Choreographed and Orchestrated Workflows"
kind: flow
system: architecture-styles
summary: "Components reacting on their own versus steps directed by a coordinator."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="eto-title eto-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="eto-title">Choreographed versus orchestrated workflows in event-driven architecture</title>
<desc id="eto-desc">In the choreographed workflow, an order placed event reaches inventory, payment, and notification at once, with no coordinator. Inventory publishes inventory reserved and payment publishes payment captured, and those events set off further reactions. In the orchestrated workflow, the order placed event goes to a coordinator, which sends step 1 to inventory, step 2 to payment after step 1 succeeds, and step 3 to notification after step 2 succeeds.</desc>
