<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="del-title del-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="del-title">An ELT pipeline loading raw data and refining it in layers</title>
<desc id="del-desc">Three sources, an application database read through change data capture, SaaS APIs, and an event stream, are extracted and loaded without transformation into the raw layer of the analytical store, often called bronze. Transformations run inside the store with SQL, producing a cleaned layer, silver, and then business-ready tables, gold. BI dashboards read the gold tables, and data science reads the silver and gold layers.</desc>
