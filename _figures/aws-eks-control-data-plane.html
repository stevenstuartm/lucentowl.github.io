<title id="awsz-title">An EKS cluster's control plane in an AWS-managed account and its data plane in your VPC and on-premises</title>
<desc id="awsz-desc">The EKS control plane, made up of the Kubernetes API server, scheduler, and etcd, runs across three Availability Zones in an AWS-managed account. It connects to your VPC through EKS network interfaces. Through them it talks to the data plane in your VPC: managed node groups of EC2 nodes you choose, EKS Auto Mode nodes that AWS runs, and Fargate pods that each get an isolated compute unit. Hybrid nodes on your own servers reach the same interfaces over a VPN or Direct Connect.</desc>
