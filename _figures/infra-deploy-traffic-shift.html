<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="idt-title idt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="idt-title">Share of traffic on the new version over time for rolling, blue-green, and canary deployments</title>
<desc id="idt-desc">Three small charts, each plotting the share of traffic on the new version from 0 to 100 percent over the course of one release. In a rolling deployment the share rises in even steps as each batch of instances is replaced. In a blue-green deployment the share stays at zero while the idle green environment is tested, then jumps to 100 percent at the switch. In a canary release the share rises in uneven steps of 5, 25, 50, and 100 percent, with a pause at each step while the new version is watched.</desc>

.idt-grid { stroke: var(--color-border, #D5DDE5); stroke-width: 1; stroke-dasharray: 3 4; }
.idt-line { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2.5; }
.idt-h { font-size: 14px; font-weight: 700; fill: var(--color-text, #2C3E50); }
.idt-tick { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.idt-note { font-size: 11.5px; font-style: italic; fill: var(--color-accent, #A5486E); }
.idt-cap { font-size: 12px; fill: var(--color-text, #2C3E50); }
</style>
