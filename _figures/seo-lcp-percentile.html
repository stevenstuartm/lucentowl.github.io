<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="swl-title swl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="swl-title">Distribution of Largest Contentful Paint across one page's visits</title>
<desc id="swl-desc">A histogram of LCP times for an illustrative page, in quarter-second bins from 0 to 7 seconds. 70 percent of visits are within the 2.5 second good threshold and 30 percent are slower. Visits peak just under 1 second, with half finishing by 1.6 seconds, and a long tail of slower visits stretches to the right, with about 4 percent beyond 7 seconds. The good threshold is 2.5 seconds. The 75th percentile falls at 2.8 seconds, past the threshold, so the page fails LCP even though most visits are fast.</desc>
