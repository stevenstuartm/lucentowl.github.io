<title id="aid-title">Two pipelines that carry IoT telemetry from a device to a dashboard</title>
<desc id="aid-desc">In the ASP.NET Core backend pipeline, a device sends telemetry to IoT Hub, a background service reads the hub's built-in Event Hubs endpoint and throttles the readings, and it pushes them through IHubContext to the SignalR hub's device groups, which deliver them to subscribed browsers. The browser subscribes to a device by calling a hub method over the same connection. In the serverless pipeline, IoT Hub triggers an Azure Function with an Event Hub trigger, the function's SignalR output binding sends the messages to Azure SignalR Service in Serverless mode, and the service delivers them to browsers. The browser gets its connection details from a negotiate function and subscribes by calling a subscribe function over HTTP, which adds its connection to a group in the service.</desc>
