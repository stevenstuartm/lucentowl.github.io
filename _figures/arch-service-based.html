<title id="asb-title">Service-based architecture topology</title>
<desc id="asb-desc">A user interface routes requests to four separately deployed, coarse-grained domain services: catalog, checkout, inventory, and fulfillment. Each service has its own API, business logic, and persistence. All four share one database, with tables grouped by domain: catalog, orders, stock, and shipping.</desc>
