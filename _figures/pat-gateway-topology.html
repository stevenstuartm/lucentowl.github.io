summary: "BFFs per client experience, one gateway, and proxies beside each service."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="pgt-title pgt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pgt-title">API gateway, backends for frontends, sidecars, and an ambassador in one system</title>
<desc id="pgt-desc">A web app calls a web BFF and a mobile app calls a mobile BFF, one BFF per client experience. Both BFFs call one API gateway, which handles all external traffic. The gateway routes to the orders service and the billing service, each running with a sidecar, one per service instance. The orders service calls an external API through an ambassador.</desc>
