<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="npb-title npb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="npb-title">A load balancer terminating client connections and forwarding to services</title>
<desc id="npb-desc">Clients on the internet connect to a load balancer over HTTP/2 with TLS, or HTTP/3 where the load balancer supports it. Client connections end at the load balancer, which is the trust boundary and enforces idle timeouts, stream limits, and connection-level defenses. Inside the private network, the load balancer opens its own connections to two service instances, over HTTP/1.1 by default or HTTP/2 or gRPC when configured. The services handle request-level concerns such as size limits, authentication, and per-user rate limits.</desc>
