<title id="aisa-title">Self-attention from one token to the tokens before it</title>
<desc id="aisa-desc">The sentence The animal didn't cross the street because it was tired, split into tokens. Curved lines run from the token it back to every earlier token, and a bar under each earlier token shows its attention weight. The heaviest line and tallest bar, 52 percent, go to animal, the noun it refers to. Street gets 18 percent, because 15 percent, and the rest a few percent each. The tokens after it, was and tired, are dashed out because a decoder-only model cannot see later tokens. The weights are illustrative, and a real model runs many attention heads.</desc>
