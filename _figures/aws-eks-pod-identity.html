<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="awspid-title awspid-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awspid-title">EKS Pod Identity credential path</title>
<desc id="awspid-desc">A pod whose service account has a Pod Identity association gets environment variables that point the AWS SDK's container credential provider at the Pod Identity agent, a DaemonSet on the same node listening on a link-local address. The SDK asks the agent for credentials, presenting the pod's service account token. The agent calls the EKS Auth service's AssumeRoleForPodIdentity action. EKS Auth looks up the association for the cluster, namespace, and service account and assumes the associated IAM role in the cluster's account, whose trust policy names the pods.eks.amazonaws.com service principal. If the association also names a target role in another account, EKS Pod Identity assumes that role through role chaining, and the pod receives the target role's credentials. Credentials return along the same path to the SDK.</desc>
