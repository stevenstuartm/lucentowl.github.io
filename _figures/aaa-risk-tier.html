<title id="aaa2-title">How Align sizing produces a Go, Pivot, or No-Go recommendation</title>
<desc id="aaa2-desc">Scope size and novelty are rated separately, each entering the risk tier on its own path, so a strong scope rating cannot hide a disqualifying novelty rating. Scope rates each domain as simple, average or complex and sums to small, medium or large. Novelty rates the problem for this team as well-understood, unfamiliar or novel. Together they give a tier of Low, Medium, High or Extreme. Separately, the effort estimate, a range with 20 to 30 percent contingency validated by the team, is checked against timeline, budget, staffing and dependencies. The tier and the fit check meet in one recommendation, a starting position for the stakeholder conversation. Go when the tier is Low or Medium and the estimate fits. Pivot when the tier is High or the estimate does not fit, by re-scoping, extending, adding resources or running a proof of concept, then re-estimating. No-Go when the tier is Extreme or no adjustment fits, by cancelling or funding a discovery spike.</desc>
