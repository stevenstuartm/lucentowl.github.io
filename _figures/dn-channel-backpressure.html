---
title: "A Bounded Channel Pipeline"
kind: flow
system: dotnet
summary: "Four concurrent stages joined by bounded channels that push back when full."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="chb-title chb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="chb-title">A multi-stage pipeline of bounded channels with backpressure</title>
<desc id="chb-desc">Items flow from a source through a parse stage into a channel bounded at 100 items, then a validate stage, a second channel bounded at 100, and a save stage. Every stage runs concurrently as its own task. When a channel is full, the upstream stage's WriteAsync waits until the downstream stage reads, so a slow save stage slows validate, which slows parse, instead of letting items pile up in memory.</desc>
