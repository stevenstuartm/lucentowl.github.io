---
title: "DNS Forwarding in a Hybrid Network"
kind: flow
system: networking
summary: "Each side forwards queries for the other side's zone."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="ndh-title ndh-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ndh-title">Conditional forwarding between on-premises DNS and a cloud resolver</title>
<desc id="ndh-desc">Two networks. On premises, office clients query the corporate DNS servers, which serve corp.example.com and forward queries for internal.example.com to the cloud resolver. In the cloud network, workloads query the cloud resolver, which holds the private zone internal.example.com and forwards queries for corp.example.com to the corporate DNS servers. If either forwarding rule is missing, names from the other side return NXDOMAIN.</desc>
<style>
.ndh-band { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1; stroke-dasharray: 5 4; }
.ndh-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.ndh-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.ndh-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.ndh-n-inv { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
.ndh-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.ndh-k-inv { font-size: 10.5px; font-style: italic; fill: #FFFFFF; }
.ndh-lab { font-size: 11px; font-weight: 600; fill: var(--color-primary, #1A5F8A); }
.ndh-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
</style>

<rect class="ndh-band" x="584" y="14" width="302" height="256" rx="8"/>
<text class="ndh-k" x="596" y="32">cloud network</text>

<rect class="ndh-box" x="36" y="44" width="258" height="46" rx="6"/>

<rect class="ndh-sys" x="36" y="166" width="258" height="88" rx="6"/>

<text class="ndh-k-inv" x="48" y="210">serve corp.example.com</text>
<text class="ndh-k-inv" x="48" y="228">forward internal.example.com</text>

<rect class="ndh-box" x="606" y="44" width="258" height="46" rx="6"/>

<rect class="ndh-sys" x="606" y="166" width="258" height="88" rx="6"/>
<text class="ndh-n-inv" x="618" y="190">Cloud resolver</text>
<text class="ndh-k-inv" x="618" y="210">private zone internal.example.com</text>
<text class="ndh-k-inv" x="618" y="228">forwards corp.example.com</text>

<path class="ndh-flow" d="M 165,90 L 165,160" marker-end="url(#ndh-a)"/>

<text class="ndh-k" x="14" y="296">A missing rule on either side leaves the other side's names returning NXDOMAIN.</text>
