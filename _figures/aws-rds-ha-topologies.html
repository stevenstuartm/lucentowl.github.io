title: "Three Ways RDS and Aurora Stay Available"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 320" role="img" aria-labelledby="awsm-title awsm-desc" style="width:100%; min-width:760px; height:auto; display:block;">
<title id="awsm-title">Multi-AZ DB instance, Multi-AZ DB cluster, and Aurora DB cluster compared</title>
<desc id="awsm-desc">Three panels. In a Multi-AZ DB instance deployment, a primary in zone a copies every write synchronously to a standby in zone b, each with its own EBS volume, and the standby serves no reads; failover takes 60 to 120 seconds. In a Multi-AZ DB cluster, a writer in zone a replicates to readers in zones b and c, and a commit waits for one reader to confirm; readers serve reads and failover takes under 35 seconds. In an Aurora DB cluster, a writer and two readers in three zones share one cluster volume that keeps six copies of the data across three zones; readers serve reads and failover usually takes under 60 seconds, often under 30.</desc>
