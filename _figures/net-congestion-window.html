---
title: "TCP Congestion Window Over Time"
kind: chart
system: networking
summary: "The window doubles each round trip, then grows slowly and halves on loss."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="ncw-title ncw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ncw-title">Illustrative TCP congestion window across round trips</title>
<desc id="ncw-desc">A line chart of how much data a TCP sender allows in flight, across successive round trips. In slow start the window doubles every round trip, from one segment to thirty-two over five round trips. Growth then turns linear, adding a little each round trip. When a packet is lost the window is cut in half, and linear growth resumes from there. The shape is the classic Reno-style pattern; newer algorithms such as CUBIC and BBR grow differently.</desc>

</style>
