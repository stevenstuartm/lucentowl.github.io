---
title: "Binary Search Step by Step"
kind: flow
system: dsa
summary: "How binary search halves the range it still has to check with each comparison until it finds a match or the range is empty."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 408" role="img" aria-labelledby="bs2-title bs2-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="bs2-title">Binary search for 63 in a sorted array of 15 values</title>
<desc id="bs2-desc">A sorted array of 15 values, 3, 8, 12, 17, 21, 25, 30, 34, 41, 47, 52, 58, 63, 70, 77, at indexes 0 to 14, searched for 63. Step 1: the range is 0 to 14, the middle is index 7, and 34 is less than 63, so the left half is ruled out and left becomes 8. Step 2: the range is 8 to 14, the middle is index 11, and 58 is less than 63, so left becomes 12. Step 3: the range is 12 to 14, the middle is index 13, and 70 is more than 63, so right becomes 12. Step 4: the range is just index 12, which holds 63, a match. Four comparisons cover 15 values, because each one rules out half of what remains.</desc>
