title: "Row vs Column Layout"

summary: "The same four orders stored row by row and column by column."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="drc-title drc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="drc-title">Four orders laid out in row-oriented pages and in column-oriented storage</title>
<desc id="drc-desc">In row-oriented storage, each page holds whole rows: page 1 holds orders 1 and 2 with their id, name, total, and date together, and page 2 holds orders 3 and 4. Reading one order reads one page. In column-oriented storage, each column is stored separately: all ids together, all names together, all totals together, and all dates together. Summing the total column reads only the totals.</desc>
