---
title: "Where the Filtering Happens"
kind: flow
system: dotnet
summary: "An IQueryable sending one query, against an IEnumerable pulling every row."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="qve-title qve-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="qve-title">IQueryable translates the query to SQL while IEnumerable filters in memory</title>
<desc id="qve-desc">Top, IQueryable: Where, OrderBy, and Take build one expression tree in your process, the provider translates it into one SQL query, and the database returns only the 10 matching rows. Bottom, IEnumerable: the database sends every row into your process, where Where, OrderBy, and Take run in memory to produce the same 10 rows. Both produce the same result; the difference is how much data crosses the network and where the filtering runs.</desc>
