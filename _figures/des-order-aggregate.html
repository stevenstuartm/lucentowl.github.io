---
title: "Order Aggregate"
kind: structure
system: architecture-design
summary: "Changes go through the root, and other aggregates are referenced by id."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="dag-title dag-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dag-title">An order aggregate and its reference to a customer aggregate</title>
<desc id="dag-desc">The order aggregate contains the order, which is the root, and its order lines. The root enforces three invariants: the total equals the sum of the lines, no changes once confirmed, and no confirming an empty order. Outside the boundary, the order references the separate customer aggregate by id only, through a CustomerId.</desc>
