---
title: "Redirecting a Second Launch to the Running Instance"
kind: dynamic
system: winui
summary: "A second launch finds the running instance by key, hands over its activation, and exits."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="war-title war-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="war-title">How a single-instance WinUI app redirects a second launch</title>
<desc id="war-desc">Two columns show two processes of the same app. On the right, the running instance called FindOrRegisterForKey with the key main at its own startup, got IsCurrent true, and kept the key. On the left, a second launch starts a new process. Its custom Main reads its activation with GetActivatedEventArgs, then calls FindOrRegisterForKey with the same key. A dashed line shows that this call finds the running instance by key, so it returns that instance with IsCurrent false. The new process then calls RedirectActivationToAsync with its activation arguments and brings the running instance's window forward, and an arrow carries the activation across to the running instance, where the Activated event receives the same AppActivationArguments. The running instance then activates its window and routes the activation on the UI thread. The second process returns from Main and exits without creating a window.</desc>

<marker id="war-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary, #1A5F8A)"/>
</marker>
<marker id="war-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent, #C0392B)"/>
</marker>
</defs>

<text class="war-k" x="56" y="100">in the custom Main: why this launch happened</text>

<rect class="war-box" x="40" y="140" width="360" height="52" rx="4"/>

<text class="war-k" x="56" y="180">returns the running instance, IsCurrent = false</text>

<text class="war-k" x="516" y="100">at its own startup: IsCurrent = true, keeps the key</text>

<text class="war-n" x="516" y="322">Activate window, route</text>
<text class="war-k" x="516" y="340">on the UI thread, through the navigation service</text>
