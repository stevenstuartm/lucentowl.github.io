<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="aks-title aks-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aks-title">The timeline of a Kubernetes pod shutdown for an ASP.NET Core app with a 10-second preStop sleep and a 60-second grace period</title>
<desc id="aks-desc">At time zero the pod is deleted and the 60-second termination grace period starts. Two things happen at once. The kubelet runs the preStop hook, a 10-second sleep. Meanwhile the control plane removes the pod from the Service's endpoints, and node proxies and load balancers take a few seconds to stop sending it traffic. During the sleep the app keeps serving normally, so requests that still arrive are handled. At 10 seconds the kubelet sends SIGTERM. The app raises ApplicationStopping, Kestrel stops accepting connections and drains in-flight requests, hosted services stop, and the process exits, all within its 45-second ShutdownTimeout, which ends at 55 seconds. If the container is still running when the grace period ends at 60 seconds, the kubelet kills it with SIGKILL.</desc>
