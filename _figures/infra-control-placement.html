title: "Where Governance Controls Sit"
kind: flow

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="icp-title icp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="icp-title">Where preventive, detective, and corrective controls sit on the paths a change can take</title>
<desc id="icp-desc">A change made through infrastructure as code passes pipeline checks, then a deployment-service hook if the tool deploys through one, then the cloud API, where organization policy applies, before it reaches the running resources. A change made by hand in the console, a CLI, or a script bypasses the pipeline checks and the hook and goes straight to the cloud API, where organization policy still applies to every account it covers. Pipeline checks, hooks, and organization policy are preventive. Detective rules evaluate the running resources they cover after the fact, and corrective actions triggered by their findings fix or revert the resources.</desc>
