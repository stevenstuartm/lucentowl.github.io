title: "Modules in One Deployable Application"
kind: component

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="amm-title amm-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="amm-title">Modular monolith: modules, public interfaces, and module-owned schemas</title>
<desc id="amm-desc">One deployable application holds a Checkout module and an Inventory module. Each exposes a public interface and hides its domain model, logic, and data access. Checkout calls Inventory only through IInventoryService. Each module owns its own schema, and Checkout reaching into the inventory schema directly is not allowed.</desc>
