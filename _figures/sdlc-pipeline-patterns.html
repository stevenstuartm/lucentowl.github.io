<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 582" role="img" aria-labelledby="pip-title pip-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pip-title">Four CI/CD pipeline patterns shown as small flow diagrams</title>
<desc id="pip-desc">Sequential: build, test, package, deploy and verify run one after another. Parallel: after build, unit tests, integration tests, a security scan and linting run at once, then join into package and deploy. Fan-out and fan-in: a package deploys to regions A, B and C at the same time, the results are aggregated, then verified. Branch-based: a feature branch runs a PR pipeline of build, test and security scan; the main branch runs the full pipeline including deployment to staging; a release tag runs the production pipeline that deploys to production.</desc>
