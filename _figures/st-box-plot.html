<title id="stbx-title">Eleven order values drawn as a box plot</title>
<desc id="stbx-desc">Eleven order values from 14 to 310 dollars are plotted as dots on a dollar axis, with ten of them bunched between 14 and 60 and one at 310. The mean of 57.18 dollars falls to the right of all but two orders. Below, the box plot draws a box from the first quartile at 23.50 to the third quartile at 44.50 with the median at 30, whiskers from 14 to 60, a fence at 76 dollars, and the 310 order as a separate outlier point.</desc>
