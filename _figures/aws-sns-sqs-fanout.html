<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="awsfo-title awsfo-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsfo-title">An SNS topic fanning out to SQS queues</title>
<desc id="awsfo-desc">A publisher sends each message once to an SNS topic. The topic delivers a copy to three SQS queues, one each for the fulfillment, inventory, and email consumers. Each consumer reads only its own queue, and each queue has its own dead-letter queue for messages that fail repeatedly. A Lambda function subscribed directly to the topic, with no queue, receives the message by push and has only SNS's retries, with no backlog of its own.</desc>
