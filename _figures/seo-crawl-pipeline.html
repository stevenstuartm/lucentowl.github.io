title: "From Crawl to Results"

summary: "A page's path from crawl queue to results, and the control acting at each step."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="swp-title swp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="swp-title">How a search engine crawls, renders, indexes, and serves a page</title>
<desc id="swp-desc">URLs from links on known pages and from sitemaps enter the crawl queue. The crawler, Googlebot, fetches the raw HTML. Pages that return 200 wait in the render queue, sometimes for seconds or longer, until a headless Chromium renderer runs their JavaScript. The indexer groups duplicate URLs and keeps one canonical URL per group, and serving ranks canonical URLs for each query. Links found in the raw HTML and after rendering go back to the crawl queue. Controls act at each stage: robots.txt disallow at the crawl queue, the HTTP status code and an initial noindex at the crawler, blocked CSS or JavaScript at the renderer, noindex, redirects, and rel=canonical at the index, and snippet controls at serving.</desc>

.swp-ctl { fill: var(--color-bg, #F7F9FC); stroke: var(--color-secondary, #2D5A85); stroke-width: 1.25; stroke-dasharray: 4 3; }
.swp-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.swp-c { font-size: 12px; font-weight: 700; fill: var(--color-secondary, #2D5A85); }
.swp-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.swp-t { font-size: 11px; fill: var(--color-text, #2C3E50); }
.swp-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.swp-loop { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 1.75; stroke-dasharray: 6 4; }
.swp-tie { fill: none; stroke: var(--color-secondary, #2D5A85); stroke-width: 1.25; stroke-dasharray: 2 3; }
.swp-lk { font-size: 10.5px; font-style: italic; fill: var(--color-accent, #A5486E); }
</style>
<defs>
<marker id="swp-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
<marker id="swp-b" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-accent, #A5486E)"/></marker>
</defs>
<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text class="swp-t" x="295" y="24" text-anchor="middle">links on known pages, sitemaps</text>
<path class="swp-flow" d="M 295,32 V 56" marker-end="url(#swp-a)"/>
<rect class="swp-box" x="190" y="60" width="210" height="60" rx="6"/>
<text class="swp-n" x="202" y="85">Crawl queue</text>
<text class="swp-k" x="202" y="104">URLs waiting to be fetched</text>
<path class="swp-flow" d="M 295,122 V 146" marker-end="url(#swp-a)"/>
<path class="swp-tie" d="M 404,90 H 476"/>
<rect class="swp-ctl" x="480" y="60" width="400" height="60" rx="6"/>
<text class="swp-c" x="492" y="80">robots.txt disallow</text>
<text class="swp-k" x="492" y="97">URL isn't fetched. If other pages link to it,</text>
<text class="swp-k" x="492" y="112">it can still be indexed without its content.</text>
<rect class="swp-box" x="190" y="150" width="210" height="60" rx="6"/>
<text class="swp-n" x="202" y="175">Crawler (Googlebot)</text>
<text class="swp-k" x="202" y="194">fetches the raw HTML</text>
<path class="swp-flow" d="M 295,212 V 236" marker-end="url(#swp-a)"/>
<path class="swp-tie" d="M 404,180 H 476"/>
<rect class="swp-ctl" x="480" y="150" width="400" height="60" rx="6"/>
<text class="swp-c" x="492" y="170">HTTP status code, initial noindex</text>
<text class="swp-k" x="492" y="187">4xx removes the URL, and 5xx or 429 slows crawling.</text>
<text class="swp-k" x="492" y="202">A noindex here may mean the page is never rendered.</text>
<rect class="swp-box" x="190" y="240" width="210" height="60" rx="6"/>
<text class="swp-n" x="202" y="265">Render queue</text>
<text class="swp-k" x="202" y="284">waits seconds, or longer</text>
<path class="swp-flow" d="M 295,302 V 326" marker-end="url(#swp-a)"/>
<rect class="swp-box" x="190" y="330" width="210" height="60" rx="6"/>
<text class="swp-n" x="202" y="355">Renderer</text>
<text class="swp-k" x="202" y="374">headless Chromium runs the JS</text>
<path class="swp-flow" d="M 295,392 V 416" marker-end="url(#swp-a)"/>
<path class="swp-tie" d="M 404,360 H 476"/>
<rect class="swp-ctl" x="480" y="330" width="400" height="60" rx="6"/>
<text class="swp-c" x="492" y="350">Blocked CSS or JavaScript</text>
<text class="swp-k" x="492" y="367">The page renders incompletely, so content</text>
<text class="swp-k" x="492" y="382">and links on it can be missed.</text>
<rect class="swp-box" x="190" y="420" width="210" height="60" rx="6"/>
<text class="swp-n" x="202" y="445">Index</text>
<text class="swp-k" x="202" y="464">groups duplicates, keeps canonicals</text>
<path class="swp-flow" d="M 295,482 V 506" marker-end="url(#swp-a)"/>
<path class="swp-tie" d="M 404,450 H 476"/>
<rect class="swp-ctl" x="480" y="420" width="400" height="60" rx="6"/>
<text class="swp-c" x="492" y="440">noindex, redirects, rel=canonical</text>
<text class="swp-k" x="492" y="457">noindex keeps the page out of results. Redirects</text>
<text class="swp-k" x="492" y="472">and canonical tags steer which URL represents it.</text>
<rect class="swp-box" x="190" y="510" width="210" height="60" rx="6"/>
<text class="swp-n" x="202" y="535">Serving</text>
<text class="swp-k" x="202" y="554">ranks canonical URLs per query</text>
<path class="swp-tie" d="M 404,540 H 476"/>
<rect class="swp-ctl" x="480" y="510" width="400" height="60" rx="6"/>
<text class="swp-c" x="492" y="530">nosnippet, max-snippet, data-nosnippet</text>
<text class="swp-k" x="492" y="547">Limit what the result, including AI features,</text>
<text class="swp-k" x="492" y="562">can show from the page.</text>
<text class="swp-t" x="305" y="230">200 OK</text>
<path class="swp-loop" d="M 186,360 H 130 V 90 H 184" marker-end="url(#swp-b)"/>
<path class="swp-loop" d="M 186,180 H 130"/>
<text class="swp-lk" x="122" y="226" text-anchor="end">new links</text>
<text class="swp-lk" x="122" y="241" text-anchor="end">found in</text>
<text class="swp-lk" x="122" y="256" text-anchor="end">the HTML</text>
<text class="swp-lk" x="122" y="271" text-anchor="end">and after</text>
<text class="swp-lk" x="122" y="286" text-anchor="end">rendering</text>
<path class="swp-flow" d="M 40,594 H 76" marker-end="url(#swp-a)"/>
<text class="swp-t" x="84" y="598">page moves to the next stage</text>
<path class="swp-loop" d="M 300,594 H 336" marker-end="url(#swp-b)"/>
<text class="swp-t" x="344" y="598">discovered links re-enter the queue</text>
<path class="swp-tie" d="M 590,594 H 626"/>
<text class="swp-t" x="634" y="598">control acting at that stage</text>
</g>
