---
title: "One Context Window, Shared"
kind: layering
system: ai-core
summary: "Prompt, history, documents, and output all drawn from one token budget."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="aicb-title aicb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aicb-title">Everything in a request shares one context window</title>
<desc id="aicb-desc">Two horizontal bars, each measured against a dashed context window limit. The first request holds a small system prompt, the conversation history, documents and tool results, a short new message, and room for the generated output and reasoning, with a little space to spare. In the second request the history and documents are larger and the input reaches the limit on its own, so the output segment sits outside the window with no room, and the request fails or the output is cut short.</desc>
