---
title: "The Main Sequence"
kind: chart
system: architecture-styles
summary: "Abstractness against instability, with the two zones to avoid."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="msq-title msq-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="msq-title">Abstractness plotted against instability, with the main sequence</title>
<desc id="msq-desc">A square chart with instability I on the horizontal axis and abstractness A on the vertical axis, both from 0 to 1. The main sequence is the diagonal line A plus I equals 1, running from the top left to the bottom right, and components on or near it are balanced. The bottom-left corner, concrete and heavily depended on, is the zone of pain. The top-right corner, abstract with nothing depending on it, is the zone of uselessness. A component off the line sits a distance D from it, measured as the vertical gap, which equals the absolute value of A plus I minus 1.</desc>
