summary: "Which inputs are trusted code, which are untrusted data, and the only safe ways data may reach a shell."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="gc10-title gc10-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc10-title">Gas City command trust boundaries</title>
<desc id="gc10-desc">City config is trusted operator code and imported packs are trusted dependency code; both define the shell commands Gas City runs, on the orchestrator side (work_query, scale_check, order checks and exec, sling_query, on_boot and on_death) and inside sessions (the agent command, pre_start, and session setup). Work content such as bead titles, mail, formula variables, PR text, and API fields is untrusted data: it may reach those commands only as environment variables, JSON, stdin, or argv, never concatenated into sh -c. The ambient environment passes through a filter that strips secret-looking keys before orchestrator-side shells run, while values placed explicitly in configuration pass through by design.</desc>
