---
title: "Push vs. Pull Delivery"
kind: flow
system: infrastructure
summary: "A pipeline pushes each merged change, while an agent pulls and reconciles."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="ipp-title ipp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ipp-title">Push-based pipeline delivery compared with pull-based GitOps delivery</title>
<desc id="ipp-desc">In push delivery, an event in the Git repository, such as a merge or a pull-request comment, triggers a CI pipeline, which holds the cloud credentials and applies the change to the resources. Between runs nothing reconciles, and drift shows up only if a scheduled check is set up. In pull delivery, an agent pulls the desired state from the Git repository on its own schedule, applies it to the resources directly or through an operator, and keeps observing their actual state, comparing the two on every interval.</desc>
