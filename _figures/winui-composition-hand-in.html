<title id="wch-title">How a frosted-glass composition effect attaches to a XAML element</title>
<desc id="wch-desc">Three columns. The left column is the XAML tree: a Grid with two children, an Image and an empty Canvas named GlassHost. The middle column is the composition visuals: each XAML element is backed by a handout Visual that GetElementVisual returns, and XAML sets its Offset, Size, and Opacity. The composition visuals form the same tree as the XAML elements. Under the GlassHost visual, the app attaches a hand-in SpriteVisual with SetElementChildVisual, as the last child, so it draws on top of the element. The right column is the brush graph that paints the sprite. A CompositionBackdropBrush supplies the pixels behind the sprite. It plugs into the source parameter of a GaussianBlurEffect, a Win2D effect description. CreateEffectFactory compiles that description and CreateBrush makes a CompositionEffectBrush from it, which is the sprite's Brush. An expression animation keeps the sprite's Size equal to the host visual's Size.</desc>
