title: "Envelope Encryption"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="see-title see-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="see-title">Envelope encryption with a key management service</title>
<desc id="see-desc">An application asks the key management service for a new data encryption key and receives it twice: in plaintext and wrapped under a key encryption key that never leaves the service. The application encrypts the data locally with the plaintext data key, discards it, and stores the ciphertext together with the wrapped data key. To decrypt, the application sends only the small wrapped key to the service, which unwraps it if the caller is authorized. A stolen database therefore holds only ciphertext and wrapped keys, and revoking the application's permission on the key encryption key makes every data key unusable.</desc>
