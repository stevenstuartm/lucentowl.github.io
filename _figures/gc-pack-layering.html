<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="gc8-title gc8-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc8-title">How Gas City layers packs and scopes formulas and agents</title>
<desc id="gc8-desc">Two stacks of formula layers, highest priority on top. The city scope stacks city-local formulas over the packs the city imports over the system formulas embedded in the gc binary. A rig scope stacks rig-local formulas over the packs the rig imports over the whole city stack as its base. For each scope, the winning formula per name is staged as a symlink in that scope's .beads/formulas directory. Agents scoped to the city get one instance for the city; agents scoped to a rig get one instance per rig.</desc>
