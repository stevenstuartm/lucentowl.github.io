<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" role="img" aria-labelledby="bfo-title bfo-desc" style="width:100%; min-width:660px; height:auto; display:block;">
<title id="bfo-title">Breadth-first and depth-first search on the same graph, starting from A</title>
<desc id="bfo-desc">An undirected graph with edges A–B, A–C, B–D, B–E, C–F, and E–F, searched twice from A, taking neighbors in the order they were added. Breadth-first search visits A, then B and C at distance 1, then D, E, and F at distance 2. It first reaches each vertex along A–B, A–C, B–D, B–E, and C–F, and the edge E–F leads only to a vertex already visited. Depth-first search visits A, B, D, E, F, then C. It goes from A to B, down to D, back up to B, then to E, on to F, and reaches C last through F. The edge A–C leads only to a vertex already visited.</desc>
