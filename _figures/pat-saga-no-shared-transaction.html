---
title: "One Transaction Versus Separate Databases"
kind: structure
system: distributed-patterns
summary: "One all-or-nothing commit, or three local commits with nothing tying them."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="pst-title pst-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pst-title">A single database transaction compared with separate service databases</title>
<desc id="pst-desc">In a monolith, one transaction inserts the order, updates inventory, and inserts the payment, and commits all or nothing. With microservices, the order, payment, and inventory services each own a database and commit locally, and no shared transaction covers the three.</desc>

.pst-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pst-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.pst-s-inv { font-size: 11.5px; fill: #FFFFFF; }

</style>
