---
title: "gRPC from a Browser"
kind: flow
system: architecture-design
summary: "gRPC-Web or JSON transcoding translates to native gRPC before the service."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="dgb-title dgb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dgb-title">Two ways for a browser to reach a gRPC service</title>
<desc id="dgb-desc">Two paths. In the first, the browser calls with gRPC-Web over HTTP/1.1 or HTTP/2 to gRPC-Web support, provided by Envoy or by the server itself, which calls the service with gRPC. In the second, the browser calls with REST and JSON to JSON transcoding, running in-process or in a proxy such as grpc-gateway, which calls the service with gRPC.</desc>
