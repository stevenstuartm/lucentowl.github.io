---
title: "A Reverse Edge Undoing a Poor Choice"
kind: flow
system: dsa
summary: "How a residual reverse edge lets a later path reroute earlier flow."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="mf-title mf-desc" style="width:100%; min-width:660px; height:auto; display:block;">
<title id="mf-title">Maximum flow found by pushing flow back along a reverse edge</title>
<desc id="mf-desc">A network with source s, sink t, and vertices a and b. Every edge has capacity 1: s to a, s to b, a to b, a to t, and b to t. Step 1: a first path chosen without breadth-first search is s to a to b to t, carrying 1. After it, every path from s to t in the original edges runs into a full edge. Step 2, showing only the edges the second path uses: spare capacity remains on s to b and a to t, and using a to b created a reverse edge from b to a with capacity 1. The path s to b to a to t uses that reverse edge. Step 3: the final flow sends 1 along s to a to t and 1 along s to b to t, and a to b carries nothing, because the second path cancelled the first path's use of it. The maximum flow is 2.</desc>
