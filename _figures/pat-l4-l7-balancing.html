<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="plb-title plb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="plb-title">Layer 4 balancing compared with layer 7 balancing for one HTTP/2 connection</title>
<desc id="plb-desc">Two panels. A client holds one HTTP/2 connection to a load balancer. A layer 4 balancer balances connections, so all 500 requests on that connection go to instance A and instance B sits idle. A layer 7 balancer balances requests, so about 250 go to instance A and about 250 to instance B.</desc>

</style>
