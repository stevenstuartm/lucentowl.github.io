<text class="um-el" x="372" y="312">activity final</text>
<rect class="um-note" x="470" y="222" width="406" height="100" rx="4"/>
<text class="um-cap" x="486" y="248">A diamond is a decision when one flow enters and</text>
<text class="um-cap" x="486" y="268">guarded flows leave, and a merge when alternatives</text>
<text class="um-cap" x="486" y="288">rejoin. A bar is a fork when it splits one flow into</text>
<text class="um-cap" x="486" y="308">parallel flows, and a join when it waits for all of them.</text>
<text class="um-cap" x="24" y="356">Using a join where the branches are alternatives describes a process that never completes.</text>
