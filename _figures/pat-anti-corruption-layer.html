<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="pac-title pac-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pac-title">An anti-corruption layer between a new system and a legacy system</title>
<desc id="pac-desc">The new system works with a domain model in its own terms. Its requests pass through the anti-corruption layer, which translates requests, translates responses, and maps codes and ids, to the legacy API or database, whose data uses legacy names such as CUST_ID and STAT equals A. Responses come back through the same layer.</desc>
