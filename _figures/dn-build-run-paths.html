<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="brp-title brp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="brp-title">The three .NET compilation strategies split by build time and run time</title>
<desc id="brp-desc">Roslyn compiles C# source to IL plus metadata in an assembly at build time. Under the default JIT path, the JIT compiles each method to native code on its first call at run time. ReadyToRun is a publish step that adds precompiled native code to the same assembly, so that code runs immediately and the JIT later recompiles hot methods. Native AOT is a publish step that produces a native executable with no IL, which runs with no JIT at all.</desc>
