---
title: "Server-Side Apply Field Ownership"
kind: structure
system: architecture-design
summary: "Each field has a manager, and changing another manager's field is a conflict."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dsa-title dsa-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dsa-title">Field ownership on a Kubernetes Deployment under server-side apply</title>
<desc id="dsa-desc">A Deployment object with two fields. A human applying through kubectl owns the web container's image field. An autoscaler controller owns the replicas field. Each manager sets its own field independently. When kubectl applies a different replicas value, the API server rejects the whole apply with 409 Conflict because the autoscaler owns that field. The caller either drops the field or resubmits with force-conflicts to take ownership.</desc>
