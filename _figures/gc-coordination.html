<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="gc9-title gc9-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc9-title">How Gas City agents coordinate without referencing each other</title>
<desc id="gc9-desc">The mayor session reaches other agents only through the bead store. Mail is a bead of type message, injected into the recipient's context by a hook on its next turn. Slung work is a bead routed to a pool, claimed by a worker's hook. Both survive a crash. A nudge is the one channel that bypasses the store: it types text straight into the recipient's terminal and is lost if that session is down. A strip below shows where the harness hooks fire: at session start, on each turn, and before compaction.</desc>
