title: "Gas City Containers on One Machine"
kind: container

summary: "One supervisor per machine, one controller per city, and a loop that closes through the store instead of callbacks."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="gc2-title gc2-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc2-title">Gas City containers on one machine</title>
<desc id="gc2-desc">One gc supervisor process per machine hosts the HTTP and SSE API with the dashboard, and one city controller per registered city. The controller reloads the city and pack config when it changes, reads and writes session beads, pool demand, and order tracking beads in the city's single Dolt server, records to and reads from the append-only event log, and starts, stops, interrupts, and peeks sessions through the runtime provider. The sessions are worker pools, an always-on named session, and a deterministic control-dispatcher that runs v2 control beads. Every session claims, closes, and mails through the bead store. No edge runs from a session back to the controller: the loop closes through the store.</desc>
