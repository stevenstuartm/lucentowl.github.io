title: "Two RAG Pipelines Sharing One Index"
kind: flow

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="rag-title rag-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="rag-title">The indexing and query pipelines of a RAG system</title>
<desc id="rag-desc">Indexing runs offline whenever content changes: source documents are parsed and cleaned, chunked, embedded, and written to an index holding vectors, text, metadata, and access rules. The query pipeline runs per request: the user question is rewritten and embedded, candidates are retrieved from the index with vector and keyword search filtered by metadata and user permissions, reranked to the top passages, assembled into a prompt with instructions and the question, and sent to the model, which answers with citations.</desc>
