---
title: "Dead Letter Queue"
kind: flow
system: distributed-patterns
summary: "A message that keeps failing moves aside so the queue keeps flowing."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="pdl-title pdl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pdl-title">Dead letter queue flow</title>
<desc id="pdl-desc">Message A fails processing and is retried three times, failing each time. After the last retry, the broker moves it to a dead letter queue with its failure count, reason, and timestamp, where it waits for manual review or automated replay. Messages B and C behind it keep flowing to the consumer.</desc>
