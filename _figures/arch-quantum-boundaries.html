<title id="aqb-title">Where the architecture quantum boundary falls in three cases</title>
<desc id="aqb-desc">Three cases. A synchronous call from Order to Payment binds them into one quantum: if Payment is down, orders stop. An asynchronous message through a queue leaves Order and Payment as two quanta: if Payment is down, orders wait in the queue and are paid later. Three services that deploy separately but share one database form one quantum, because none can run correctly without the shared database.</desc>
