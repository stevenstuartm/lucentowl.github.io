---
title: "Where EBS and EFS Live"
kind: deployment
system: aws
summary: "An EBS volume stays in one zone; an EFS file system spans the Region."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="awsb-title awsb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsb-title">The scope of an EBS volume, an EBS snapshot, and an EFS file system</title>
<desc id="awsb-desc">A Region contains Availability Zones a and b. In zone a, instance 1 is attached to an EBS volume that exists only in zone a. A snapshot of that volume is stored at Region scope, and a new volume restored from it in zone b is attached to instance 2. An EFS file system is stored at Region scope across three or more zones. Each zone has one mount target, and each instance mounts the file system through the mount target in its own zone.</desc>
