<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="fw-title fw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="fw-title">The blocks of positions covered by the slots of an eight-element Fenwick tree</title>
<desc id="fw-desc">Eight positions numbered 1 to 8, with one bar per slot showing the positions it sums. Slots 1, 3, 5, and 7 cover one position each. Slot 2 covers 1 to 2, slot 6 covers 5 to 6, slot 4 covers 1 to 4, and slot 8 covers 1 to 8. Each bar's length is the lowest set bit of the slot number. Left: a prefix sum through position 7 adds slots 7, 6, and 4, which cover positions 7, 5 to 6, and 1 to 4, stepping 7, 6, 4, 0 by removing the lowest set bit each time. Right: adding to position 5 updates slots 5, 6, and 8, every block that holds position 5, stepping 5, 6, 8, 16 by adding the lowest set bit each time and stopping past the end.</desc>
