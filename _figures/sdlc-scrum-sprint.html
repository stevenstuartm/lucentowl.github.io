<title id="scr-title">The Scrum events inside one Sprint, with the artifacts they read and produce</title>
<desc id="scr-desc">The Product Backlog, with its Product Goal, feeds Sprint Planning, which produces the Sprint Backlog with its Sprint Goal. Inside the Sprint the Daily Scrum repeats every 24 hours, inspecting progress and adapting the plan, and work becomes the Increment, which meets the Definition of Done. The Sprint Review inspects the Increment with stakeholders and its feedback revises the Product Backlog. The Sprint Retrospective follows and produces improvements for the next Sprint, which starts at Planning with no gap.</desc>
