<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="awsa-title awsa-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsa-title">How clients reach edge-optimized, Regional, and private REST API endpoints, and how a VPC link reaches private backends</title>
<desc id="awsa-desc">An edge-optimized endpoint is reached through a CloudFront distribution that API Gateway manages. A Regional endpoint is reached directly, optionally through a CloudFront distribution you own. A private endpoint is reached only from inside a VPC, through an interface VPC endpoint. On the other side, the API reaches a Network or Application Load Balancer in private subnets through a VPC link.</desc>
