---
title: "Sidecar and Sidecarless Data Planes"
kind: deployment
system: distributed-patterns
summary: "A proxy in every pod, or one per node plus shared layer 7 proxies."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="pdm-title pdm-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pdm-title">Sidecar data plane compared with a sidecarless per-node data plane</title>
<desc id="pdm-desc">Two panels. In the sidecar model, each pod on a node holds a service and its own proxy, one proxy per instance handling layer 4 and layer 7 for that instance. In the sidecarless model, pods hold only their services, and a node proxy shared by the pods on that node handles layer 4 work such as mutual TLS and identity. Only where layer 7 policy applies does traffic also pass through a shared layer 7 proxy per service or namespace, outside the node.</desc>
