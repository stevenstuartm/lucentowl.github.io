<title id="rl2-title">Ridgeline Mutual's policyholder portal containers as agreed</title>
<desc id="rl2-desc">The same layout as the Align sketch, after Agree. The undecided portal is now three containers: a React single-page Web App for pages and the sign-in flow, an ASP.NET Core Portal API that aggregates the CRM and documents, caches profile reads and loads documents after the page renders, and an Azure SQL Portal DB for preferences and the audit trail. Each open question is closed. Sign-in uses a separate customer identity service on Entra External ID over OIDC, recorded in ADR-001, kept apart from agent single sign-on. The CRM is read live over REST behind a 5-minute cache. Policy documents come from the on-premises Policy Admin System's document API, proved by a proof of concept. Billing remains out of scope.</desc>
