<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" role="img" aria-labelledby="acl-title acl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="acl-title">The caches a GET request passes on its way to an ASP.NET Core API's data</title>
<desc id="acl-desc">A GET request passes four points where an earlier answer can be reused. The client's own cache and a shared cache such as a CDN or proxy sit outside the app; both obey the Cache-Control and Vary headers the app sends and use its ETag to revalidate, a shared cache never stores a private response, and a fresh hit there never reaches the server. Inside the app, the output cache middleware sits in front of the endpoint; its policies are set in code, the client's Cache-Control request header can't override them, and a hit skips the endpoint entirely. Inside the endpoint, a data cache such as HybridCache holds objects rather than responses, and a hit there still runs the endpoint but skips the database.</desc>
