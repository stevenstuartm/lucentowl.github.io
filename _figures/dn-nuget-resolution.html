<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="ngr-title ngr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ngr-title">NuGet's direct-dependency-wins and cousin-dependency rules</title>
<desc id="ngr-desc">Left, direct dependency wins: the app references Package A and Package B 2.0.0 or higher directly, and Package A needs Package B 1.0.0 or higher. Both requests sit in the app's subgraph, so the app's direct reference wins and B resolves to 2.0.0, ignoring the 1.0.0 request. Right, cousin dependencies: the app references Package A and Package C, which need Package B 1.0.0 or higher and 2.0.0 or higher respectively. Neither is a direct reference, so NuGet picks the lowest version satisfying both, which is 2.0.0.</desc>
