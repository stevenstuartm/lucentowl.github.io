<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="ndr-title ndr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ndr-title">DNS resolution of api.example.com on a cold cache</title>
<desc id="ndr-desc">The application asks the operating system's stub resolver, which asks one recursive resolver. The recursive resolver asks a root server, which refers it to the com servers. It asks a com TLD server, which refers it to the example.com servers. It asks the example.com authoritative server, which answers with an A record and its TTL. The answer returns through the recursive resolver and stub resolver to the application. The recursive resolver caches answers, and the stub resolver may too, and a recursive resolver with a warm cache answers without asking the other servers.</desc>
