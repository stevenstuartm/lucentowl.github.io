<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="mld-title mld-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mld-title">A decision tree that predicts house prices</title>
<desc id="mld-desc">The root asks whether floor area is under 120 square meters, splitting 200 training houses into 96 and 104. The smaller houses are split by whether they were built over 30 years ago, giving leaves that predict 165 thousand dollars for the older ones and 205 thousand for the newer ones. The larger houses are split by whether they have four or more bedrooms, giving leaves that predict 330 thousand and 265 thousand. Each leaf predicts the average price of the training houses that ended there, and a new house is sorted down the tree to the leaf it lands in.</desc>
