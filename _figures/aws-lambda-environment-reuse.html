<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="awsj-title awsj-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsj-title">How Lambda serves three requests with two execution environments</title>
<desc id="awsj-desc">Request 1 arrives with no environment available, so Environment 1 runs Init and then the handler: a cold start. Request 2 arrives while Environment 1 is still busy, so Lambda creates Environment 2, which also starts cold. After each invocation the environment is frozen and kept. Request 3 arrives after Request 1 finished and runs on the frozen Environment 1 with no Init: a warm start. The chart below counts busy environments over time, which is the function's concurrency: one, then two while both requests overlap, then one, zero, and one again.</desc>
