---
title: "A Tree Rotation"
kind: structure
system: dsa
summary: "A right rotation at y lifts x without breaking search order."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="trr-title trr-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="trr-title">A right rotation and its inverse, a left rotation</title>
<desc id="trr-desc">Before: node y has left child x and right subtree C. Node x has left subtree A and right subtree B. A right rotation at y makes x the root of this part of the tree, with A as its left subtree and y as its right child. Subtree B moves across to become y's left subtree, and C stays y's right subtree. A left rotation at x reverses the change. In both trees an in-order walk reads A, x, B, y, C, so the binary search tree order is preserved. A moves up one level, C moves down one level, and B keeps its depth under a new parent.</desc>

</style>
