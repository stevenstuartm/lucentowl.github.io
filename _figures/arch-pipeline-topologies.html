<title id="apl-title">Branching, convergent, and parallel pipeline topologies</title>
<desc id="apl-desc">Three pipeline shapes. Branching: read, parse, and validate, then valid records go to enrich and store while invalid records go to an error file. Convergent: CRM, billing, and web signup exports all feed normalize, deduplicate, and a customer store. Parallel: read and split, then three instances of a costly transform share the load before store.</desc>
