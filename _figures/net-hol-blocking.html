---
title: "Head-of-Line Blocking by Version"
kind: flow
system: networking
summary: "What a slow response or a lost packet holds up in each HTTP version."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="nhb-title nhb-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="nhb-title">Head-of-line blocking in HTTP/1.1, HTTP/2, and HTTP/3</title>
<desc id="nhb-desc">Three rows showing data arriving on one connection over time. In HTTP/1.1, a slow response A occupies the connection and requests B and C queue behind it. In HTTP/2 over TCP, packets from streams 1, 2, and 3 interleave; when a packet for stream 2 is lost, every packet that arrives after it is held until the retransmission, whichever stream it belongs to. In HTTP/3 over QUIC, the same loss holds only the later stream 2 packet, and the packets for streams 1 and 3 are delivered.</desc>

.nhb-ok { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.nhb-hold { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1.5; stroke-dasharray: 4 3; }
.nhb-lost { fill: var(--color-card-bg, #FFFFFF); stroke: #B83232; stroke-width: 2; }
.nhb-x { stroke: #B83232; stroke-width: 2; }
.nhb-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.nhb-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.nhb-p { font-size: 12px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.nhb-ph { font-size: 12px; font-weight: 700; fill: var(--color-text-light, #4A5568); }
.nhb-note { font-size: 11px; font-weight: 600; fill: var(--color-primary, #1A5F8A); }
.nhb-axis { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1; }
</style>
