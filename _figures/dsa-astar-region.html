title: "Cells Explored by Dijkstra and A*"

system: dsa

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" role="img" aria-labelledby="ar-title ar-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="ar-title">The cells expanded by Dijkstra and by A* on the same grid</title>
<desc id="ar-desc">A 25 by 15 grid with a vertical wall in the middle column, from row 3 to row 11. The search runs from S on the left to G on the right, moving up, down, left, or right at cost 1. With an estimate of 0, which is Dijkstra's algorithm, the search expands 337 cells, spreading out in every direction from S, including away from the goal. With the Manhattan distance to G as the estimate, A* expands 151 cells, mostly in a band between S and the openings above and below the wall. Both find a path of 26 steps around the end of the wall.</desc>
