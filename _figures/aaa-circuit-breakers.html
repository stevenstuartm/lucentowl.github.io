<title id="aaa3-title">How a circuit breaker trips in Apply and the four responses</title>
<desc id="aaa3-desc">Every feature in Apply carries a time limit and a set of written assumptions, both set during Agree. Two breakers watch it. A temporal breaker trips when the time limit is reached, such as 3 days for a CRUD screen or 6 weeks for an integration. An assumption breaker trips when a documented assumption proves false, such as a vendor API turning out to have no bulk operations. Either one stops the work for reassessment with stakeholders rather than pushing through. There are four responses. Extend, when the work is close to done and stakeholders agree, and Reduce scope, cutting features to fit the limit, both return the work to Apply under the new agreement. Reshape returns the work to Agree. Drop stops investing in work that proved unviable.</desc>
