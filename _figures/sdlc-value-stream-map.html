<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="vsm-title vsm-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="vsm-title">A value stream map timeline with work and wait times drawn to scale</title>
<desc id="vsm-desc">A timeline drawn to scale for one item from idea to production. It waits 21 days in the backlog, then design takes 3 days of work, it waits 7 days in the dev queue, development takes 5 days, it waits 4 days for code review, testing takes 3 days, it waits 10 days in the deploy queue, and deployment takes 1 day. Lead time is 54 days, process time is 12 days, and efficiency is 22 percent.</desc>
