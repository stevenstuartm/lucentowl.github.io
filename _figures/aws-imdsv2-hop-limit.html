---
title: "IMDSv2 Tokens and the Hop Limit"
kind: flow
system: aws
summary: "Why containers need a metadata hop limit of 2 to receive an IMDSv2 token."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="awsh-title awsh-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsh-title">How the IMDSv2 token response reaches an application on the instance but not one in a container unless the hop limit is 2</title>
<desc id="awsh-desc">An application on the instance requests an IMDSv2 session token from the instance metadata service with a PUT request, and the token comes back one network hop away. An application in a container on the same instance sends the same request through the container network bridge, so the response has to travel two hops. The token response is sent with an IP time-to-live equal to the hop limit, so with a hop limit of 1 it expires at the bridge and never reaches the container. A hop limit of 2 lets it through.</desc>
