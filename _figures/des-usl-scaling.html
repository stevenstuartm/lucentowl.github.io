---
title: "Why Scaling Out Isn't Linear"
kind: chart
system: architecture-design
summary: "Contention caps throughput, and coherency costs can make it fall."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="dus-title dus-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dus-title">Throughput against instance count under the Universal Scalability Law</title>
<desc id="dus-desc">Three illustrative curves of throughput as instances are added. Linear scaling rises in proportion to instance count. With contention for a shared resource, throughput flattens toward a ceiling no matter how many instances are added. With coherency costs as well, throughput peaks and then falls as more instances are added. The curves are illustrative, not measured.</desc>
