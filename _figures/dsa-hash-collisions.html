---
title: "Two Ways to Resolve a Collision"
kind: structure
system: dsa
summary: "Chaining and linear probing placing two keys that share a slot."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="hc-title hc-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="hc-title">Separate chaining compared with linear probing</title>
<desc id="hc-desc">Four keys hash into an eight-slot table: cat to slot 2, dog to 5, emu to 2, and fox to 6, so cat and emu collide. With separate chaining, slot 2 holds cat and a chain that links on to emu, and every other key sits in its own slot. With open addressing and linear probing, every key sits in the table itself: slot 2 is already taken by cat, so emu probes the next slot and lands in slot 3.</desc>
