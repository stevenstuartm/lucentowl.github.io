<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="lgf-title lgf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="lgf-title">How an ILogger entry reaches its providers</title>
<desc id="lgf-desc">OrderService depends on ILogger of OrderService, whose category is the full type name MyApp.Orders.OrderService. Each entry goes to the logger factory, where filter rules pick a minimum level by provider and category, preferring a provider-specific rule. The entry then fans out to every provider whose rule lets it through: the console provider writes to stdout, the debug provider to the debugger output, the EventSource provider to EventPipe, and other providers such as Serilog or OpenTelemetry to their own destinations.</desc>
