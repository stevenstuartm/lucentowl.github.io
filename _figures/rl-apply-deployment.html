<title id="rl3-title">Ridgeline Mutual's policyholder portal deployment</title>
<desc id="rl3-desc">The same layout again, now as deployment nodes. The Web App is served from Static Web Apps at the global edge. The Portal API runs on App Service as 3 instances across 2 availability zones, deployed by pipeline with a rehearsed rollback. The Portal DB is a zone-redundant Azure SQL Database reached over a private endpoint. Customer accounts live in Entra External ID, reached with OIDC over HTTPS. The CRM runs in the vendor's cloud and is reached over HTTPS on the public internet. The Policy Admin System runs in the head-office data center, reached over a site-to-site VPN. Billing remains out of scope.</desc>
