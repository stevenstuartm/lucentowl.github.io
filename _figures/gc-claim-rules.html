<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="gc4b-title gc4b-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc4b-title">The hook claim tiers and the shared routing predicate</title>
<desc id="gc4b-desc">Two panels. The gc hook claims the first match across three tiers: work in progress and assigned to this session, which is how a restarted agent resumes; ready work assigned to it; then ready, unassigned work routed to its pool, highest priority first and oldest within a priority. A session that finds nothing exits. The second panel shows that scale_check and the third hook tier must read one predicate, because when they drifted apart sessions spawned, found nothing, exited, and respawned in a storm.</desc>
