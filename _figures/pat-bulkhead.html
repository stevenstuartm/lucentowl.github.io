---
title: "Bulkheads"
kind: structure
system: distributed-patterns
summary: "A hung dependency fills one shared pool, or only its own partition."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="pbh-title pbh-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pbh-title">A shared connection pool compared with bulkheaded pools</title>
<desc id="pbh-desc">Two panels. Without bulkheads, checkout, search, and reports requests all draw from one shared pool of 70 slots. When the reporting database hangs, its calls hold all 70 slots and checkout and search stall too. With bulkheads, checkout has a pool of 40 slots to the payment API, search has 20 to the search index, and reports have 10 to the reporting database. When the reporting database hangs, its 10 slots fill and further report calls are rejected, while checkout and search keep their own slots.</desc>
