---
title: "A Queue in a Circular Buffer"
kind: structure
system: dsa
summary: "Head and tail indices wrapping around a fixed array."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="cb-title cb-desc" style="width:100%; min-width:600px; height:auto; display:block;">
<title id="cb-title">Queue stored in a circular buffer of eight slots</title>
<desc id="cb-desc">An array of eight slots, indexed 0 to 7. Slots 5, 6, and 7 hold A, B, and C, and slots 0 and 1 hold D and E. Slots 2, 3, and 4 are empty. The head index is 5, where the next dequeue reads, and the tail index is 2, where the next enqueue writes. An arrow from the end of the array back to the start shows that the index after 7 is 0, computed as index plus one modulo the capacity. The queue's order from front to back is A, B, C, D, E.</desc>

.cb-empty { fill: var(--color-bg, #F7F9FC); stroke: var(--color-border, #DDE3EB); stroke-width: 1.5; }
.cb-v { font-size: 17px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.cb-i { font-size: 12px; fill: var(--color-text-light, #4A5568); }
.cb-el { font-size: 12px; fill: var(--color-text, #2C3E50); }
.cb-s { font-size: 11px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.cb-lbl { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.cb-lbl2 { font-size: 12.5px; font-weight: 700; fill: var(--color-accent, #A5486E); }
.cb-wl { font-size: 12px; font-weight: 600; fill: var(--color-secondary, #2D5A85); }
.cb-ptr { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.cb-ptr2 { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 2; }
.cb-wrap { fill: none; stroke: var(--color-secondary, #2D5A85); stroke-width: 1.75; stroke-dasharray: 6 4; }
</style>

<marker id="cb-b" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-accent, #A5486E)"/></marker>
<marker id="cb-w" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-secondary, #2D5A85)"/></marker>
</defs>

<text class="cb-i" x="120.0" y="186" text-anchor="middle">0</text>

<text class="cb-i" x="360.0" y="186" text-anchor="middle">3</text>

<rect class="cb-full" x="560" y="110" width="80" height="54"/>
<text class="cb-v" x="600.0" y="143" text-anchor="middle">B</text>
<text class="cb-i" x="600.0" y="186" text-anchor="middle">6</text>
<rect class="cb-full" x="640" y="110" width="80" height="54"/>
<text class="cb-v" x="680.0" y="143" text-anchor="middle">C</text>

<text class="cb-el" x="70" y="186" text-anchor="end">index</text>

<text class="cb-wl" x="400.0" y="250" text-anchor="middle">after index 7, the next index is 0: (index + 1) % capacity</text>
<text class="cb-el" x="80" y="290">Queue order, front to back: A, B, C, D, E. Count = 5, capacity = 8.</text>
