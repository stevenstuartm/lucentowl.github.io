<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="gc7-title gc7-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc7-title">Who executes a formula under the v1 and v2 contracts</title>
<desc id="gc7-desc">Two panels. Under v1, a formula compiles to a molecule whose steps are children of one root, and the single agent it was slung to works every step inside its own session; conditions and loops resolve at cook time and nothing drives the run afterward. Under v2, a formula compiles to a flat graph: plain step beads routed to different pools, and control beads for drain, check, and workflow-finalize that the control-dispatcher executes. The drain fans units out to a worker pool, the check re-runs review until its script passes, and the workflow root goes ready only when finalize closes.</desc>
