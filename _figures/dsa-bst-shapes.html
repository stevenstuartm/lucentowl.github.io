<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" role="img" aria-labelledby="bs-title bs-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="bs-title">A balanced and a skewed binary search tree holding the same keys</title>
<desc id="bs-desc">Two binary search trees holding the keys 1 to 7. Inserted in the order 4, 2, 6, 1, 3, 5, 7, the tree is balanced: 4 at the root, 2 and 6 below it, and 1, 3, 5, 7 as leaves, with height 2. Searching for 5 visits 4, 6, then 5. Inserted in sorted order 1 through 7, every key becomes the right child of the one before, forming a chain of height 6, and searching for 5 visits 1, 2, 3, 4, and 5.</desc>
