---
title: "One Service Scope per Window"
kind: structure
system: winui
summary: "Shared singletons in the root, and each window's services in its own scope."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="wds-title wds-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wds-title">A root service provider shared by two windows, each with its own service scope</title>
<desc id="wds-desc">At the top, the root provider, App.Current.Services, holds singletons such as IProductService, shared by every window. Below it are two document windows. Each window holds its own scope, created when the window opens, containing its NavigationService, DocumentSession, and view models. Each scope's services receive the shared singletons from the root. In each window, a page shown in the window's ContentFrame finds its window's scope by calling WindowScopes.For with its Frame. Closing a window disposes its scope and everything the scope created, while the root and its singletons remain.</desc>
