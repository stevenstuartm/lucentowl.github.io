<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="iml-title iml-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="iml-title">The edge ML loop between device and cloud</title>
<desc id="iml-desc">On the edge device, a fixed-length sensor window feeds an optimized edge model that scores every window. A confident score acts locally by alerting or actuating. An uncertain score forwards the reading to a larger, slower, more accurate cloud model. Alerts and uncertain samples are uploaded selectively to a labeled dataset in the cloud, which feeds training, evaluation, and quantization. The result is stored as a versioned artifact in a model registry and delivered back to the edge model, reaching canary devices first.</desc>
