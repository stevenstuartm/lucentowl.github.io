<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="awsv-title awsv-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsv-title">A two-Availability-Zone VPC with public, private, and isolated subnets and the route tables that define them</title>
<desc id="awsv-desc">A VPC with CIDR 10.0.0.0/16 spans two Availability Zones. Each zone has a public subnet holding a load balancer node and a NAT gateway, a private app subnet, and an isolated data subnet. An internet gateway is attached to the VPC. The public route table sends 0.0.0.0/0 to the internet gateway. Each app subnet's route table sends 0.0.0.0/0 to the NAT gateway in its own zone, and the NAT gateway reaches the internet through the internet gateway. The data route table has only the local route, so data subnets have no path out of the VPC.</desc>
