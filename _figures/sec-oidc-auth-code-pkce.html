<title id="sop-title">OpenID Connect authorization code flow with PKCE</title>
<desc id="sop-desc">Four participants: the user's browser, the client application, the identity provider, and an API. The client generates a random code verifier and redirects the browser to the identity provider with a hash of it, the code challenge. The user authenticates at the identity provider, which redirects the browser back to the client with a short-lived one-time authorization code. The client then calls the identity provider's token endpoint directly, sending the code and the original code verifier. The identity provider checks that the verifier hashes to the challenge before returning an ID token, an access token, and a refresh token. The client calls the API with the access token, and the API validates its signature, issuer, audience, and expiry. Tokens are issued only on the direct back channel, never through the browser, and a stolen code cannot be redeemed without the verifier.</desc>
