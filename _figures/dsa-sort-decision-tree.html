---
title: "A Comparison Sort as a Decision Tree"
kind: structure
system: dsa
summary: "The comparisons a sort makes on three elements, drawn as a tree with one leaf per possible order."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 442" role="img" aria-labelledby="dtr-title dtr-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="dtr-title">Decision tree of an insertion-style sort on three elements</title>
<desc id="dtr-desc">A binary tree of comparisons for sorting a, b, and c. The root asks whether a is at most b. If yes, the next question is whether b is at most c: yes ends at the order a, b, c; no asks whether a is at most c, ending at a, c, b for yes and c, a, b for no. If a is more than b, the next question is whether a is at most c: yes ends at b, a, c; no asks whether b is at most c, ending at b, c, a for yes and c, b, a for no. The six leaves are the six possible orders of three elements. A binary tree of height 2 has at most 4 leaves, so at least one input needs 3 comparisons; two inputs finish after 2 and four take 3.</desc>

<text class="dtr-s" x="40" y="404">Each box asks one comparison, and each shaded leaf is the sorted order it concludes. The 3! = 6 possible input orders need 6 leaves.</text>
<text class="dtr-s" x="40" y="422">A tree of height 2 holds at most 4 leaves, so some input must take 3 comparisons. Here, two orders finish after 2 and four take 3.</text>
