---
title: "One Instant, Three Wall Clocks"
kind: structure
system: dotnet
summary: "A single UTC instant read as three different local times."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="iwc-title iwc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="iwc-title">One instant displayed as three zones' wall-clock times</title>
<desc id="iwc-desc">The instant 2026-03-01 12:00:00 UTC is one point on the global timeline. In New York the wall clock reads 2026-03-01 07:00 at offset minus five hours, in London 12:00 at offset zero, and in Tokyo 21:00 at offset plus nine hours. Converting changes the display, never the moment.</desc>
