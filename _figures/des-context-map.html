<title id="dcm-title">Context map around a fulfillment context</title>
<desc id="dcm-desc">Three upstream contexts feed the fulfillment context, which is downstream of each. The sales context is an open host service, and fulfillment consumes its product and order API. The legacy warehouse is a big ball of mud, and fulfillment protects its model with an anticorruption layer toward it. The payment provider is external, and fulfillment is a conformist toward it, adopting its model as it is.</desc>
