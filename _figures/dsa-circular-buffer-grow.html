---
title: "Growing a Wrapped Circular Buffer"
kind: flow
system: dsa
summary: "Why growing a full, wrapped queue copies its elements front first instead of slot by slot."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" role="img" aria-labelledby="cg-title cg-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="cg-title">A full, wrapped circular buffer of capacity 4 growing to capacity 8</title>
<desc id="cg-desc">Top: a full circular buffer of four slots holding C, D, A, B at indexes 0 to 3. The head and the tail are both at index 2. The count of 4 says the buffer is full, because an empty buffer also has head equal to tail. Bottom: after growing to eight slots, the elements are copied in queue order, front first, so A, B, C, D occupy slots 0 to 3, the head is 0, and the tail is 4. Arrows run from each old slot to its new slot: A from 2 to 0, B from 3 to 1, C from 0 to 2, D from 1 to 3. Copying the slots in place would have kept C, D, A, B, the wrong queue order.</desc>

</style>

<marker id="cg-b" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-accent, #A5486E)"/></marker>
<marker id="cg-c" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-secondary, #2D5A85)"/></marker>
</defs>
<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text class="cg-hd" x="40" y="24">FULL AND WRAPPED, CAPACITY 4</text>
<rect class="cg-full" x="250" y="96" width="80" height="54"/>
<text class="cg-i" x="257" y="110">0</text>
<text class="cg-v" x="290.0" y="130" text-anchor="middle">C</text>
<rect class="cg-full" x="330" y="96" width="80" height="54"/>
<text class="cg-i" x="337" y="110">1</text>
<text class="cg-v" x="370.0" y="130" text-anchor="middle">D</text>
<rect class="cg-full" x="410" y="96" width="80" height="54"/>
<text class="cg-i" x="417" y="110">2</text>
<text class="cg-v" x="450.0" y="130" text-anchor="middle">A</text>
<rect class="cg-full" x="490" y="96" width="80" height="54"/>
<text class="cg-i" x="497" y="110">3</text>
<text class="cg-v" x="530.0" y="130" text-anchor="middle">B</text>
<path class="cg-ptr" d="M 450.0,66 V 92" marker-end="url(#cg-a)"/>
<text class="cg-lbl" x="450.0" y="58" text-anchor="middle">head = 2, tail = 2</text>
<text class="cg-s" x="586" y="118">Count = 4, so head == tail means full.</text>
<text class="cg-s" x="586" y="136">An empty queue also has head == tail.</text>
<path class="cg-copy" d="M 290.0,154 L 290.0,256" marker-end="url(#cg-c)"/>
<path class="cg-copy" d="M 370.0,154 L 370.0,256" marker-end="url(#cg-c)"/>

<path class="cg-copy" d="M 530.0,154 L 210.0,256" marker-end="url(#cg-c)"/>
<text class="cg-cl" x="450" y="198">Grow copies in queue order, front first:</text>
<text class="cg-cl" x="450" y="216">A, B, C, D land in slots 0 to 3.</text>
<text class="cg-hd" x="420" y="252">AFTER GROW, CAPACITY 8</text>
<rect class="cg-full" x="90" y="262" width="80" height="54"/>
<text class="cg-i" x="97" y="276">0</text>
<text class="cg-v" x="130.0" y="296" text-anchor="middle">A</text>
<rect class="cg-full" x="170" y="262" width="80" height="54"/>
<text class="cg-i" x="177" y="276">1</text>
<text class="cg-v" x="210.0" y="296" text-anchor="middle">B</text>
<rect class="cg-full" x="250" y="262" width="80" height="54"/>
<text class="cg-i" x="257" y="276">2</text>
<text class="cg-v" x="290.0" y="296" text-anchor="middle">C</text>
<rect class="cg-full" x="330" y="262" width="80" height="54"/>
<text class="cg-i" x="337" y="276">3</text>
<text class="cg-v" x="370.0" y="296" text-anchor="middle">D</text>
<rect class="cg-empty" x="410" y="262" width="80" height="54"/>
<text class="cg-i" x="417" y="276">4</text>
<rect class="cg-empty" x="490" y="262" width="80" height="54"/>
<text class="cg-i" x="497" y="276">5</text>
<rect class="cg-empty" x="570" y="262" width="80" height="54"/>
<text class="cg-i" x="577" y="276">6</text>
<rect class="cg-empty" x="650" y="262" width="80" height="54"/>
<text class="cg-i" x="657" y="276">7</text>
<path class="cg-ptr" d="M 130.0,356 V 322" marker-end="url(#cg-a)"/>
<text class="cg-lbl" x="130.0" y="374" text-anchor="middle">head = 0</text>
<path class="cg-ptr2" d="M 450.0,356 V 322" marker-end="url(#cg-b)"/>
<text class="cg-lbl2" x="450.0" y="374" text-anchor="middle">tail = 4</text>
<text class="cg-el" x="40" y="412">Copying the slots as they sit would give C, D, A, B, and the queue would come out in the wrong order.</text>
</g>
