---
title: "A Pipeline That Deploys to Other Accounts"
kind: deployment
system: aws
summary: "The pipeline stays in a tooling account and assumes a role in each target account to deploy there."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="awscpx-title awscpx-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscpx-title">Cross-account deployment from a tooling account</title>
<desc id="awscpx-desc">A tooling account holds the pipeline, its CodeBuild projects, and the artifact bucket, which is encrypted with a customer managed KMS key. The pipeline stores artifacts in the bucket and runs builds in CodeBuild. For each target account, staging and production, the pipeline's service role assumes a cross-account role in that account. That role, which the target account trusts only for the pipeline's service role, reads the artifacts from the tooling account's bucket, with permission to use the key, and starts a CloudFormation deployment. CloudFormation creates the resources with its own execution role in the target account. The bucket policy and the key policy must allow each cross-account role to read the artifacts, and an AWS managed key can't be shared, so a cross-account pipeline needs a customer managed key.</desc>
