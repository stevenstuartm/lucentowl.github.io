---
title: "An Orchestrated Saga"
kind: dynamic
system: distributed-patterns
summary: "The orchestrator holds saga state and calls the compensations itself."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="pso-title pso-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pso-title">Orchestrated saga with compensation</title>
<desc id="pso-desc">A saga orchestrator holds the saga state for order 123. It calls the order service to create the order, which succeeds, then the inventory service to reserve stock, which succeeds, then the payment service to charge, which fails. It then calls the inventory service to release the stock, compensating step 2, and the order service to cancel, compensating step 1. The shipping service is never called.</desc>
