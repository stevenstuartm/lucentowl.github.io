---
title: "Dependency Inversion Flips the Arrow"
kind: structure
system: oop
summary: "Source dependencies between a business module and infrastructure, before and after inversion."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="dip-title dip-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dip-title">Dependency inversion moves the interface into the business module</title>
<desc id="dip-desc">Two panels, each with a business module above an infrastructure module. Before: OrderService in the business module uses SmtpEmailSender in the infrastructure module directly, so the source dependency points down from business logic to infrastructure. After: the business module holds both OrderService and the INotificationSender interface, and OrderService uses the interface. In the infrastructure module, EmailNotificationSender and SmsNotificationSender implement INotificationSender, so the only dependencies crossing the module boundary point up, from infrastructure to the business module.</desc>
