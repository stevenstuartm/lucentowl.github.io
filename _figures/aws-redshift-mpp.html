<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="awsrsm-title awsrsm-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsrsm-title">Redshift massively parallel processing architecture</title>
<desc id="awsrsm-desc">A client sends SQL to the leader node and receives results from it. The leader node plans the query and sends steps to two compute nodes. Each compute node has two slices. The orders and order_lines tables are both distributed by order_id, so rows with the same order_id sit on the same slice and each slice joins its own rows without moving data. A table distributed on a different key would need its rows redistributed between nodes over the network before the join. Each compute node caches hot data on local SSD, and all table data is stored durably in Redshift Managed Storage, backed by S3, independent of the number of nodes. The leader node combines the slices' results and returns them to the client.</desc>
