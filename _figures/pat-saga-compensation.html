---
title: "A Saga Succeeding and Compensating"
kind: flow
system: distributed-patterns
summary: "Each step commits locally; a failure runs compensations in reverse."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="psc-title psc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="psc-title">Saga happy path and failure path with compensation</title>
<desc id="psc-desc">On the happy path, the saga creates the order as pending, reserves inventory, charges payment, and completes the order. On the failure path, the payment charge is declined at step 3, so the saga runs the compensations for the steps that already committed in reverse order: first releasing inventory, the compensation for step 2, then cancelling the order, the compensation for step 1.</desc>
<style>
.psc-band { fill: var(--color-bg, #F7F9FC); stroke: var(--color-border, #DDE3EB); stroke-width: 1; }
.psc-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.psc-mute { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; }
.psc-bad { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-accent, #A5486E); stroke-width: 1.75; stroke-dasharray: 6 4; }
.psc-good { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-green, #3C8D53); stroke-width: 1.75; }
.psc-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.psc-n-mute { font-size: 12.5px; font-weight: 700; fill: var(--color-text-light, #4A5568); }
.psc-n-bad { font-size: 12.5px; font-weight: 700; fill: var(--color-accent, #A5486E); }
.psc-n-good { font-size: 12.5px; font-weight: 700; fill: var(--color-green, #3C8D53); }
.psc-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.psc-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.psc-labc { font-size: 11.5px; font-weight: 600; fill: var(--color-purple, #6B3FA0); }
.psc-labr { font-size: 11.5px; font-weight: 600; fill: var(--color-accent, #A5486E); }
.psc-flow { fill: none; stroke: var(--color-primary, #1A5F8A); stroke-width: 2; }
.psc-ctl { fill: none; stroke: var(--color-purple, #6B3FA0); stroke-width: 1.75; stroke-dasharray: 6 4; }
</style>

<defs>
<marker id="psc-a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-primary, #1A5F8A)"/></marker>
<marker id="psc-c" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-purple, #6B3FA0)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="psc-band" x="20" y="20" width="860" height="130" rx="8"/>
<text class="psc-hd" x="34" y="40">HAPPY PATH: EVERY STEP COMMITS</text>
<rect class="psc-box" x="40" y="60" width="180" height="50" rx="6"/>
<text class="psc-n" x="130.0" y="80.5" text-anchor="middle">Create order</text>
<text class="psc-k" x="130.0" y="98.5" text-anchor="middle">T1, pending</text>
<rect class="psc-box" x="252" y="60" width="180" height="50" rx="6"/>
<text class="psc-n" x="342.0" y="80.5" text-anchor="middle">Reserve inventory</text>
<text class="psc-k" x="342.0" y="98.5" text-anchor="middle">T2</text>
<path class="psc-flow" d="M 220,85 L 246,85" marker-end="url(#psc-a)"/>
<rect class="psc-box" x="464" y="60" width="180" height="50" rx="6"/>
<text class="psc-n" x="554.0" y="80.5" text-anchor="middle">Charge payment</text>
<text class="psc-k" x="554.0" y="98.5" text-anchor="middle">T3</text>
<path class="psc-flow" d="M 432,85 L 458,85" marker-end="url(#psc-a)"/>
<rect class="psc-good" x="676" y="60" width="180" height="50" rx="6"/>
<text class="psc-n-good" x="766.0" y="80.5" text-anchor="middle">Complete order</text>
<text class="psc-k" x="766.0" y="98.5" text-anchor="middle">confirmed</text>
<path class="psc-flow" d="M 644,85 L 670,85" marker-end="url(#psc-a)"/>

<rect class="psc-box" x="40" y="210" width="180" height="50" rx="6"/>
<text class="psc-n" x="130.0" y="230.5" text-anchor="middle">Create order</text>
<text class="psc-k" x="130.0" y="248.5" text-anchor="middle">T1</text>
<rect class="psc-box" x="252" y="210" width="180" height="50" rx="6"/>
<text class="psc-n" x="342.0" y="230.5" text-anchor="middle">Reserve inventory</text>
<text class="psc-k" x="342.0" y="248.5" text-anchor="middle">T2</text>
<path class="psc-flow" d="M 220,235 L 246,235" marker-end="url(#psc-a)"/>
<rect class="psc-bad" x="464" y="210" width="180" height="50" rx="6"/>
<text class="psc-n-bad" x="554.0" y="230.5" text-anchor="middle">Charge payment</text>
<text class="psc-k" x="554.0" y="248.5" text-anchor="middle">T3</text>
<path class="psc-flow" d="M 432,235 L 458,235" marker-end="url(#psc-a)"/>
<text class="psc-labr" x="682" y="240">✗ payment declined</text>
<rect class="psc-mute" x="252" y="320" width="180" height="50" rx="6"/>
<text class="psc-n-mute" x="342.0" y="340.5" text-anchor="middle">Release inventory</text>
<text class="psc-k" x="342.0" y="358.5" text-anchor="middle">C2, undoes T2</text>
<rect class="psc-mute" x="40" y="320" width="180" height="50" rx="6"/>
<text class="psc-n-mute" x="130.0" y="340.5" text-anchor="middle">Cancel order</text>
<text class="psc-k" x="130.0" y="358.5" text-anchor="middle">C1, undoes T1</text>
<path class="psc-ctl" d="M 554,260 C 554,345 500,345 438,345" marker-end="url(#psc-c)"/>
<text class="psc-labc" x="500" y="312">first</text>
<path class="psc-ctl" d="M 252,345 L 226,345" marker-end="url(#psc-c)"/>
<text class="psc-labc" x="226" y="312">then</text>
</g>
