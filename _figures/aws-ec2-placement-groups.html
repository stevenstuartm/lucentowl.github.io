<title id="awsg2-title">How cluster, partition, and spread placement groups arrange instances on racks in one Availability Zone</title>
<desc id="awsg2-desc">A cluster placement group places instances close together in one Availability Zone, on a high-bandwidth network segment, which lowers latency but leaves them more exposed to a shared hardware failure. A partition placement group divides instances into up to seven partitions per zone, and no two partitions share a rack, so a rack failure affects only one partition. A spread placement group puts each instance on its own rack, with at most seven running instances per zone.</desc>
