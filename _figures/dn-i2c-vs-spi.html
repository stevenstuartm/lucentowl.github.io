---
title: "I2C Bus Versus SPI Chip Selects"
kind: structure
system: dotnet
summary: "One addressed two-wire bus, against shared SPI wires plus a select line per device."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="i2s-title i2s-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="i2s-title">How devices attach to an I2C bus and to an SPI bus</title>
<desc id="i2s-desc">I2C: the Pi's two bus wires, SDA and SCL, are shared by every device, and each device has its own address, such as 0x76, 0x68, and 0x3C, which the controller sends to pick it. Adding a device costs only a free address. SPI: three wires, SCLK, MOSI, and MISO, are shared by every device, and each device also has its own chip-select line from the Pi, CS0 for the ADC and CS1 for the LCD. The controller picks a device by pulling its CS line low, so each added device costs another GPIO pin.</desc>
