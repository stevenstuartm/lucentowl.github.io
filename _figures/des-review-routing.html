<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" role="img" aria-labelledby="drr-title drr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="drr-title">Routing a proposed architecture change to a level of review</title>
<desc id="drr-desc">A proposed architecture change meets a first question: does it use approved patterns and technology, with consequences that stay within one team? If yes, it goes to self-service, with automated checks and the team recording the decision. If no, a second question asks whether it crosses team or system boundaries, introduces new technology, or affects security, compliance, or shared data. If no, it goes to peer review by another team or a community of practice. If yes, it goes to board-level review, by a review board or through broad advice from affected teams and experts.</desc>
