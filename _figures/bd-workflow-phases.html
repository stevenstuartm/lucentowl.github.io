<title id="bd4-title">The Beads workflow phases from formula to molecule or wisp</title>
<desc id="bd4-desc">A formula file is cooked into a proto, a template epic that is the solid phase. Pouring the proto produces a molecule, persistent beads in the liquid phase that sync like any bead. Wisping it produces a wisp, ephemeral beads in the vapor phase that are not federated and are purged after closing. A wisp that found something worth keeping is squashed into a permanent digest; otherwise it is burned. Below, a molecule is shown as what it is underneath: an epic whose child steps are wired by the formula's needs, run in parallel unless a dependency or a gate holds them back.</desc>
