---
title: "Mesh Control and Data Planes"
kind: container
system: distributed-patterns
summary: "The control plane configures proxies, and only the proxies carry requests."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="pmp-title pmp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pmp-title">Service mesh control plane and data plane</title>
<desc id="pmp-desc">The control plane, responsible for configuration, identity, and certificates, takes in operator policy and watches services and endpoints in the platform. It pushes configuration and certificates to the proxies. In the data plane, service A talks to its proxy, which connects over mutual TLS to service B's proxy, which talks to service B. Request traffic flows only through the data plane.</desc>
