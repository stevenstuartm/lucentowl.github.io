title: "Envelope Encryption with a KMS Key"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="awskms-title awskms-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awskms-title">How envelope encryption uses a KMS key</title>
<desc id="awskms-desc">To encrypt, your application, or an AWS service such as S3 acting for you, calls GenerateDataKey on AWS KMS, naming a KMS key and an encryption context. KMS returns a new data key twice: in plaintext, and encrypted under the KMS key. The application encrypts the data locally with the plaintext data key, discards that key, and stores the encrypted data together with the encrypted data key. To read the data later, the application loads the encrypted data key, sends it to KMS in a Decrypt call with the same encryption context, gets the plaintext data key back, and decrypts the data locally. The KMS key itself never leaves KMS. Every GenerateDataKey and Decrypt call counts against the account's KMS request quota and is logged in CloudTrail.</desc>
