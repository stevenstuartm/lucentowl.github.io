<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="omw-title omw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="omw-title">Error rate over a 1-hour and a 5-minute window during a 30-minute incident</title>
<desc id="omw-desc">A chart over 100 minutes. The error rate is 5 percent from minute 10 to minute 40, when a fix is deployed, and zero otherwise. The threshold for a burn rate of 14.4 on a 99.9 percent SLO is 1.44 percent errors. The 5-minute window's error rate rises to 5 percent by minute 15 and falls to zero by minute 45, staying above the threshold until about minute 44. The 1-hour window's error rate climbs to 2.5 percent by minute 40, holds until minute 70, and falls to zero at minute 100, crossing the threshold at about minute 27 and staying above it until about minute 83. Below the chart, an alert on the 1-hour window alone fires from minute 27 to minute 83, 43 minutes past the fix. An alert requiring both windows fires from minute 27 to minute 44, about 4 minutes past the fix.</desc>
