---
title: "Deleting a Node with Two Children"
kind: flow
system: dsa
summary: "How a binary search tree replaces a deleted key with its in-order successor and keeps its ordering rule."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="bsd-title bsd-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="bsd-title">Deleting 50 from a binary search tree by way of its in-order successor, 60</title>
<desc id="bsd-desc">Before: a binary search tree with 50 at the root, 30 and 70 below it, 20 and 40 under 30, 60 and 80 under 70, and 65 as 60's right child. Deleting 50, which has two children, starts by finding its in-order successor: one step right to 70, then left as far as possible, to 60. After: 60 has been copied into the root, and the old 60 node has been removed. That removal is the one-child case, because 60 has no left child, so its right child 65 moves up to become 70's left child. The tree is 60 at the root, 30 with 20 and 40 on the left, and 70 with 65 and 80 on the right, and the ordering rule still holds.</desc>

</style>

<text class="bsd-s" x="40" y="400">60 is the smallest key in 50's right subtree, so it is larger than everything on the left and smaller than the rest on the right.</text>
<text class="bsd-s" x="40" y="418">Removing 60 from its old spot is the one-child case: it has no left child, and its right child, 65, takes its place.</text>
