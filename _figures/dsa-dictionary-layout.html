title: "Inside Dictionary<TKey,TValue>"
kind: structure

summary: "How a .NET dictionary keeps its chains as integer links inside two arrays instead of as linked nodes."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 376" role="img" aria-labelledby="dl-title dl-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="dl-title">A dictionary's buckets array pointing into its entries array</title>
<desc id="dl-desc">A dictionary with five buckets and an entries array of five slots. The keys cat, dog, emu, and fox were added in that order and sit in entries 0 to 3; entry 4 is not used yet. Cat and emu both reduce to bucket 2, dog to bucket 0, and fox to bucket 4. Buckets 1 and 3 are empty. Bucket 0 points to entry 1, bucket 2 to entry 2, and bucket 4 to entry 3. Each new entry goes to the head of its chain, so emu's next field holds 0, linking to cat, whose next marks the end of the chain. Looking up cat reads bucket 2, checks emu, and follows the next link to cat. Enumerating the dictionary walks the entries array in index order, which matches insertion order until a removal frees a slot that a later add reuses.</desc>
