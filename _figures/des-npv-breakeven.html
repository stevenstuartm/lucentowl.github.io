<title id="dnb-title">Net present value against annual benefit for the example investment</title>
<desc id="dnb-desc">A straight line of NPV at 10 percent over five years against the annual benefit of a $100K investment. At $25K a year NPV is minus $5.2K, at $40K it is $51.6K, and at $55K it is $108.5K. The line crosses zero at the break-even benefit of about $26.4K a year.</desc>
