---
title: "Snapshots in an Event Store"
kind: structure
system: distributed-patterns
summary: "Replay starts from the latest snapshot, not from event one."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="pss-title pss-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pss-title">Reading state from the latest snapshot in an event store</title>
<desc id="pss-desc">An event log holds events 1 to 1000, a snapshot at 1000 with a balance of 5000 dollars, events 1001 to 2000, a snapshot at 2000 with a balance of 7500 dollars, and events 2001 onward. To read state at event 2347, load the snapshot at 2000 and replay only events 2001 to 2347.</desc>
<style>
.pss-box { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-primary, #1A5F8A); stroke-width: 1.5; }
.pss-sys { fill: var(--color-primary, #1A5F8A); stroke: var(--color-hover, #134C72); stroke-width: 1.5; }
.pss-mute { fill: var(--color-bg, #F7F9FC); stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; }
.pss-good { fill: var(--color-card-bg, #FFFFFF); stroke: var(--color-green, #3C8D53); stroke-width: 1.75; }
.pss-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }
.pss-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.pss-s-inv { font-size: 11.5px; fill: #FFFFFF; }
.pss-labg { font-size: 11.5px; font-weight: 600; fill: var(--color-green, #3C8D53); }
.pss-labm { font-size: 11.5px; font-weight: 600; fill: var(--color-text-light, #4A5568); }
.pss-grn { fill: none; stroke: var(--color-green, #3C8D53); stroke-width: 2; }
.pss-mut { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.5; stroke-dasharray: 2 3; }
</style>

<defs>
<marker id="pss-g" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto-start-reverse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--color-green, #3C8D53)"/></marker>
</defs>

<g font-family="'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect class="pss-mute" x="40" y="60" width="170" height="56" rx="6"/>
<text class="pss-s" x="125.0" y="92.5" text-anchor="middle">events 1–1000</text>
<rect class="pss-box" x="210" y="60" width="140" height="56" rx="6"/>
<text class="pss-s" x="280.0" y="84.0" text-anchor="middle">snapshot @ 1000</text>
<text class="pss-s" x="280.0" y="101.0" text-anchor="middle">$5000</text>
<rect class="pss-mute" x="350" y="60" width="180" height="56" rx="6"/>
<text class="pss-s" x="440.0" y="92.5" text-anchor="middle">events 1001–2000</text>
<rect class="pss-sys" x="530" y="60" width="140" height="56" rx="6"/>
<text class="pss-s-inv" x="600.0" y="84.0" text-anchor="middle">snapshot @ 2000</text>
<text class="pss-s-inv" x="600.0" y="101.0" text-anchor="middle">$7500</text>
<rect class="pss-good" x="670" y="60" width="190" height="56" rx="6"/>
<text class="pss-s" x="765.0" y="92.5" text-anchor="middle">events 2001–2347</text>
<path class="pss-grn" d="M 600,140 H 856" marker-end="url(#pss-g)"/>
<text class="pss-labg" x="856" y="162" text-anchor="end">load the snapshot, replay only what follows</text>
<path class="pss-mut" d="M 40,140 H 520"/>
<text class="pss-labm" x="40" y="162">skipped</text>
<text class="pss-n" x="40" y="40">To read state at event 2347:</text>
</g>
