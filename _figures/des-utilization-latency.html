---
title: "Latency Against Utilization"
kind: chart
system: architecture-design
summary: "Response time climbs steeply as a resource nears full use."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="dul-title dul-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dul-title">Average response time as a multiple of service time, by utilization</title>
<desc id="dul-desc">A curve from the simplest single-server queueing model, where average response time equals service time divided by one minus utilization. The curve is nearly flat at low utilization, reaches twice the service time at 50 percent, five times at 80 percent, and ten times at 90 percent, and climbs steeply beyond that toward full use.</desc>
