---
title: "A Variable-Size Sliding Window"
kind: flow
system: dsa
summary: "The windows the shortest-sum scan passes through, edge by edge."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 378" role="img" aria-labelledby="sw-title sw-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="sw-title">The windows a variable-size sliding window passes through while finding the shortest run with sum at least 7</title>
<desc id="sw-desc">The array 2, 3, 1, 2, 4, 3 at indexes 0 to 5, searched for the shortest run of elements whose sum reaches 7. Each row shows a window the inner loop checks while its sum is at least 7, just before the left edge moves right. Indexes 0 to 3 sum to 8, length 4. Indexes 1 to 4 sum to 10, length 4. Indexes 2 to 4 sum to 7, length 3. Indexes 3 to 5 sum to 9, length 3. Indexes 4 to 5 sum to 7, length 2, the shortest. Elements to the left of each window have already been dropped, and elements to the right have not been reached yet. Both edges only move right, so each element enters and leaves the window at most once. Index 5 never leaves.</desc>
