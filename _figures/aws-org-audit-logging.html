<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="awsorg-title awsorg-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsorg-title">Organization-wide CloudTrail and Config layout</title>
<desc id="awsorg-desc">The management account, or a delegated administrator, owns an organization trail, which applies to every account and Region in the organization, including accounts added later. In every account and Region, CloudTrail records API activity and an AWS Config recorder records resource configurations. CloudTrail delivers log files, and Config delivers configuration history and snapshots, to one S3 bucket in a dedicated log archive account, encrypted with a KMS key and protected from deletion. A Config aggregator in a security account, registered as a delegated administrator, collects configuration and compliance data from every account and Region. The organization trail covers new accounts automatically, but Config recorders must be deployed to new accounts through Control Tower, StackSets, or Systems Manager Quick Setup.</desc>
