---
title: "How xUnit Runs Tests in Parallel"
kind: flow
system: dotnet
summary: "One lane per test collection by default, against every test case in parallel."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="xpl-title xpl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="xpl-title">xUnit default collection parallelism compared with ParallelMode.All</title>
<desc id="xpl-desc">Default mode: each test class is its own collection and gets one lane. OrderTests runs A1, A2, A3 in sequence, CustomerTests runs B1, B2, and a named collection called Database merges two classes, whose tests C1, C2, and D1 share one lane. The lanes run side by side. With ParallelMode.All, set by an assembly attribute in xUnit v3 4.0, individual test cases run in parallel across the available threads, so tests from the same class can run at the same time.</desc>
