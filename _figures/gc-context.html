<title id="gc1-title">Gas City system context</title>
<desc id="gc1-desc">Gas City sits at the center. An operator drives it through the gc CLI, the dashboard, and the API. Gas City starts sessions on a runtime host such as tmux or Kubernetes, runs coding-agent harnesses as those sessions, and each harness calls its model provider. Every piece of state is kept as beads in Beads, which polls GitHub for gate checks. Sessions do their work inside registered rig repositories.</desc>
