<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="wkr-title wkr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wkr-title">The order in which WinUI processes a key press</title>
<desc id="wkr-desc">A column of rows shows the steps a key press passes through, top to bottom. First, PreviewKeyDown is raised, starting at the focused element. Next comes the focused element, a TextBox, where three steps run left to right: its keyboard accelerators, its OnKeyDown override, then its KeyDown event. The key then bubbles to the parent, a Grid, which runs the same three steps, and then to the root, a Page, which runs them again. A branch to the right of the root row shows that if the key is still unhandled, WinUI looks for unscoped accelerators elsewhere in the window, meaning accelerators with no ScopeOwner. Below the root, CharacterReceived delivers the typed character for text input. A panel on the right says that setting Handled to true at any step stops everything below it, and that an accelerator that fires marks KeyDown handled.</desc>
