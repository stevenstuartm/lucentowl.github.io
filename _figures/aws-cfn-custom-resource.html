---
title: "How a Custom Resource Responds"
kind: dynamic
system: aws
summary: "CloudFormation waits for the provider's response in S3, not its return value."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="awscr-title awscr-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscr-title">The custom resource request and response protocol</title>
<desc id="awscr-desc">During a stack operation, CloudFormation sends the custom resource's provider, a Lambda function or SNS topic, a request with the request type (Create, Update, or Delete), the resource properties, and a pre-signed S3 response URL. The provider does the work, such as calling an external API, and then uploads its response to the pre-signed URL: SUCCESS or FAILED, a physical ID, and any attributes. CloudFormation reads the response from S3 and continues the stack operation. If no response arrives within the ServiceTimeout, one hour by default, the operation fails.</desc>
