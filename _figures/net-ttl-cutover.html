---
title: "Lowering a TTL for a Cutover"
kind: chart
system: networking
summary: "How long caches can hold the old address when the TTL is lowered early or late."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="ntc-title ntc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ntc-title">Cache lifetimes around a DNS cutover, lowering the TTL early versus at the cutover</title>
<desc id="ntc-desc">A timeline, not to scale. In the first plan, the TTL is lowered from one day to 60 seconds a full day before the cutover. Answers cached just before the change can live for up to a day, but they have all expired by the cutover. Answers cached after the change live 60 seconds each, so after the cutover the old address lingers for at most 60 seconds. In the second plan, the TTL is lowered at the moment of the cutover. Answers cached shortly before it still carry the one-day TTL, so some clients keep the old address for up to a day after the cutover.</desc>
