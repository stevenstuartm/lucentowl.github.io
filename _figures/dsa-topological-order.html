<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="tpo-title tpo-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="tpo-title">A directed acyclic graph of build steps and a topological order of them</title>
<desc id="tpo-desc">Six build steps connected by "must finish before" arrows: restore to compile, compile to test, compile to docs, test to pack, docs to pack, and pack to publish. Restore has in-degree 0, pack has in-degree 2, and the others have in-degree 1. Kahn's algorithm starts with restore, the only step with in-degree 0. Finishing a step lowers the in-degree of each step it points to, and a step becomes ready when its in-degree reaches 0, so pack waits for both test and docs. The order produced is restore, compile, test, docs, pack, publish. Swapping test and docs is also a valid order.</desc>
