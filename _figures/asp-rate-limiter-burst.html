---
title: "Three Limiters, One Burst"
kind: chart
system: aspnet-core
summary: "Permits left over time when a client bursts at 55 s and 61 s."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="arl-title arl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="arl-title">Available permits over two minutes for a fixed window, a sliding window, and a token bucket limiter under the same burst</title>
<desc id="arl-desc">Each limiter allows 100 requests per minute, and a client sends 100 requests at 55 seconds and 100 more at 61 seconds. The fixed window resets at 60 seconds, so both bursts are allowed, 200 requests in six seconds. The sliding window, split into six 10-second segments, has no permits back until the segment used at 55 seconds leaves the window at 110 seconds, so the second burst is rejected. The token bucket holds 100 tokens and adds 10 every 6 seconds, so after the first burst empties it, only the 10 tokens added at 60 seconds are available at 61 seconds, and it refills steadily to 100 by 120 seconds.</desc>
