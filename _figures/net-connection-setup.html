title: "A New HTTPS Connection"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="ncs-title ncs-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ncs-title">Round trips before the first response byte on a new HTTPS connection</title>
<desc id="ncs-desc">A sequence between a client and a server. First round trip, the TCP handshake: the client sends SYN and the server replies SYN-ACK. Second round trip, the TLS 1.3 handshake: the client sends ACK with the TLS ClientHello, and the server replies with ServerHello, its certificate, and Finished. Third round trip, the request: the client sends TLS Finished with the HTTP request, and the server replies with the first byte of the HTTP response. A request on a connection that is already open costs only the third round trip.</desc>
