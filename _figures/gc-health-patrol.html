<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="gc5-title gc5-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="gc5-title">Gas City health patrol session states</title>
<desc id="gc5-desc">A desired session that is not running is started and becomes running and healthy. Each tick checks a running session in order for a requested restart after context exhaustion, an idle timeout, and config drift, and acts on the first that applies. A session whose process has gone is recorded as crashed, with its pane captured. The crash tracker then decides: if starts inside the restart window are below max_restarts, the session restarts; otherwise it is quarantined and skipped silently until the window ages out. Sessions not in the desired set, such as orphans, suspended agents, and pool excess, are drained or stopped.</desc>
