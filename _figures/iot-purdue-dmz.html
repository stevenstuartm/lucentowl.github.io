---
title: "The Purdue Levels and the Industrial DMZ"
kind: boundary
system: iot
summary: "How plant data reaches business systems and the cloud through the DMZ without IT ever gaining a path down to the controllers."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" role="img" aria-labelledby="ipd-title ipd-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ipd-title">Purdue model levels with an industrial DMZ and data diode</title>
<desc id="ipd-desc">Seven horizontal bands, from level 0 physical process at the bottom through level 1 basic control, level 2 supervisory, level 3 site operations, level 3.5 industrial DMZ, level 4 site business, to level 5 enterprise and cloud at the top. Data flows upward from sensors and actuators to PLCs and DCS controllers, to SCADA servers and HMIs, to the plant historian and MES. From level 3 it crosses a hardware data diode in the DMZ into a historian replica, which ERP and business systems at level 4 read. Separately, an edge gateway in the DMZ collects from level 3 and connects outbound only to a cloud IoT platform at level 5. There is no path from IT at level 4 down into the control levels; that path is blocked at the DMZ.</desc>
