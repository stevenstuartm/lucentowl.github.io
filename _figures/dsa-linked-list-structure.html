---
title: "Singly and Doubly Linked Lists"
kind: structure
system: dsa
summary: "Nodes joined by pointers, and an insertion that changes two of them."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="ll-title ll-desc" style="width:100%; min-width:560px; height:auto; display:block;">
<title id="ll-title">Singly linked, doubly linked, and inserting a node</title>
<desc id="ll-desc">Three rows. First, a singly linked list: head points to node A, A points to B, B points to C, and C points to null. Each node holds a value and one pointer to the next node. Second, a doubly linked list of A, B, and C where each node also points back to the previous node, with head at A and tail at C. Third, inserting X after A in a singly linked list: first X's next pointer is set to B, which A currently points to, then A's next pointer is changed to X. The old link from A to B is replaced, and no other node moves.</desc>
