<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="awscd-title awscd-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscd-title">How a CDK app is synthesized and deployed</title>
<desc id="awscd-desc">On a developer machine or in a pipeline, cdk synth runs the CDK app and writes a cloud assembly to cdk.out, containing a CloudFormation template per stack and the assets, such as Lambda code and container images. cdk deploy then uploads the assets to the bootstrap bucket and ECR repository using the file and image publishing roles, and hands the template to CloudFormation using the deployment role. CloudFormation creates the resources using the CloudFormation execution role, and resources such as Lambda functions reference their assets in the bucket. The bucket, repository, and roles belong to the bootstrap stack, CDKToolkit, deployed once per account and Region.</desc>

<text class="awscd-lab" x="20" y="326">Assets are uploaded with the file and image publishing roles, the template with the deployment role, and CloudFormation acts with the execution role.</text>
