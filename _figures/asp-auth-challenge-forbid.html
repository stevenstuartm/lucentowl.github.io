<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="aaf-title aaf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aaf-title">How authentication and authorization middleware produce 401 and 403 responses</title>
<desc id="aaf-desc">A request passes through the authentication middleware, which runs the default scheme's handler and sets HttpContext.User. It never rejects the request, even when no credentials are present or they are invalid. The authorization middleware then evaluates the matched endpoint's policies. If they pass, the endpoint runs. If the user isn't authenticated, authorization calls Challenge on the scheme, which a bearer handler turns into a 401 and a cookie handler into a login redirect, or a 401 for known API endpoints since .NET 10. If the user is authenticated but a policy fails, authorization calls Forbid, which a bearer handler turns into a 403 and a cookie handler into an access-denied redirect, or a 403 for known API endpoints.</desc>
