<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="awsk-title awsk-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsk-title">Network paths of a Lambda function attached to a VPC</title>
<desc id="awsk-desc">The function runs in Lambda's own network and reaches your VPC through a Hyperplane ENI in a private subnet, one ENI per combination of subnet and security group. From the ENI, traffic goes to private resources such as an RDS database directly, to AWS services such as S3, DynamoDB, or Secrets Manager through a VPC endpoint, and to the internet only through a NAT gateway in a public subnet and the internet gateway. A function that is not attached to a VPC reaches the internet and public AWS endpoints directly, but no private resources.</desc>
