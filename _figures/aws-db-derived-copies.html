<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="awsdc-title awsdc-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsdc-title">A source of truth feeding derived copies</title>
<desc id="awsdc-desc">The application writes only to the source of truth, which is Aurora, RDS, or DynamoDB. It reads a cache in ElastiCache first and fills it from the source on a miss, so a cached entry can be stale until its TTL expires. A search index in OpenSearch Service is fed from the source by a change-stream consumer or a managed ingestion pipeline and is never written directly. A Redshift warehouse is fed by a zero-ETL integration, seconds behind Aurora or RDS and 15 to 30 minutes behind DynamoDB.</desc>
