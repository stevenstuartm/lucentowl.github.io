<title id="aitp-title">Temperature rescaling a next-token distribution</title>
<desc id="aitp-desc">Three bar charts of the same six candidate tokens, mat, floor, couch, bed, roof, and moon, at three temperatures. At low temperature, 0.2, mat takes almost all the probability. At temperature 1.0 the model's own distribution is used, with mat at 45 percent and the others trailing. At high temperature, 1.8, the bars flatten and unlikely tokens such as roof and moon gain probability. Probabilities are illustrative.</desc>
