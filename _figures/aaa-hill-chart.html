<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="aaa4-title aaa4-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aaa4-title">A hill chart with uphill, peak, and downhill stages</title>
<desc id="aaa4-desc">A hill chart has three stages. Uphill, the team is figuring the work out and unknowns are still open. At the peak, the unknowns are resolved and the work is ready to build, and it can wait there before building starts. Downhill, the work is known and being built. An integration sits partway uphill, still uncertain. A claims item sits higher uphill and has been in the same spot for three updates in a row, which means it is stuck on an unknown and should be raised now. An export sits at the peak, ready but not started. The UI sits downhill, being built.</desc>

.aaa-peak { fill: var(--color-gold, #C9A227); fill-opacity: 0.12; stroke: var(--color-gold, #C9A227); stroke-width: 1.25; stroke-dasharray: 4 4; }
.aaa-dot { fill: var(--color-primary, #1A5F8A); }
.aaa-dot-stuck { fill: var(--color-accent, #A5486E); }
.aaa-ring { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 1.5; stroke-dasharray: 3 2; }
.aaa-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }
.aaa-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--color-text-light, #4A5568); }
.aaa-el { font-size: 12px; font-weight: 700; fill: var(--color-text, #2C3E50); }
.aaa-warn { font-size: 12px; font-weight: 700; fill: var(--color-accent, #A5486E); }
</style>
