<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 246" role="img" aria-labelledby="ofg-title ofg-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ofg-title">CPU flame graph for the checkout service</title>
<desc id="ofg-desc">Stacked boxes, each a function sitting on top of the function that called it, with width proportional to the share of CPU samples. At the bottom, all samples. Above it, garbage collection takes 8 percent and a thread pool worker 92 percent. The worker runs CheckoutController.Post at 88 percent. Post calls Cart.Validate at 12 percent, JsonSerializer.Serialize at 46 percent, and TaxCalculator.Compute at 22 percent. Above those, Regex.Match takes 9 percent under Cart.Validate, PropertyInfo.GetValue 16 percent and Utf8JsonWriter.WriteString 28 percent under JsonSerializer.Serialize, and TaxRateCache.Lookup 15 percent under TaxCalculator.Compute.</desc>

.ofg-lib { fill: var(--color-gold, #C9A227); stroke: var(--color-card-bg, #FFFFFF); stroke-width: 1.5; }
.ofg-root { fill: var(--color-text-light, #4A5568); stroke: var(--color-card-bg, #FFFFFF); stroke-width: 1.5; }
.ofg-ta { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
.ofg-tl { font-size: 11px; font-weight: 600; fill: #2C3E50; }
.ofg-ax { font-size: 11px; fill: var(--color-text-light, #4A5568); }
.ofg-t { font-size: 11.5px; font-weight: 600; fill: var(--color-text, #2C3E50); }
.ofg-axis { fill: none; stroke: var(--color-text-light, #4A5568); stroke-width: 1.25; }
</style>
