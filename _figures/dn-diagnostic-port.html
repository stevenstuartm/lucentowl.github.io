<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="dpt-title dpt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dpt-title">The .NET diagnostic tools connecting to a process through its diagnostic port</title>
<desc id="dpt-desc">dotnet-counters, dotnet-trace, dotnet-gcdump, and dotnet-dump run as separate processes on the same machine or in the same container. Each connects to the target process's diagnostic port, a named pipe on Windows or a Unix domain socket elsewhere. Through it, counters and trace ask the runtime to stream metrics and events from EventPipe, gcdump asks for the heap's object graph, which forces a full gen 2 collection, and dump asks the runtime to write the process memory to a file. No debugger, profiler, or code change is needed.</desc>
