---
title: "Offset and Cursor Pages Under an Insert"
kind: chart
system: architecture-design
summary: "An insert shifts offset pages, while a cursor keeps its place."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dps-title dps-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dps-title">An inserted item shifting offset pagination but not cursor pagination</title>
<desc id="dps-desc">Page 1, fetched with offset 0 and limit 3, returns items A, B, and C. Before page 2 is fetched, a new item X is inserted at the front of the collection, so it now reads X, A, B, C, D, E, F. Page 2 with offset 3 returns C, D, and E, so C is repeated. Page 2 with a cursor positioned after C returns D, E, and F, with nothing repeated or skipped.</desc>
