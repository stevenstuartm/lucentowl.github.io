<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="bcs-title bcs-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="bcs-title">Cumulative input cost of a batch run three ways</title>
<desc id="bcs-desc">Cumulative input tokens billed across a 30-item batch. One long session grows quadratically, because each request resends every earlier output. The same session with prompt caching still grows quadratically, but the reused history is billed at a tenth of the rate, so the curve is lower. Isolating each task repeats the shared setup per task and does not grow with position. Illustrative sizes: a 5,000-token shared setup and 6,000-token outputs.</desc>
