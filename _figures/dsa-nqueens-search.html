<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 486" role="img" aria-labelledby="nqs-title nqs-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="nqs-title">The pruned search tree for the four-queens problem</title>
<desc id="nqs-desc">A tree of partial placements for four queens on a 4 by 4 board, one queen per row. From the start, row 0 can take a queen in any of columns 0 to 3. Column 0 leads to row 1 columns 2 and 3. The row 1 queen in column 2 is a dead end with no safe square in row 2, and the one in column 3 leads to row 2 column 1, a dead end in row 3. Column 1 in row 0 leads to 3, then 0, then 2, a solution. Column 2 in row 0 leads to 0, then 3, then 1, the second solution. Column 3 mirrors column 0 and dead-ends. The search visits 16 partial boards, compared with 256 ways to place one queen in each row, and finds two solutions.</desc>
