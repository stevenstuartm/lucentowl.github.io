<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="amf-title amf-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="amf-title">How the five MVC filter types wrap a controller action</title>
<desc id="amf-desc">Authorization filters run first. Resource filters then wrap everything that follows, running before model binding and again after the result has executed. Inside them, model binding runs, then action filters wrap the action method, then result filters wrap the execution of the result. Exception filters catch exceptions thrown during controller creation, model binding, action filters, and the action, but not during resource filters, result filters, or result execution.</desc>
