---
title: "What await Does to the Caller"
kind: dynamic
system: dotnet
summary: "An async method running synchronously, returning a task, then resuming later."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="awt-title awt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awt-title">Timeline of a call to an async method that awaits an HTTP request</title>
<desc id="awt-desc">The caller calls GetCustomerAsync, which runs on the caller's thread: it logs, then awaits GetStringAsync. The HTTP request is not complete, so the method registers a continuation and returns an incomplete Task of Customer to the caller, whose thread is then free for other work. No thread waits while the request is in flight. When the response arrives, the continuation runs, deserializes the JSON, and returns, which completes the task and resumes anything awaiting it.</desc>
