---
title: "Orchestration and Choreography"
kind: flow
system: distributed-patterns
summary: "One service calling the others in order, or services reacting to an event."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="poc-title poc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="poc-title">Orchestration compared with choreography</title>
<desc id="poc-desc">In orchestration, an order orchestrator holds the process state and calls payment, inventory, shipping, and notification services in order, waiting for each response. The participants know nothing about the process. In choreography, the order service publishes an OrderCreated event to an event bus, and the inventory, payment, shipping, and notification services each react to it. No service owns the process.</desc>
