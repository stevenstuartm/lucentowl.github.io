<title id="awssam-title">How the SAM transform expands a function and a table</title>
<desc id="awssam-desc">The template declares OrdersFunction, an AWS::Serverless::Function, and OrdersTable, an AWS::Serverless::SimpleTable. When CloudFormation processes the template, the SAM transform expands each part into CloudFormation resources. The function itself becomes a Lambda function and an IAM execution role. AutoPublishAlias set to live becomes a Lambda version and a Lambda alias. The HttpApi event becomes an HTTP API, its default stage, and a Lambda permission that lets the API invoke the function. The SQS event becomes an event source mapping and adds queue-read permissions to the execution role. The connector granting Write access to OrdersTable becomes an IAM managed policy. The SimpleTable becomes an on-demand DynamoDB table. That is ten resources in all. Plain CloudFormation resources in the template, such as the queue itself, pass through the transform unchanged.</desc>
