title: "Discovering HTTP/3"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="nhd-title nhd-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="nhd-title">Two ways a client learns a server supports HTTP/3</title>
<desc id="nhd-desc">First way: the client connects to the server over TCP and TLS, offering h2 and http/1.1 through ALPN, and the server's response carries an Alt-Svc header advertising h3 on UDP port 443. Second way: the client looks up the domain's DNS HTTPS record, which lists h3 and h2 among its supported protocols. Either way, the client then connects over QUIC on UDP port 443, and falls back to TCP if the QUIC attempt fails.</desc>
