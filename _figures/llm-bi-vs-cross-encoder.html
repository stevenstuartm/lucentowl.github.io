---
title: "Bi-Encoder and Cross-Encoder"
kind: structure
system: llm-systems
summary: "Encoding separately for search versus reading together to score."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="bxe-title bxe-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="bxe-title">Bi-encoder compared with cross-encoder</title>
<desc id="bxe-desc">Left: a bi-encoder encodes the document and the query separately; document vectors are computed once, and query and document vectors are compared by similarity, which makes search across millions of chunks fast. Right: a cross-encoder reads the query and one document together and outputs a relevance score; it is more accurate but produces no reusable embedding and must run once per query-document pair, too slow for a whole collection.</desc>
