<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="awsmgn-title awsmgn-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsmgn-title">AWS Transform MGN replication path from a source server to a launched EC2 instance</title>
<desc id="awsmgn-desc">A source server in a data center or another cloud runs the AWS Replication Agent. The agent talks to the AWS Transform MGN service endpoint over TCP 443 for control and sends replicated disk blocks over TCP 1500 to a replication server, a small EC2 instance in a staging area subnet in your VPC in the target Region. The replication server writes the blocks to staging EBS volumes and also reports to the service over TCP 443. When a test or cutover instance is launched, MGN snapshots the staging volumes and a conversion server prepares copies to boot on AWS, and the instance starts in a separate launch subnet.</desc>
