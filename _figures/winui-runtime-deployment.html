---
title: "Where the Windows App SDK Runtime Lives"
kind: deployment
system: winui
summary: "Apps sharing one serviced runtime, beside an app that carries its own copy."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="wrd-title wrd-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wrd-title">Framework-dependent and self-contained deployment of the Windows App SDK runtime</title>
<desc id="wrd-desc">The left panel shows framework-dependent deployment. Three apps sit at the top: packaged app A, packaged app B (each declaring the framework as a manifest dependency), and unpackaged app C, which finds the runtime through its bootstrapper. Arrows run from all three down to one shared Framework package, the Windows App SDK runtime installed once and shared by every app that uses it. Below the framework, the Main package updates it from the Store, shown by an arrow into the framework labeled servicing updates, and the DDLM (Dynamic Dependency Lifetime Manager) holds the framework version that unpackaged app C (or an app packaged with external location) is using, so it isn't updated while C runs. The right panel shows self-contained deployment: app D contains its own copy of the runtime inside the app, which changes only when the app ships a new version.</desc>

</marker>

</defs>
