---
title: "LSM Tree With Leveled Compaction"
kind: flow
system: databases
summary: "Writes buffered in memory, flushed to immutable files, merged level by level."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="dlt-title dlt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dlt-title">How an LSM tree handles writes</title>
<desc id="dlt-desc">A write is appended to the write-ahead log on disk and inserted into the memtable, a sorted structure in memory. When the memtable is full, it is flushed to disk as an immutable SSTable in level 0. Compaction merges SSTables from level 0 into level 1 and from level 1 into level 2, keeping the newest version of each key and dropping overwritten and deleted values.</desc>
