<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="stsk-title stsk-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stsk-title">Mode, median, and mean on a right-skewed distribution</title>
<desc id="stsk-desc">A curve rises steeply from zero to a peak and then trails off in a long tail to the right. A line at the peak marks the mode. A line to its right marks the median, with half the values on each side. A line further right marks the mean, pulled toward the long tail by the few very large values.</desc>
