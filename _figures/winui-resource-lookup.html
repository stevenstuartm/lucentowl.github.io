---
title: "How a Resource Reference Is Resolved"
kind: flow
system: winui
summary: "The search from the referencing element up to system resources, stopping at the first match."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="wrl-title wrl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wrl-title">The order in which WinUI searches for a XAML resource key</title>
<desc id="wrl-desc">On the left, a column of five boxes shows the search order for a StaticResource reference made by a Button. The search starts at the Button's own resources, then moves up to each parent such as a Border, then the page at the root of the XAML, then Application.Resources, and finally the system resources such as the SystemColor colors and SystemAccentColor. Arrows run downward between the boxes, and the search stops at the first box that has the key. Below the last box, a note says that a key found nowhere throws a XAML parse exception. On the right, Application.Resources is expanded to show the order inside one dictionary: first its own keys, then its merged dictionaries in reverse of the order they are declared, so Styles/Controls.xaml, then Styles/Typography.xaml, then Styles/Colors.xaml, and last XamlControlsResources, which is declared first.</desc>

<marker id="wrl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary, #1A5F8A)"/>
</marker>
</defs>

<text class="wrl-n" x="56" y="165">Border.Resources</text>

<text class="wrl-k" x="536" y="333">merged, declared first: WinUI styles, brushes</text>

<line class="wrl-step" x1="40" y1="492" x2="80" y2="492" marker-end="url(#wrl-arrow)"/>
