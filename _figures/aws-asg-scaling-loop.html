<title id="awsl-title">How a target tracking policy, an Auto Scaling group, its instances, and a CloudWatch metric form a feedback loop</title>
<desc id="awsl-desc">A target tracking policy sets the Auto Scaling group's desired capacity. The group launches or terminates instances across Availability Zones to match it. The instances publish a metric, such as average CPU utilization, to CloudWatch. The policy compares the metric to its target, for example 50 percent, and raises or lowers desired capacity, which closes the loop. Separately, health checks make the group replace any instance that fails them.</desc>
