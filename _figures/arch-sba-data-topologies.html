<title id="sdt-title">Shared, domain, and service-owned databases in service-based architecture</title>
<desc id="sdt-desc">The same six services under three data topologies. With a shared database, all six use one database. With domain databases, catalog and search share a catalog database, cart and checkout share an orders database, and inventory and fulfillment share a logistics database. With service-owned databases, each service has its own.</desc>
