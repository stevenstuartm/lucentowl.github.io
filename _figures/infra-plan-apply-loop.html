<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="ipa-title ipa-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ipa-title">How an IaC tool turns definition files into changes</title>
<desc id="ipa-desc">The tool compares the definition files, which describe what should exist, with its state record, which maps each definition to a real resource ID. Terraform, OpenTofu, and Bicep also read the live infrastructure's current configuration on every plan; Pulumi and CloudFormation read it only on request. Bicep keeps no state record. The comparison produces a plan of create, update, replace, and delete actions. After review, apply changes the live resources and updates the state record.</desc>
