<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ivr-title ivr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ivr-title">Edge data reduction for high-frequency vibration monitoring</title>
<desc id="ivr-desc">An accelerometer on the machine is sampled at 25.6 kHz, about 51 KB per second. On the edge device or smart sensor, the stream feeds a raw ring buffer holding the last few minutes, and an FFT and envelope stage that computes spectra and features for each capture. Features go to a lightweight anomaly check on the device, against the asset's baseline, which sends features and alerts upstream every few seconds. Spectra go upstream every few minutes. When the anomaly check fires, it triggers the ring buffer to upload raw waveforms, so full-resolution data is sent only around events.</desc>
