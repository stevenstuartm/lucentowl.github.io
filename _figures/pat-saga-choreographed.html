---
title: "A Choreographed Saga"
kind: flow
system: distributed-patterns
summary: "A failure event travels upstream and each service compensates itself."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="psh-title psh-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="psh-title">Choreographed saga with compensation</title>
<desc id="psh-desc">The order service publishes OrderCreated, the inventory service reserves stock and publishes InventoryReserved, and the payment service fails and publishes PaymentFailed. That failure event reaches every upstream participant: the inventory service releases stock and publishes InventoryReleased, and the order service cancels and publishes OrderCancelled. No single place holds the saga state.</desc>

.psh-n { font-size: 12.5px; font-weight: 700; fill: var(--color-primary, #1A5F8A); }

.psh-labc { font-size: 11.5px; font-weight: 600; fill: var(--color-purple, #6B3FA0); }
.psh-labr { font-size: 11.5px; font-weight: 600; fill: var(--color-accent, #A5486E); }
.psh-note { font-size: 11.5px; fill: var(--color-text, #2C3E50); }
.psh-el { font-size: 11px; fill: var(--color-text, #2C3E50); }

</style>

<rect class="psh-bad" x="660" y="90" width="180" height="56" rx="6"/>
<text class="psh-n-bad" x="750.0" y="122.0" text-anchor="middle">Payment service</text>
<path class="psh-ctl" d="M 240,110 H 354" marker-end="url(#psh-c)"/>

<path class="psh-ctl" d="M 540,110 H 654" marker-end="url(#psh-c)"/>
<text class="psh-labc" x="597" y="100" text-anchor="middle">InventoryReserved</text>
<path class="psh-redd" d="M 750,146 V 220 H 150 V 152" marker-end="url(#psh-r)"/>
<path class="psh-redd" d="M 450,220 V 152" marker-end="url(#psh-r)"/>
