title: "A Templated Control and Its Templates"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="wtc-title wtc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wtc-title">How a templated control's class connects to its default template and to an app's replacement template</title>
<desc id="wtc-desc">On the left, the CopyField control class sets DefaultStyleKey to typeof(CopyField), declares a TemplatePart named CopyButton and TemplateVisualStates named Normal and Copied, and in OnApplyTemplate calls GetTemplateChild("CopyButton"), later calling GoToState("Copied"). On the right are two templates, and one of them is applied. The first is the default style in Themes/Generic.xaml, a Style whose TargetType is local:CopyField, applied when the app sets no template. DefaultStyleKey selects it. The second is an app's own ControlTemplate, set through Template or a Style, which replaces the default. Both templates contain a Button named CopyButton and visual states named Normal and Copied, and the class finds the part and the states by name in whichever template is applied.</desc>
