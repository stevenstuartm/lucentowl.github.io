---
title: "Exception Handler Re-Execution"
kind: flow
system: aspnet-core
summary: "What runs again when the exception handler re-executes at an error path."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="aer-title aer-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aer-title">How the exception handler re-executes part of the pipeline at an error path</title>
<desc id="aer-desc">A request passes through earlier middleware, the exception handler, and later middleware to an endpoint, which throws. The exception unwinds back to the exception handler, which offers it to each IExceptionHandler. If none handles it, the handler clears the response and the selected endpoint, changes the path to /error, and runs the later middleware a second time. Routing selects the /error endpoint, which writes the response. Middleware registered before the exception handler runs only once.</desc>
