<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" role="img" aria-labelledby="fb-title fb-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="fb-title">The call tree of naive recursive Fibonacci for n = 5, with memoization's savings marked</title>
<desc id="fb-desc">The call tree of FibonacciNaive(5). F(5) calls F(4) and F(3). F(4) calls F(3) and F(2). Each F(3) calls F(2) and F(1), and each F(2) calls F(1) and F(0), for 15 calls in all. F(3) is computed twice and F(2) three times. With memoization, the calls down the left edge compute F(5), F(4), F(3), and F(2) once each and store them, along with the base cases F(1) and F(0) and one more F(1). The second F(2), under F(4), and the second F(3), under F(5), become lookups of stored values, so the 6 calls beneath them never happen. The memoized version makes 9 calls.</desc>
