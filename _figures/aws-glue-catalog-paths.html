<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="awsglu-title awsglu-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awsglu-title">Glue Data Catalog as the metadata layer over S3</title>
<desc id="awsglu-desc">Four engines, Athena, Redshift Spectrum, Amazon EMR, and Glue ETL jobs, each look up a table in the AWS Glue Data Catalog, which returns the schema, format, partitions, and S3 location. Each engine then reads the files directly from the S3 data lake. Data never passes through the catalog. Crawlers read S3 and jobs that write data to S3, and both update table and partition definitions in the catalog. Lake Formation, when used, grants access at the table, column, and row level on the catalog and issues the credentials engines use for the S3 read.</desc>
