<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="ast-title ast-desc" style="width:100%; min-width:700px; height:auto; display:block;">
<title id="ast-title">The resources in a multi-service Aspire AppHost and how they connect</title>
<desc id="ast-desc">Outside traffic reaches only the api-gateway project, the one resource with external endpoints. The gateway calls order-service by name through service discovery and uses the Redis cache. The order-service uses the cache, the PostgreSQL orders-db database, and publishes to the RabbitMQ messaging broker. The background-worker consumes from messaging and writes to orders-db. It never references order-service. A migrations project runs once, applies the schema to orders-db, and exits. Both order-service and background-worker wait for it to finish before they start.</desc>
