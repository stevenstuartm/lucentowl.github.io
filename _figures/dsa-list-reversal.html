---
title: "Reversing a Linked List"
kind: flow
system: dsa
summary: "How the previous and current references flip one Next pointer per pass until the list points the other way."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 478" role="img" aria-labelledby="rv-title rv-desc" style="width:100%; min-width:640px; height:auto; display:block;">
<title id="rv-title">Reversing the list A, B, C one pointer at a time</title>
<desc id="rv-desc">Four rows show the list A, B, C during reversal. At the start, A points to B, B to C, and C to null, with previous at null and current at A. After one pass, A points to null, and B still points to C; previous is A and current is B, with no link between them. After two passes, B points back to A and A to null, C still points to null; previous is B and current is C. After three passes, C points to B, B to A, and A to null; previous is C, the new head, and current is null. Each pass saves current's Next, points current back at previous, and moves both references one node right. The missing link between the reversed part and the rest is why the next node must be saved before flipping.</desc>
