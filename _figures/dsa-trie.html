<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="tr-title tr-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="tr-title">A trie storing the words car, cart, cat, and dog</title>
<desc id="tr-desc">A trie whose root holds no letter. The root has two children, c and d. Under c is a, and under a are r and t. Under r is another t. Under d is o, and under o is g. The nodes r, t under a, g, and the t under r are marked as word ends, spelling car, cat, dog, and cart along the path from the root. The path c then a is shared by car, cart, and cat, so the prefix ca is stored once. The node r marks the end of car and still has a child, because car is also the start of cart.</desc>
