---
title: "One Word, Four Bounded Contexts"
kind: boundary

summary: "Customer means something different inside each context's model."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="dcc-title dcc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dcc-title">The word customer in four bounded contexts</title>
<desc id="dcc-desc">Four bounded contexts, each with its own model of a customer. To sales, a customer is a lead with a pipeline stage. To fulfillment, it is a delivery address. To billing, it is a payment history and a credit limit. To support, it is a ticket history.</desc>

</style>
