<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="dcs-title dcs-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dcs-title">Change data capture feeding secondary stores from the primary database's log</title>
<desc id="dcs-desc">The application writes to the primary database, PostgreSQL, which records each committed change in its transaction log. A CDC connector such as Debezium reads the log and publishes each change as an event to a stream such as a Kafka topic. A search index and a cache each consume the stream and update their copies. Only committed changes reach the log, so the copies can lag the primary but won't drift from it.</desc>
