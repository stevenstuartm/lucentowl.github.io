title: "A Frame's Back and Forward Stacks"
kind: dynamic

summary: "How Navigate and GoBack move pages between a frame's two stacks."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wfs-title wfs-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wfs-title">How Navigate and GoBack move pages between a Frame's back stack and forward stack</title>
<desc id="wfs-desc">Three rows show a Frame's state at three moments, with columns for the back stack, the current page, and the forward stack. In the first row, the back stack holds HomePage, the current page is OrdersPage, and the forward stack is empty. Calling Navigate to DetailPage moves OrdersPage onto the back stack, so the second row shows HomePage and OrdersPage in the back stack, DetailPage as the current page, and an empty forward stack. Calling GoBack then moves DetailPage onto the forward stack and takes OrdersPage off the back stack to become the current page, so the third row shows HomePage in the back stack, OrdersPage current, and DetailPage in the forward stack.</desc>

<path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent, #C0392B)"/>
</marker>
</defs>
