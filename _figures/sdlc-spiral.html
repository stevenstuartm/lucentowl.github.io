<title id="spr-title">The spiral model's four activities repeated in widening passes</title>
<desc id="spr-desc">A spiral starts at the centre and winds clockwise through four quadrants: determine objectives and constraints, identify and evaluate risks, develop and verify the next increment, and plan the next spiral with stakeholders. Distance from the centre is cumulative commitment, so each pass commits more resources than the last. What each pass builds is whatever resolves the largest remaining risk.</desc>
