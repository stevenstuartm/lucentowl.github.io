<title id="rsn-title">The shapes of three reasoning techniques</title>
<desc id="rsn-desc">Chain-of-thought: one linear path from the question through several steps to an answer, so an early mistake carries through. Self-consistency: several independent reasoning paths from the same question, each reaching an answer, followed by a vote on the answer most paths agree on, so a wrong path is outvoted if most avoid it. Tree of Thoughts: from the problem, several candidate next steps are proposed and evaluated; a weak branch is abandoned, a dead end is backtracked from, and the promising branch is explored further to a solution. Answers shown are illustrative.</desc>
