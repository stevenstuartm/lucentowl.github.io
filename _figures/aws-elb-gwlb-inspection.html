<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-labelledby="awsg-title awsg-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsg-title">How route tables send inbound traffic through a Gateway Load Balancer and its appliances</title>
<desc id="awsg-desc">A request from the internet enters the application VPC through the internet gateway. An edge route table on the internet gateway sends traffic for the application subnet to a Gateway Load Balancer endpoint in its own subnet. The endpoint forwards the traffic privately to the Gateway Load Balancer in a separate inspection VPC. The Gateway Load Balancer wraps each packet in GENEVE on UDP port 6081 and sends it to a firewall appliance, which inspects it and returns it. The Gateway Load Balancer hands the packet back to the endpoint, which delivers it to the application instances with its original addresses. The application subnet's default route points at the endpoint, so responses take the same path back, and the endpoint subnet's default route sends them out through the internet gateway.</desc>
