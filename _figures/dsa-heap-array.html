<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="hp-title hp-desc" style="width:100%; min-width:620px; height:auto; display:block;">
<title id="hp-title">A min-heap shown as a tree and as the array that stores it</title>
<desc id="hp-desc">A min-heap holding 1, 3, 6, 5, 9, 8. As a tree, 1 is the root at index 0, its children are 3 at index 1 and 6 at index 2, the children of 3 are 5 and 9 at indexes 3 and 4, and the left child of 6 is 8 at index 5. Every parent is less than or equal to its children. As an array, the same values sit in level order: 1, 3, 6, 5, 9, 8. Arrows from index 1 to indexes 3 and 4 show that the children of index i are at 2i + 1 and 2i + 2, and the parent of i is at (i − 1) / 2.</desc>
