<title id="sg-title">A segment tree over eight values answering the sum of indexes 2 to 6</title>
<desc id="sg-desc">A segment tree over the array 5, 8, 6, 3, 2, 7, 2, 6. Each node holds the sum of a range of indexes. The root covers 0 to 7 with sum 39. Its children cover 0 to 3 with sum 22 and 4 to 7 with sum 17. The next level covers 0 to 1 (13), 2 to 3 (9), 4 to 5 (9), and 6 to 7 (8), and the leaves hold the eight single values. To sum indexes 2 to 6, the query splits at the root, at 0 to 3, at 4 to 7, and at 6 to 7. It uses the stored sums of 2 to 3 (9), 4 to 5 (9), and the single index 6 (2), for a total of 20. The nodes for 0 to 1 and index 7 lie outside the range and return 0, and the leaves under them and under 2 to 3 and 4 to 5 are never visited.</desc>
