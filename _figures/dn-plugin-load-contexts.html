title: "One Load Context per Plugin"
kind: structure

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="plc-title plc-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="plc-title">Plugin isolation with one AssemblyLoadContext per plugin</title>
<desc id="plc-desc">The default AssemblyLoadContext holds the host executable, the runtime assemblies, and the shared contract assembly Contoso.Plugins.Abstractions. Two plugin contexts, analytics and reporting, each hold their plugin assembly and their own version of Contoso.Data, version 2.0.0 and version 3.0.0. Each plugin context's Load override returns null for the contract, so both resolve the one copy in the default context rather than loading their own. Isolation is by name resolution only, not a security boundary.</desc>
