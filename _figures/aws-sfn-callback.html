---
title: "Waiting for a Callback"
kind: flow
system: aws
summary: "A task sends out a token and pauses until something sends it back."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 305" role="img" aria-labelledby="awscb-title awscb-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscb-title">The wait-for-callback pattern in Step Functions</title>
<desc id="awscb-desc">A Task state using the waitForTaskToken pattern sends a message containing a task token to an SQS approval queue, then the execution pauses. An approval application reads the message and shows the request to a person. While work is in progress it can call SendTaskHeartbeat with the token. When the person decides, the application calls SendTaskSuccess or SendTaskFailure with the token, and the execution resumes at the next state or at its error handling.</desc>
