<title id="stnb-title">A normal curve with bands at one, two, and three standard deviations</title>
<desc id="stnb-desc">A symmetric bell curve centered on the mean. The darkest band, from one standard deviation below the mean to one above, holds about 68 percent of values. The band out to two standard deviations holds about 95 percent, and the band out to three holds about 99.7 percent.</desc>
