<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="mcpo-title mcpo-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mcpo-title">The MCP OAuth authorization sequence</title>
<desc id="mcpo-desc">1: the MCP client sends a request with no token. 2: the MCP server answers 401 with a WWW-Authenticate header naming its resource metadata URL and required scope. 3: the client fetches the protected resource metadata, which names the authorization server to use. 4: the client fetches the authorization server's metadata. 5: the client identifies itself with a client ID metadata document URL, a pre-registered ID, or dynamic client registration. 6: the client sends an authorization request with a PKCE challenge and the MCP server's URI as the resource, and the user signs in and consents in a browser. 7: the authorization server returns an authorization code with its issuer, which the client checks. 8: the client requests a token with the code, PKCE verifier, and resource. 9: the authorization server issues an access token whose audience is this MCP server. 10: the client sends requests to the MCP server with that bearer token.</desc>
