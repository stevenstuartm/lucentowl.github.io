title: "How Cognito Tokens Reach APIs and AWS"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="awscog-title awscog-desc" style="width:100%; min-width:740px; height:auto; display:block;">
<title id="awscog-title">Cognito user pool and identity pool token flow</title>
<desc id="awscog-desc">An app signs a user in to a Cognito user pool, which can federate sign-in to an external identity provider such as Google, Apple, or a SAML or OIDC provider. The user pool returns an ID token, an access token, and a refresh token. The app sends the access token to its own API, such as API Gateway or an Application Load Balancer, which verifies it. To call AWS services directly, the app sends the ID token to an identity pool, which returns temporary AWS credentials for an IAM role. The app then signs requests to AWS services such as S3 or DynamoDB with those credentials. An app that only calls its own API needs only the user pool.</desc>
