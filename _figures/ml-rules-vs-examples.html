<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="mlr-title mlr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="mlr-title">A hand-written program compared with a trained model</title>
<desc id="mlr-desc">In a hand-written program, a programmer writes rules, and the program applies them to each new email to answer spam or not spam. Every new spam tactic needs a new rule. In machine learning, a training algorithm reads ten thousand emails that people have already labeled and produces a model of learned values. The model then takes the place of the program: a new email goes in and an answer comes out. The programmer chooses the examples and how success is measured instead of writing the rules.</desc>
