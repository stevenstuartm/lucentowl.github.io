<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="wtq-title wtq-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wtq-title">How work from other threads reaches a WinUI UI thread through its DispatcherQueue</title>
<desc id="wtq-desc">Left: two sources of work off the UI thread. An await or Progress of T posts its continuation through the DispatcherQueueSynchronizationContext, and background work such as Task.Run, a timer callback, or a service event calls TryEnqueue. Both add items to the UI thread's DispatcherQueue in the middle, which holds High, Normal, and Low priority lanes. The UI thread's message loop on the right takes the next item, highest priority first, and runs it, and only that code reads and writes the XAML objects: the window, its controls, and bound view model state. A dashed line from the background work straight to the XAML objects shows direct access from another thread, which throws RPC_E_WRONG_THREAD.</desc>
