title: "A Bimodal Distribution"
kind: chart
system: statistics

---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="stbm-title stbm-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stbm-title">A response-time distribution with two peaks and the mean between them</title>
<desc id="stbm-desc">A response-time curve has a tall, narrow peak on the left for fast cache hits and a lower, wider peak on the right for slow cache misses. The mean falls in the valley between the peaks, a response time that few requests actually have.</desc>
