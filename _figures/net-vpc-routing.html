<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="nvr-title nvr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="nvr-title">A cloud network with a public subnet and a private subnet</title>
<desc id="nvr-desc">A cloud network with an internet gateway at its edge and two subnets. The public subnet's route table sends 0.0.0.0/0 to the internet gateway, and it holds a load balancer and a NAT gateway. The private subnet's route table sends 0.0.0.0/0 to the NAT gateway, and it holds the application instances. Inbound requests come from the internet through the internet gateway to the load balancer and then to the instances. Outbound calls from the instances go to the NAT gateway, then the internet gateway, then the internet. Both route tables also route the network's own range, 10.20.0.0/16, locally.</desc>
