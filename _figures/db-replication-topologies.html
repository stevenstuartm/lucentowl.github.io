<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="drt-title drt-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="drt-title">Single-leader, multi-leader, and leaderless replication</title>
<desc id="drt-desc">In single-leader replication, a client writes to the one leader, which ships its log to two followers. In multi-leader replication, clients write to leader A or leader B, each leader has its own follower, and the two leaders replicate to each other and must resolve conflicting writes. In leaderless replication, a client sends each write to all three replicas and the write succeeds once W of the N replicas acknowledge it; reads query R replicas.</desc>
