<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="stcr-title stcr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="stcr-title">Four scatter plots with their correlation coefficients</title>
<desc id="stcr-desc">Four scatter plots. Points along a rising straight line have a correlation near plus one. A shapeless cloud has a correlation near zero. Points along a strong arch also have a correlation near zero, because the coefficient only measures straight-line relationships. A tight cluster of unrelated points plus one far-off point has a strong positive correlation created by that single point.</desc>
