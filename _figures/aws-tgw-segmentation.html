title: "Transit Gateway Route Tables as Segments"

summary: "One transit gateway whose route tables keep dev and prod apart."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="awsw-title awsw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="awsw-title">A transit gateway whose route tables let prod and dev reach shared services but not each other</title>
<desc id="awsw-desc">Four attachments connect to one transit gateway: a prod VPC, a dev VPC, a shared services VPC, and a VPN to the on-premises network. The prod VPC and the VPN are associated with the prod route table, which has routes to prod, shared services, and on-premises. The dev VPC is associated with the dev route table, which has routes to dev and shared services only. The shared services VPC is associated with a shared route table with routes to every attachment. Because neither the prod nor the dev route table has a route to the other, prod and dev can't reach each other, even though both are attached to the same transit gateway.</desc>
