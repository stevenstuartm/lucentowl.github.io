<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="wwp-title wwp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="wwp-title">How WebView2 controls map to browser processes and user data folders</title>
<desc id="wwp-desc">On the left is the app's own process, holding three WebView2 controls. Controls 1 and 2 were created with an environment that names user data folder A. Control 3 was created with an environment that names user data folder B. In the middle are two WebView2 process groups outside the app. The group for folder A has one browser process, which both control 1 and control 2 talk to, and which starts renderer processes for the sites being shown plus GPU and utility helper processes. The group for folder B has its own browser process, which only control 3 talks to. On the right, each browser process reads and writes its own user data folder, which holds cookies, local storage, the cache, and permissions. A note says another app run by the same user that names folder A joins group A rather than starting a new browser process.</desc>
