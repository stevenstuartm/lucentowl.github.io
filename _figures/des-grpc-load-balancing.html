---
title: "Balancing gRPC Connections and Calls"
kind: flow
system: architecture-design
summary: "Connection-level balancing pins each client to one pod."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="dgl-title dgl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dgl-title">Layer 4 connection balancing compared with call-level balancing for gRPC</title>
<desc id="dgl-desc">Two panels. With layer 4, connection-level balancing, client A holds one connection that the load balancer sends to pod 1, and client B holds one connection sent to pod 2, so each pod receives all of one client's calls and pod 3 stays idle, including after scale-out. With layer 7 or client-side, call-level balancing, client A's single connection reaches a proxy or balancing client that spreads its calls across pods 1, 2, and 3.</desc>
