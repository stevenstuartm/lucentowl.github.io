title: "Health Checks Routed to Kubernetes Probes"
kind: flow
system: aspnet-core
summary: "How tags send each check to a probe, and what each probe's failure does."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="ahp-title ahp-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="ahp-title">Registered health checks routed by tag to liveness and readiness endpoints and Kubernetes probes</title>
<desc id="ahp-desc">Three health checks are registered. The self check carries the live tag and always returns Healthy. The database and external-api checks carry the ready tag. The /health/live endpoint's predicate selects checks tagged live, so it runs only the self check. The /health/ready endpoint's predicate selects checks tagged ready, so it runs the other two. The liveness probe calls /health/live and reads the status code, 200 or 503; when it fails failureThreshold times in a row, the kubelet restarts the container. The readiness probe calls /health/ready; when it fails, the pod is removed from the Service's endpoints and gets no traffic, but it is not restarted and probing continues. A database outage therefore fails readiness on every pod, which leave rotation together, while liveness never runs the database check and so can't cause restarts.</desc>
