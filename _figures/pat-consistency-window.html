---
title: "The Eventual Consistency Window"
kind: chart
system: distributed-patterns
summary: "Two copies disagree between a write and convergence."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="pcw-title pcw-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="pcw-title">Eventual consistency window between a write model and a read model</title>
<desc id="pcw-desc">A timeline with two rows. The write model changes from the old value to the new value when a write commits. The read model keeps the old value until it catches up some time later. Between the two moments is the window, when the copies disagree. The user who just made the write, reading during the window, sees the old value. A reader after the window sees the new value.</desc>
