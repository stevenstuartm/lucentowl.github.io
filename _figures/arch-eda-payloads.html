---
title: "Data-Based and Key-Based Events"
kind: flow
system: architecture-styles
summary: "A full payload versus an identifier the subscriber has to look up."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="epl-title epl-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="epl-title">Data-based events versus key-based events</title>
<desc id="epl-desc">On the left, a data-based OrderPlaced event carries customer details, items, prices, and the shipping address, and the subscriber acts on it without querying anything. On the right, a key-based OrderPlaced event carries only the order ID, and the subscriber queries the order service for the details it needs. That query needs the source to be available at runtime, and it returns the data as it is at query time, which may differ from its state when the event occurred.</desc>

.epl-k { font-size: 10.5px; font-style: italic; fill: var(--color-text-light, #4A5568); }
.epl-s { font-size: 11.5px; fill: var(--color-text-light, #4A5568); }

.epl-ctl { fill: none; stroke: var(--color-purple, #6B3FA0); stroke-width: 1.75; stroke-dasharray: 6 4; }
.epl-red { fill: none; stroke: var(--color-accent, #A5486E); stroke-width: 2; }
</style>
