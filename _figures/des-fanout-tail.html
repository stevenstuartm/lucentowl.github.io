---
title: "Tail Latency Under Fan-Out"
kind: flow
system: architecture-design
summary: "Waiting on 100 servers makes a 1% tail the common case."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dft-title dft-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="dft-title">A user request fanning out to 100 servers with a one-second p99</title>
<desc id="dft-desc">A user request reaches a front end, which calls 100 servers in parallel, each with a p99 latency of one second, and waits for all of them. The probability that all 100 beat one second is 0.99 to the power 100, about 0.37, so about 63 percent of user requests take longer than one second.</desc>
