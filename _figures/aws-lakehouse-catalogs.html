<title id="awslhc-title">Lakehouse architecture of Amazon SageMaker</title>
<desc id="awslhc-desc">Query and processing engines, Athena, Redshift, Spark on EMR and Glue, and other Apache Iceberg engines connecting through an Iceberg REST endpoint, all look up tables in one catalog layer built on the AWS Glue Data Catalog, with AWS Lake Formation checking permissions and vending credentials. Beneath the catalog layer sit four kinds of catalog: an S3 data lake of files in general purpose buckets, S3 table buckets holding managed Iceberg tables, tables stored in Redshift Managed Storage, and federated sources such as other databases that are queried in place. Engines read each store directly after the catalog lookup, so one copy of each table serves every engine.</desc>
