<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" role="img" aria-labelledby="aimo-title aimo-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="aimo-title">Mixture-of-experts routing inside one layer</title>
<desc id="aimo-desc">A mixture-of-experts layer. One token's representation goes to a router, which picks the top 2 of 8 experts. Experts 2 and 6 run, with weights 0.7 and 0.3, and the other six stay idle for this token. The two outputs are combined in a weighted sum and passed to the next layer. All eight experts sit in GPU memory. Compute follows the active parameters, 37 billion per token for DeepSeek-V3, while memory follows the total, all 671 billion.</desc>
