---
title: "SignalR Scale-Out"
kind: deployment
system: aspnet-core
summary: "Two ways to scale out: a Redis backplane, or Azure SignalR Service."
---
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="asr-title asr-desc" style="width:100%; min-width:680px; height:auto; display:block;">
<title id="asr-title">SignalR scale-out with a Redis backplane and with Azure SignalR Service</title>
<desc id="asr-desc">With a Redis backplane, clients reach the app servers through a load balancer that must keep each connection on one server with sticky sessions. Each server holds its own clients' connections and relays messages for other servers' clients through Redis publish and subscribe. With Azure SignalR Service, clients negotiate with the app and then hold their connections to the service. Each app server keeps only a few connections to the service and runs the hub logic, so no sticky sessions are needed.</desc>
